 tools:  read file, create docx, validate schema \nversion: 1.0.0\nowner: product team\n   \n\n  Bid Document Preparation Skill\n\n   When to use\n  用户提供招标文件并要求分析投标响应材料。\n  用户要求生成标书、响应矩阵、偏离表或商务技术响应文件。\n\n   When not to use\n  用户只是询问普通写作建议。\n  用户没有提供任何招标资料，也没有要求生成标书。\n\n   Workflow\n1. 读取招标文件。\n2. 识别资格、商务、技术、报价、格式、签章、截止时间要求。\n3. 输出缺失资料清单。\n4. 收集用户补充资料。\n5. 生成响应矩阵。\n6. 按模板生成文档。\n7. 执行 Schema 与完整性校验。\n8. 输出交付物和风险提示。\n\n   Output requirements\n  必须输出资料清单、缺失项、风险项、生成文件、校验结果。\n  不得编造未提供的资质、业绩、授权文件。\n   \n\n产品经理要把  SKILL.md  当作“Agent 任务操作手册”，不是当作宣传文案。\n\n    26.5 Description 与触发机制\n\nSkill 的  description  极其重要，因为 Agent 通常先看到 Skill 的名称和描述，再决定是否读取完整 Skill 内容。\n\n好的 description 应该具备：\n\n  明确任务类型。\n  明确输入条件。\n  明确输出结果。\n  明确领域边界。\n  避免过宽的营销词。\n\n对比：\n\n  类型   示例   问题  \n             \n  过宽    Helps with documents.    几乎所有文档任务都会误触发  \n  过窄    Use only for Guangzhou 2026 property firefighting bid technical proposal chapter 3.2.    稍微换个场景就不会触发  \n  推荐    Use when analyzing tender documents, extracting bid requirements, identifying missing response materials, and generating structured proposal documents.    任务、输入、输出、边界都较清楚  \n\n    26.6 Progressive Disclosure：按需加载\n\nProgressive Disclosure 的核心思想是：不要把所有 Skill 的完整内容一次性塞进上下文，而是分阶段加载。\n\n   text\nDiscovery：启动时只看到 Skill 名称、description、路径\n→ Activation：任务匹配时读取完整 SKILL.md\n→ Execution：执行时按需读取 references、scripts、assets、evals\n   \n\n产品价值：\n\n  减少上下文浪费。\n  避免多 Skill 互相干扰。\n  让 Agent 只在需要时读取复杂规则。\n  支持团队维护大量可复用能力包。\n\n    26.7 references / scripts / assets 怎么设计\n\n     references：放稳定知识，不放临时指令\n\n适合放：\n\n  标准作业流程。\n  行业术语表。\n  写作规范。\n  评分规则。\n  合规要求。\n  示例与反例。\n\n不适合放：\n\n  当前用户的一次性需求。\n  未确认的临时资料。\n  与 Skill 无关的大段背景。\n\n     scripts：确定性任务交给脚本\n\n适合脚本处理：\n\n  JSON Schema 校验。\n  Excel / CSV 字段检查。\n  文档目录完整性检查。\n  重复文件检测。\n  批量命名、格式转换、统计。\n  固定模板填充。\n\n原则：\n\n  模型擅长理解、归纳、生成；脚本擅长确定性校验、格式转换、批处理。能确定性执行的，不要交给模型自由发挥。\n\n     assets：沉淀模板和样例\n\n适合放：\n\n  Word 模板。\n  Excel 模板。\n  PPT 模板。\n  图片素材。\n  示例输入 / 示例输出。\n\n    26.8 allowed tools 与权限边界\n\nSkill 不是越强越好。每个 Skill 都应该限制可以使用的工具。\n\n示例：\n\n  Skill 类型   允许工具   禁止工具  \n             \n  文档分析 Skill   读取文件、生成文档、Schema 校验   删除文件、发送邮件、执行系统命令  \n  代码审查 Skill   读取代码、运行测试、生成报告   自动合并、发布生产、删除分支  \n  财务测算 Skill   读取表格、计算、生成报表   自动付款、修改正式财务系统  \n  客服回复 Skill   检索知识库、生成草稿   自动承诺赔付、自动修改客户资料  \n\n产品经理在 PRD 中应明确：\n\n   text\nSkill 权限要求：\n1. 只读工具有哪些？\n2. 可写工具有哪些？\n3. 哪些动作必须人工确认？\n4. 哪些工具调用需要审计日志？\n5. 哪些失败必须中止，不能重试？\n   \n\n    26.9 Skill 设计原则\n\n1.   单一职责  ：一个 Skill 只解决一类任务，不做万能助手。\n2.   触发清晰  ：description 能准确描述该触发和不该触发的边界。\n3.   流程明确  ：步骤能被 Agent 按顺序执行。\n4.   输入可校验  ：缺资料时先提问，不直接编造。\n5.   输出结构化  ：能被后续系统读取、校验、归档。\n6.   风险可控  ：高风险动作必须人审。\n7.   可评测  ：有触发测试、输出测试、回归测试。\n8.   可版本化  ：变更可追踪，失败可回滚。\n9.   可组合  ：能和 MCP、Workflow、Hook、Subagent 协同。\n10.   可移交  ：其他人能看懂、维护、复用。\n\n    26.10 Skill 评测方法\n\nSkill 也需要评测，不然它只是换了位置的长 Prompt。\n\n  评测类型   目的   示例  \n             \n  Trigger Eval   应该触发时是否触发   用户说“帮我分析招标文件并列缺失资料”  \n  Non trigger Eval   不该触发时是否误触发   用户说“帮我润色一段宣传文案”  \n  Output Eval   输出是否满足要求   是否包含缺失项、风险项、响应矩阵  \n  Tool Eval   工具使用是否正确   是否调用了文档解析和校验脚本  \n  Safety Eval   是否越权或编造   是否编造资质、业绩、报价  \n  Regression Eval   新版本是否破坏旧能力   v1.1 用例在 v1.2 是否仍通过  \n  With / Without Skill 对比   Skill 是否真的提升效果   同一任务有无 Skill 的质量差异  \n\n    26.11 Skill 版本治理\n\nSkill 应该像产品能力一样治理。\n\n  治理项   要求  \n         \n  命名规范   名称表达领域和任务，不用泛化词  \n  版本号   建议语义化版本，例如 1.2.0  \n  维护人   明确 owner 和评审人  \n  适用范围   写清楚适用业务、工具、数据边界  \n  变更记录   每次修改说明改了什么、为什么改  \n  测试集   Trigger / Non trigger / Output / Regression  \n  权限   allowed tools、禁止动作、人审节点  \n  发布   先灰度，再全量  \n  回滚   新版误触发或输出下降时能回退  \n  外部 Skill 审查   第三方 Skill 视为不可信代码和不可信指令  \n\n    26.12 Skill 安全风险\n\nSkill 的风险主要来自四类：\n\n1.   误触发风险  ：不该启用 Skill 时启用，导致输出跑偏。\n2.   越权风险  ：Skill 调用了超出任务所需的工具。\n3.   供应链风险  ：第三方 Skill 中夹带恶意指令、脚本或隐性触发词。\n4.   维护风险  ：Skill 过期、规则冲突、没人维护，导致 Agent 行为不可控。\n\n安全原则：\n\n   text\n外部 Skill 先审查再启用。\n高风险 Skill 默认禁用写操作。\nSkill 触发和工具调用必须留痕。\nSkill 更新必须跑回归测试。\n任何涉及资金、权限、生产系统、合同承诺的动作必须人工确认。\n   \n\n    26.13 AI 产品经理如何设计一个 Skill 包\n\n建议流程：\n\n   text\n选择重复任务\n→ 定义触发条件\n→ 定义不触发边界\n→ 拆解执行步骤\n→ 准备参考资料和模板\n→ 判断哪些步骤用脚本\n→ 限定 allowed tools\n→ 设计输出 Schema\n→ 编写 Trigger / Non trigger / Output 测试\n→ 灰度试用\n→ 收集错误样本\n→ 版本迭代\n   \n\n一个合格的 Skill 交付包至少包括：\n\n   SKILL.md \n  触发与不触发样例\n  输入 / 输出样例\n  权限清单\n  风险边界\n  测试用例\n  变更记录\n  使用说明\n\n   \n\n   ", "is_new": true}, {"num": 27, "title": "Agent Instruction：AGENTS.md、CLAUDE.md、GEMINI.md 与 Rules", "html": "<h2>27. Agent Instruction：AGENTS.md、CLAUDE.md、GEMINI.md 与 Rules</h2>\n<blockquote>\n<p>本章是 v1.2 新增内容。它解决的问题是：Agent 每次进入一个项目时，如何知道项目结构、开发规范、测试命令、权限边界、交付标准，而不是每次都靠用户重新解释。</p>\n</blockquote>\n<h3>27.1 为什么 Agent 需要项目级上下文</h3>\n<p>传统人类协作中，新成员会读 README、架构文档、开发规范、测试说明。Agent 也一样，需要稳定的项目级上下文。</p>\n<p>没有项目级上下文时，Agent 容易出现：</p>\n<ul>\n<li>不知道项目怎么启动。</li>\n<li>不知道测试命令是什么。</li>\n<li>修改了不该修改的目录。</li>\n<li>忽略团队代码风格。</li>\n<li>不知道哪些文件是生成物。</li>\n<li>不知道安全边界和禁止动作。</li>\n<li>每次任务都反复探索，浪费 Token 和时间。</li>\n</ul>\n<h3>27.2 AGENTS.md：Agent 版 README</h3>\n<p><code>AGENTS.md</code> 可以理解成“给 Agent 看的 README”。它适合写：</p>\n<pre><code class=\"language-markdown\"># AGENTS.md\n\n## Project Overview\n项目是什么，核心架构是什么。\n\n## Setup Commands\n- pnpm install\n- pnpm dev\n- pnpm test\n\n## Code Style\n- TypeScript strict mode\n- 组件放在 apps/web/src/components\n- 不允许直接修改生成文件\n\n## Testing Rules\n- 修改核心逻辑后必须运行 pnpm test\n- 修改 UI 后必须运行 E2E 测试\n\n## Safety Rules\n- 不要读取 .env\n- 不要提交密钥\n- 不要执行删除数据库的命令\n\n## Completion Criteria\n- 测试通过\n- 文档更新\n- 输出修改摘要\n</code></pre>\n<p>产品经理使用 <code>AGENTS.md</code> 的重点不是写技术细节，而是把项目的协作规则、验收标准、边界条件沉淀下来。</p>\n<h3>27.3 CLAUDE.md / GEMINI.md / Cursor Rules / Copilot Instructions</h3>\n<p>不同 Agent 工具有不同的项目规则文件。产品经理不需要背所有工具语法，但要理解它们属于同一类机制：<strong>长期上下文与规则注入</strong>。</p>\n<table>\n<thead>\n<tr>\n  <th>文件 / 机制</th>\n  <th>常见用途</th>\n  <th>产品经理理解</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><code>AGENTS.md</code></td>\n  <td>面向 coding agents 的通用说明</td>\n  <td>Agent 版 README</td>\n</tr>\n<tr>\n  <td><code>CLAUDE.md</code></td>\n  <td>Claude Code 项目规则</td>\n  <td>Claude 进入项目后的长期上下文</td>\n</tr>\n<tr>\n  <td><code>GEMINI.md</code></td>\n  <td>Gemini CLI 项目规则</td>\n  <td>Gemini 的项目级指令文件</td>\n</tr>\n<tr>\n  <td><code>.github/copilot-instructions.md</code></td>\n  <td>GitHub Copilot 仓库级指令</td>\n  <td>仓库级统一规则</td>\n</tr>\n<tr>\n  <td><code>.github/instructions/*.instructions.md</code></td>\n  <td>GitHub Copilot 路径级指令</td>\n  <td>不同目录不同规则</td>\n</tr>\n<tr>\n  <td>Cursor Rules</td>\n  <td>Cursor 中的项目 / 路径规则</td>\n  <td>IDE 内的上下文规则</td>\n</tr>\n</tbody>\n</table>\n<h3>27.4 全局规则、项目规则、目录规则</h3>\n<p>Agent 规则通常有层级：</p>\n<pre><code class=\"language-text\">全局规则：用户或组织长期偏好\n→ 项目规则：当前项目架构、命令、约束\n→ 目录规则：某个模块、语言、文件类型的特殊要求\n→ 本次 Prompt：当前任务目标和输入\n</code></pre>\n<p>设计原则：</p>\n<ul>\n<li>全局规则放长期偏好，不放项目细节。</li>\n<li>项目规则放架构、命令、验收标准。</li>\n<li>目录规则放局部约束，避免污染全项目。</li>\n<li>本次 Prompt 只放当前任务，不重复长期规则。</li>\n</ul>\n<h3>27.5 Rule 与 Skill 的边界</h3>\n<table>\n<thead>\n<tr>\n  <th>对比项</th>\n  <th>Rule / Instruction</th>\n  <th>Skill</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>作用</td>\n  <td>约束 Agent 在项目中如何行动</td>\n  <td>教 Agent 如何完成某类任务</td>\n</tr>\n<tr>\n  <td>生命周期</td>\n  <td>长期存在，持续生效</td>\n  <td>按任务触发，按需加载</td>\n</tr>\n<tr>\n  <td>内容</td>\n  <td>项目背景、命令、风格、禁止项</td>\n  <td>流程、模板、参考资料、脚本、评测</td>\n</tr>\n<tr>\n  <td>粒度</td>\n  <td>项目 / 目录 / 团队级</td>\n  <td>任务能力级</td>\n</tr>\n<tr>\n  <td>风险</td>\n  <td>写太多会增加负担、造成冲突</td>\n  <td>描述不准会误触发或漏触发</td>\n</tr>\n</tbody>\n</table>\n<p>判断方法：</p>\n<ul>\n<li>“所有任务都应该知道”的内容，放 Rule。</li>\n<li>“只有做某类任务才需要”的内容，放 Skill。</li>\n<li>“必须确定性执行”的校验，放 Hook。</li>\n<li>“需要调用外部系统”的动作，放 Tool / MCP。</li>\n</ul>\n<h3>27.6 Rule 与 Prompt 的边界</h3>\n<table>\n<thead>\n<tr>\n  <th>内容</th>\n  <th>放 Rule</th>\n  <th>放 Prompt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>项目架构</td>\n  <td>是</td>\n  <td>否，除非本次相关</td>\n</tr>\n<tr>\n  <td>测试命令</td>\n  <td>是</td>\n  <td>否，除非要求执行</td>\n</tr>\n<tr>\n  <td>当前需求</td>\n  <td>否</td>\n  <td>是</td>\n</tr>\n<tr>\n  <td>当前输入资料</td>\n  <td>否</td>\n  <td>是</td>\n</tr>\n<tr>\n  <td>输出格式</td>\n  <td>可放通用格式</td>\n  <td>本次特殊格式放 Prompt</td>\n</tr>\n<tr>\n  <td>禁止动作</td>\n  <td>是</td>\n  <td>高风险任务中重复强调</td>\n</tr>\n<tr>\n  <td>交付标准</td>\n  <td>是</td>\n  <td>本次验收重点可强调</td>\n</tr>\n</tbody>\n</table>\n<h3>27.7 规则冲突与优先级</h3>\n<p>规则冲突是多 Agent 系统中的常见问题。</p>\n<p>产品侧建议：</p>\n<pre><code class=\"language-text\">1. 安全规则优先于效率规则。\n2. 用户当前明确指令优先于一般偏好，但不能违反安全与权限规则。\n3. 项目级规则优先于通用建议。\n4. 目录级规则只在对应目录生效。\n5. 冲突无法判断时，Agent 应停止并提问，而不是自行选择。\n</code></pre>\n<h3>27.8 多 Agent 工具共用规则的策略</h3>\n<p>如果团队同时使用 Codex、Claude Code、Cursor、Gemini CLI、Copilot，容易出现规则分散。</p>\n<p>建议策略：</p>\n<table>\n<thead>\n<tr>\n  <th>做法</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>建立一份主规则源</td>\n  <td>例如 <code>AGENTS.md</code> 作为基础版本</td>\n</tr>\n<tr>\n  <td>工具文件做轻量适配</td>\n  <td><code>CLAUDE.md</code>、<code>GEMINI.md</code> 只写工具特有内容</td>\n</tr>\n<tr>\n  <td>避免重复粘贴大段规则</td>\n  <td>防止版本漂移</td>\n</tr>\n<tr>\n  <td>规则保持最小必要</td>\n  <td>规则越长，不一定越好</td>\n</tr>\n<tr>\n  <td>定期清理过期规则</td>\n  <td>避免 Agent 遵守旧约束</td>\n</tr>\n<tr>\n  <td>建立变更记录</td>\n  <td>规则变化影响 Agent 行为</td>\n</tr>\n</tbody>\n</table>\n<h3>27.9 AI 产品经理如何维护 Agent 规则库</h3>\n<p>维护清单：</p>\n<ul>\n<li>项目简介是否准确？</li>\n<li>架构说明是否过期？</li>\n<li>启动 / 测试命令是否可运行？</li>\n<li>禁止修改目录是否明确？</li>\n<li>安全规则是否覆盖密钥、权限、数据？</li>\n<li>完成标准是否可验证？</li>\n<li>是否存在互相矛盾的规则？</li>\n<li>是否把本该放 Skill 的流程堆进了 Rule？</li>\n<li>是否把本该用 Hook 的校验写成了“请尽量”？</li>\n</ul>\n<hr />\n<hr />\n", "plain": "   27. Agent Instruction：AGENTS.md、CLAUDE.md、GEMINI.md 与 Rules\n\n  本章是 v1.2 新增内容。它解决的问题是：Agent 每次进入一个项目时，如何知道项目结构、开发规范、测试命令、权限边界、交付标准，而不是每次都靠用户重新解释。\n\n    27.1 为什么 Agent 需要项目级上下文\n\n传统人类协作中，新成员会读 README、架构文档、开发规范、测试说明。Agent 也一样，需要稳定的项目级上下文。\n\n没有项目级上下文时，Agent 容易出现：\n\n  不知道项目怎么启动。\n  不知道测试命令是什么。\n  修改了不该修改的目录。\n  忽略团队代码风格。\n  不知道哪些文件是生成物。\n  不知道安全边界和禁止动作。\n  每次任务都反复探索，浪费 Token 和时间。\n\n    27.2 AGENTS.md：Agent 版 README\n\n AGENTS.md  可以理解成“给 Agent 看的 README”。它适合写：\n\n   markdown\n  AGENTS.md\n\n   Project Overview\n项目是什么，核心架构是什么。\n\n   Setup Commands\n  pnpm install\n  pnpm dev\n  pnpm test\n\n   Code Style\n  TypeScript strict mode\n  组件放在 apps/web/src/components\n  不允许直接修改生成文件\n\n   Testing Rules\n  修改核心逻辑后必须运行 pnpm test\n  修改 UI 后必须运行 E2E 测试\n\n   Safety Rules\n  不要读取 .env\n  不要提交密钥\n  不要执行删除数据库的命令\n\n   Completion Criteria\n  测试通过\n  文档更新\n  输出修改摘要\n   \n\n产品经理使用  AGENTS.md  的重点不是写技术细节，而是把项目的协作规则、验收标准、边界条件沉淀下来。\n\n    27.3 CLAUDE.md / GEMINI.md / Cursor Rules / Copilot Instructions\n\n不同 Agent 工具有不同的项目规则文件。产品经理不需要背所有工具语法，但要理解它们属于同一类机制：  长期上下文与规则注入  。\n\n  文件 / 机制   常见用途   产品经理理解  \n             \n   AGENTS.md    面向 coding agents 的通用说明   Agent 版 README  \n   CLAUDE.md    Claude Code 项目规则   Claude 进入项目后的长期上下文  \n   GEMINI.md    Gemini CLI 项目规则   Gemini 的项目级指令文件  \n   .github/copilot instructions.md    GitHub Copilot 仓库级指令   仓库级统一规则  \n   .github/instructions/ .instructions.md    GitHub Copilot 路径级指令   不同目录不同规则  \n  Cursor Rules   Cursor 中的项目 / 路径规则   IDE 内的上下文规则  \n\n    27.4 全局规则、项目规则、目录规则\n\nAgent 规则通常有层级：\n\n   text\n全局规则：用户或组织长期偏好\n→ 项目规则：当前项目架构、命令、约束\n→ 目录规则：某个模块、语言、文件类型的特殊要求\n→ 本次 Prompt：当前任务目标和输入\n   \n\n设计原则：\n\n  全局规则放长期偏好，不放项目细节。\n  项目规则放架构、命令、验收标准。\n  目录规则放局部约束，避免污染全项目。\n  本次 Prompt 只放当前任务，不重复长期规则。\n\n    27.5 Rule 与 Skill 的边界\n\n  对比项   Rule / Instruction   Skill  \n             \n  作用   约束 Agent 在项目中如何行动   教 Agent 如何完成某类任务  \n  生命周期   长期存在，持续生效   按任务触发，按需加载  \n  内容   项目背景、命令、风格、禁止项   流程、模板、参考资料、脚本、评测  \n  粒度   项目 / 目录 / 团队级   任务能力级  \n  风险   写太多会增加负担、造成冲突   描述不准会误触发或漏触发  \n\n判断方法：\n\n  “所有任务都应该知道”的内容，放 Rule。\n  “只有做某类任务才需要”的内容，放 Skill。\n  “必须确定性执行”的校验，放 Hook。\n  “需要调用外部系统”的动作，放 Tool / MCP。\n\n    27.6 Rule 与 Prompt 的边界\n\n  内容   放 Rule   放 Prompt  \n             \n  项目架构   是   否，除非本次相关  \n  测试命令   是   否，除非要求执行  \n  当前需求   否   是  \n  当前输入资料   否   是  \n  输出格式   可放通用格式   本次特殊格式放 Prompt  \n  禁止动作   是   高风险任务中重复强调  \n  交付标准   是   本次验收重点可强调  \n\n    27.7 规则冲突与优先级\n\n规则冲突是多 Agent 系统中的常见问题。\n\n产品侧建议：\n\n   text\n1. 安全规则优先于效率规则。\n2. 用户当前明确指令优先于一般偏好，但不能违反安全与权限规则。\n3. 项目级规则优先于通用建议。\n4. 目录级规则只在对应目录生效。\n5. 冲突无法判断时，Agent 应停止并提问，而不是自行选择。\n   \n\n    27.8 多 Agent 工具共用规则的策略\n\n如果团队同时使用 Codex、Claude Code、Cursor、Gemini CLI、Copilot，容易出现规则分散。\n\n建议策略：\n\n  做法   说明  \n         \n  建立一份主规则源   例如  AGENTS.md  作为基础版本  \n  工具文件做轻量适配    CLAUDE.md 、 GEMINI.md  只写工具特有内容  \n  避免重复粘贴大段规则   防止版本漂移  \n  规则保持最小必要   规则越长，不一定越好  \n  定期清理过期规则   避免 Agent 遵守旧约束  \n  建立变更记录   规则变化影响 Agent 行为  \n\n    27.9 AI 产品经理如何维护 Agent 规则库\n\n维护清单：\n\n  项目简介是否准确？\n  架构说明是否过期？\n  启动 / 测试命令是否可运行？\n  禁止修改目录是否明确？\n  安全规则是否覆盖密钥、权限、数据？\n  完成标准是否可验证？\n  是否存在互相矛盾的规则？\n  是否把本该放 Skill 的流程堆进了 Rule？\n  是否把本该用 Hook 的校验写成了“请尽量”？\n\n   \n\n   ", "is_new": true}, {"num": 28, "title": "Agent 工程化组合模式", "html": "<h2>28. Agent 工程化组合模式</h2>\n<blockquote>\n<p>本章是 v1.2 新增内容。它把 Skill、MCP、Hook、Subagent、Instruction、Workflow、Harness 放到同一张落地图里，帮助产品经理判断不同机制应该如何组合。</p>\n</blockquote>\n<h3>28.1 组合模式总览</h3>\n<pre><code class=\"language-text\">业务任务\n→ 判断任务复杂度 Agent Hardness\n→ 选择 LLM / RAG / Workflow / Agent\n→ 用 Instruction 提供长期规则\n→ 用 Skill 封装重复任务流程\n→ 用 MCP / Tool 连接外部系统\n→ 用 Hook 做确定性校验和拦截\n→ 用 Subagent 做复杂任务分工\n→ 用 Harness 管理状态、上下文、权限、日志、回滚\n→ 用 Eval / Governance 做质量与安全闭环\n</code></pre>\n<h3>28.2 Skill + MCP：能力包调用外部工具</h3>\n<p>适合：需要让 Agent 按固定方法调用外部系统完成任务。</p>\n<p>示例：合同审查 Skill 调用以下 MCP 工具：</p>\n<ul>\n<li>合同文档读取工具。</li>\n<li>企业制度知识库检索工具。</li>\n<li>法务风险条款库检索工具。</li>\n<li>审查结果写入工单工具。</li>\n</ul>\n<p>产品设计要点：</p>\n<table>\n<thead>\n<tr>\n  <th>要点</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Skill 定义流程</td>\n  <td>先读合同，再检索制度，再输出风险</td>\n</tr>\n<tr>\n  <td>MCP 提供动作</td>\n  <td>读取、检索、写入、查询</td>\n</tr>\n<tr>\n  <td>权限分级</td>\n  <td>法务资料按角色访问</td>\n</tr>\n<tr>\n  <td>输出校验</td>\n  <td>风险等级、依据、建议必须结构化</td>\n</tr>\n<tr>\n  <td>人工确认</td>\n  <td>高风险条款不能自动判定最终结论</td>\n</tr>\n</tbody>\n</table>\n<h3>28.3 Skill + Hook：模型指导 + 确定性校验</h3>\n<p>适合：任务需要模型理解和生成，但关键质量门槛必须确定性检查。</p>\n<p>示例：标书制作 Skill + Hook。</p>\n<pre><code class=\"language-text\">Skill 指导 Agent 分析招标文件、列出响应项、生成文档\nHook 在输出前强制检查：\n- 必填章节是否齐全\n- 响应矩阵是否为空\n- 是否存在“虚构资质 / 业绩”风险词\n- JSON / 表格结构是否合格\n- 是否生成风险提示\n</code></pre>\n<p>原则：</p>\n<blockquote>\n<p>Skill 负责让 Agent 知道“怎么做”；Hook 负责确保“没做到就不能过”。</p>\n</blockquote>\n<h3>28.4 Skill + Subagent：复杂任务拆分执行</h3>\n<p>适合：任务复杂、资料多、可以分工处理。</p>\n<p>示例：AI 原型生成工作台中的任务拆分：</p>\n<table>\n<thead>\n<tr>\n  <th>子任务</th>\n  <th>子代理</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>需求理解</td>\n  <td>Requirement Subagent</td>\n</tr>\n<tr>\n  <td>页面结构设计</td>\n  <td>UX Subagent</td>\n</tr>\n<tr>\n  <td>组件映射</td>\n  <td>Component Registry Subagent</td>\n</tr>\n<tr>\n  <td>代码生成</td>\n  <td>Codegen Subagent</td>\n</tr>\n<tr>\n  <td>测试校验</td>\n  <td>QA Subagent</td>\n</tr>\n<tr>\n  <td>文档总结</td>\n  <td>Documentation Subagent</td>\n</tr>\n</tbody>\n</table>\n<p>产品注意事项：</p>\n<ul>\n<li>子代理输出必须有统一结构。</li>\n<li>主 Agent 必须做汇总与冲突处理。</li>\n<li>子代理之间不要无限对话。</li>\n<li>高风险动作仍由主流程控制。</li>\n<li>每个子代理都要有任务边界和完成标准。</li>\n</ul>\n<h3>28.5 AGENTS.md + Skill：长期规则 + 任务流程</h3>\n<p>适合：软件开发、标书制作、数据治理等长期项目。</p>\n<p>示例：</p>\n<pre><code class=\"language-text\">AGENTS.md：\n- 项目架构\n- 禁止修改范围\n- 测试命令\n- 输出摘要格式\n- 安全规则\n\nSkill：\n- 需求拆解流程\n- 代码审查流程\n- 文档生成流程\n- 索引维护流程\n- 发布检查流程\n</code></pre>\n<p>边界：</p>\n<ul>\n<li><code>AGENTS.md</code> 解决“这个项目长期怎么协作”。</li>\n<li><code>Skill</code> 解决“这类任务具体怎么执行”。</li>\n</ul>\n<h3>28.6 Workflow + Agent：固定流程与动态执行结合</h3>\n<p>适合：企业业务流程中大部分步骤固定，但部分节点需要智能判断。</p>\n<p>示例：AI 巡检工单流程。</p>\n<pre><code class=\"language-text\">巡检异常上报\n→ Workflow 固定创建工单\n→ RAG 检索设备和历史故障\n→ Agent 判断可能原因和处理建议\n→ 人工确认派单\n→ 工程师处理\n→ Agent 生成闭环摘要\n→ Workflow 归档和统计\n</code></pre>\n<p>产品原则：</p>\n<ul>\n<li>固定流程用 Workflow，不要让 Agent 自由决定。</li>\n<li>开放判断节点用 Agent。</li>\n<li>高风险业务动作必须人审。</li>\n<li>每个节点都要有失败兜底。</li>\n</ul>\n<h3>28.7 企业级案例：标书制作 Skill 包</h3>\n<p>这是与你当前长期项目高度相关的案例。</p>\n<h4>目标</h4>\n<p>把“招标文件分析 → 缺失资料提问 → 响应矩阵 → 标书生成 → 校验 → 交付摘要”沉淀成可复用 Skill 包。</p>\n<h4>Skill 结构</h4>\n<pre><code class=\"language-text\">bid-skill/\n├─ SKILL.md\n├─ references/\n│  ├─ bid-analysis-rules.md\n│  ├─ response-matrix-template.md\n│  ├─ common-risk-checklist.md\n│  └─ docx-output-rules.md\n├─ scripts/\n│  ├─ validate_required_sections.py\n│  ├─ validate_response_matrix.py\n│  └─ detect_placeholder_text.py\n├─ assets/\n│  ├─ technical-proposal-template.docx\n│  ├─ business-proposal-template.docx\n│  └─ response-matrix.xlsx\n└─ evals/\n   ├─ trigger_cases.jsonl\n   ├─ non_trigger_cases.jsonl\n   ├─ missing_info_cases.jsonl\n   └─ output_quality_cases.jsonl\n</code></pre>\n<h4>关键约束</h4>\n<pre><code class=\"language-text\">1. 不得编造资质、业绩、授权、人员证书。\n2. 无资料支撑时必须列为缺失项。\n3. 投标截止时间、格式要求、签章要求必须显式提取。\n4. 技术响应和商务响应必须分开。\n5. 风险项必须说明来源位置。\n6. 输出前必须执行完整性校验。\n</code></pre>\n<h4>交付物</h4>\n<table>\n<thead>\n<tr>\n  <th>交付物</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>招标要求摘要</td>\n  <td>资格、商务、技术、报价、格式、时间</td>\n</tr>\n<tr>\n  <td>缺失资料清单</td>\n  <td>需要用户补充的资料</td>\n</tr>\n<tr>\n  <td>响应矩阵</td>\n  <td>每条要求如何响应</td>\n</tr>\n<tr>\n  <td>风险项清单</td>\n  <td>可能扣分、废标、无法响应的点</td>\n</tr>\n<tr>\n  <td>标书草稿</td>\n  <td>按模板生成</td>\n</tr>\n<tr>\n  <td>校验报告</td>\n  <td>缺章、占位符、未响应项、格式问题</td>\n</tr>\n</tbody>\n</table>\n<h3>28.8 企业级案例：代码审查 Agent</h3>\n<p>组合：<code>AGENTS.md + Code Review Skill + MCP / 工具 + Hook + CI</code>。</p>\n<pre><code class=\"language-text\">AGENTS.md 提供项目架构、测试命令、编码规范\nCode Review Skill 定义审查流程和输出格式\nMCP / 工具读取代码、查 PR、运行测试\nHook 在提交前强制检测密钥、格式、测试结果\nCI 提供最终验证\n</code></pre>\n<p>产品价值：</p>\n<ul>\n<li>减少人工重复审查。</li>\n<li>审查标准统一。</li>\n<li>保留审计记录。</li>\n<li>可通过错误样本持续优化规则和 Skill。</li>\n</ul>\n<h3>28.9 企业级案例：知识库治理 Agent</h3>\n<p>组合：<code>RAG + 数据清洗 SOP + Skill + Workflow + Hook</code>。</p>\n<p>任务：</p>\n<ul>\n<li>识别新增文档。</li>\n<li>判断文档类型和权限。</li>\n<li>检查版本号和有效性。</li>\n<li>清理页眉页脚、重复段落和低质量 OCR。</li>\n<li>生成元数据。</li>\n<li>触发入库。</li>\n<li>运行测试集回归。</li>\n<li>输出知识库更新报告。</li>\n</ul>\n<p>关键策略：</p>\n<table>\n<thead>\n<tr>\n  <th>风险</th>\n  <th>兜底</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文档权限不明</td>\n  <td>不入库，转人工确认</td>\n</tr>\n<tr>\n  <td>版本冲突</td>\n  <td>标记冲突，不覆盖旧版本</td>\n</tr>\n<tr>\n  <td>OCR 质量低</td>\n  <td>进入人工校对池</td>\n</tr>\n<tr>\n  <td>测试集回归下降</td>\n  <td>暂停发布新索引</td>\n</tr>\n<tr>\n  <td>引用来源缺失</td>\n  <td>禁止输出确定答案</td>\n</tr>\n</tbody>\n</table>\n<h3>28.10 组合方案选型表</h3>\n<table>\n<thead>\n<tr>\n  <th>场景</th>\n  <th>推荐组合</th>\n  <th>不建议</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>简单知识问答</td>\n  <td>RAG + Prompt + 引用校验</td>\n  <td>上复杂 Agent</td>\n</tr>\n<tr>\n  <td>固定审批流程</td>\n  <td>Workflow + 人审 + 日志</td>\n  <td>让 Agent 自由决定流程</td>\n</tr>\n<tr>\n  <td>多系统查询</td>\n  <td>Agent + MCP + 权限</td>\n  <td>让模型凭空回答</td>\n</tr>\n<tr>\n  <td>重复文档任务</td>\n  <td>Skill + 模板 + Schema</td>\n  <td>每次手写长 Prompt</td>\n</tr>\n<tr>\n  <td>高风险动作</td>\n  <td>Workflow + Agent 建议 + 人工确认 + 审计</td>\n  <td>Agent 自动执行</td>\n</tr>\n<tr>\n  <td>软件开发 Agent</td>\n  <td>AGENTS.md + Skill + Hook + CI</td>\n  <td>无规则直接让 Agent 改代码</td>\n</tr>\n<tr>\n  <td>长任务研究</td>\n  <td>Subagent + 汇总验证</td>\n  <td>一个上下文里无限堆资料</td>\n</tr>\n<tr>\n  <td>生产级 Agent</td>\n  <td>Harness + Trace + Eval + Governance</td>\n  <td>只做 Demo 无监控</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   28. Agent 工程化组合模式\n\n  本章是 v1.2 新增内容。它把 Skill、MCP、Hook、Subagent、Instruction、Workflow、Harness 放到同一张落地图里，帮助产品经理判断不同机制应该如何组合。\n\n    28.1 组合模式总览\n\n   text\n业务任务\n→ 判断任务复杂度 Agent Hardness\n→ 选择 LLM / RAG / Workflow / Agent\n→ 用 Instruction 提供长期规则\n→ 用 Skill 封装重复任务流程\n→ 用 MCP / Tool 连接外部系统\n→ 用 Hook 做确定性校验和拦截\n→ 用 Subagent 做复杂任务分工\n→ 用 Harness 管理状态、上下文、权限、日志、回滚\n→ 用 Eval / Governance 做质量与安全闭环\n   \n\n    28.2 Skill + MCP：能力包调用外部工具\n\n适合：需要让 Agent 按固定方法调用外部系统完成任务。\n\n示例：合同审查 Skill 调用以下 MCP 工具：\n\n  合同文档读取工具。\n  企业制度知识库检索工具。\n  法务风险条款库检索工具。\n  审查结果写入工单工具。\n\n产品设计要点：\n\n  要点   说明  \n         \n  Skill 定义流程   先读合同，再检索制度，再输出风险  \n  MCP 提供动作   读取、检索、写入、查询  \n  权限分级   法务资料按角色访问  \n  输出校验   风险等级、依据、建议必须结构化  \n  人工确认   高风险条款不能自动判定最终结论  \n\n    28.3 Skill + Hook：模型指导 + 确定性校验\n\n适合：任务需要模型理解和生成，但关键质量门槛必须确定性检查。\n\n示例：标书制作 Skill + Hook。\n\n   text\nSkill 指导 Agent 分析招标文件、列出响应项、生成文档\nHook 在输出前强制检查：\n  必填章节是否齐全\n  响应矩阵是否为空\n  是否存在“虚构资质 / 业绩”风险词\n  JSON / 表格结构是否合格\n  是否生成风险提示\n   \n\n原则：\n\n  Skill 负责让 Agent 知道“怎么做”；Hook 负责确保“没做到就不能过”。\n\n    28.4 Skill + Subagent：复杂任务拆分执行\n\n适合：任务复杂、资料多、可以分工处理。\n\n示例：AI 原型生成工作台中的任务拆分：\n\n  子任务   子代理  \n         \n  需求理解   Requirement Subagent  \n  页面结构设计   UX Subagent  \n  组件映射   Component Registry Subagent  \n  代码生成   Codegen Subagent  \n  测试校验   QA Subagent  \n  文档总结   Documentation Subagent  \n\n产品注意事项：\n\n  子代理输出必须有统一结构。\n  主 Agent 必须做汇总与冲突处理。\n  子代理之间不要无限对话。\n  高风险动作仍由主流程控制。\n  每个子代理都要有任务边界和完成标准。\n\n    28.5 AGENTS.md + Skill：长期规则 + 任务流程\n\n适合：软件开发、标书制作、数据治理等长期项目。\n\n示例：\n\n   text\nAGENTS.md：\n  项目架构\n  禁止修改范围\n  测试命令\n  输出摘要格式\n  安全规则\n\nSkill：\n  需求拆解流程\n  代码审查流程\n  文档生成流程\n  索引维护流程\n  发布检查流程\n   \n\n边界：\n\n   AGENTS.md  解决“这个项目长期怎么协作”。\n   Skill  解决“这类任务具体怎么执行”。\n\n    28.6 Workflow + Agent：固定流程与动态执行结合\n\n适合：企业业务流程中大部分步骤固定，但部分节点需要智能判断。\n\n示例：AI 巡检工单流程。\n\n   text\n巡检异常上报\n→ Workflow 固定创建工单\n→ RAG 检索设备和历史故障\n→ Agent 判断可能原因和处理建议\n→ 人工确认派单\n→ 工程师处理\n→ Agent 生成闭环摘要\n→ Workflow 归档和统计\n   \n\n产品原则：\n\n  固定流程用 Workflow，不要让 Agent 自由决定。\n  开放判断节点用 Agent。\n  高风险业务动作必须人审。\n  每个节点都要有失败兜底。\n\n    28.7 企业级案例：标书制作 Skill 包\n\n这是与你当前长期项目高度相关的案例。\n\n     目标\n\n把“招标文件分析 → 缺失资料提问 → 响应矩阵 → 标书生成 → 校验 → 交付摘要”沉淀成可复用 Skill 包。\n\n     Skill 结构\n\n   text\nbid skill/\n├─ SKILL.md\n├─ references/\n│  ├─ bid analysis rules.md\n│  ├─ response matrix template.md\n│  ├─ common risk checklist.md\n│  └─ docx output rules.md\n├─ scripts/\n│  ├─ validate required sections.py\n│  ├─ validate response matrix.py\n│  └─ detect placeholder text.py\n├─ assets/\n│  ├─ technical proposal template.docx\n│  ├─ business proposal template.docx\n│  └─ response matrix.xlsx\n└─ evals/\n   ├─ trigger cases.jsonl\n   ├─ non trigger cases.jsonl\n   ├─ missing info cases.jsonl\n   └─ output quality cases.jsonl\n   \n\n     关键约束\n\n   text\n1. 不得编造资质、业绩、授权、人员证书。\n2. 无资料支撑时必须列为缺失项。\n3. 投标截止时间、格式要求、签章要求必须显式提取。\n4. 技术响应和商务响应必须分开。\n5. 风险项必须说明来源位置。\n6. 输出前必须执行完整性校验。\n   \n\n     交付物\n\n  交付物   说明  \n         \n  招标要求摘要   资格、商务、技术、报价、格式、时间  \n  缺失资料清单   需要用户补充的资料  \n  响应矩阵   每条要求如何响应  \n  风险项清单   可能扣分、废标、无法响应的点  \n  标书草稿   按模板生成  \n  校验报告   缺章、占位符、未响应项、格式问题  \n\n    28.8 企业级案例：代码审查 Agent\n\n组合： AGENTS.md + Code Review Skill + MCP / 工具 + Hook + CI 。\n\n   text\nAGENTS.md 提供项目架构、测试命令、编码规范\nCode Review Skill 定义审查流程和输出格式\nMCP / 工具读取代码、查 PR、运行测试\nHook 在提交前强制检测密钥、格式、测试结果\nCI 提供最终验证\n   \n\n产品价值：\n\n  减少人工重复审查。\n  审查标准统一。\n  保留审计记录。\n  可通过错误样本持续优化规则和 Skill。\n\n    28.9 企业级案例：知识库治理 Agent\n\n组合： RAG + 数据清洗 SOP + Skill + Workflow + Hook 。\n\n任务：\n\n  识别新增文档。\n  判断文档类型和权限。\n  检查版本号和有效性。\n  清理页眉页脚、重复段落和低质量 OCR。\n  生成元数据。\n  触发入库。\n  运行测试集回归。\n  输出知识库更新报告。\n\n关键策略：\n\n  风险   兜底  \n         \n  文档权限不明   不入库，转人工确认  \n  版本冲突   标记冲突，不覆盖旧版本  \n  OCR 质量低   进入人工校对池  \n  测试集回归下降   暂停发布新索引  \n  引用来源缺失   禁止输出确定答案  \n\n    28.10 组合方案选型表\n\n  场景   推荐组合   不建议  \n             \n  简单知识问答   RAG + Prompt + 引用校验   上复杂 Agent  \n  固定审批流程   Workflow + 人审 + 日志   让 Agent 自由决定流程  \n  多系统查询   Agent + MCP + 权限   让模型凭空回答  \n  重复文档任务   Skill + 模板 + Schema   每次手写长 Prompt  \n  高风险动作   Workflow + Agent 建议 + 人工确认 + 审计   Agent 自动执行  \n  软件开发 Agent   AGENTS.md + Skill + Hook + CI   无规则直接让 Agent 改代码  \n  长任务研究   Subagent + 汇总验证   一个上下文里无限堆资料  \n  生产级 Agent   Harness + Trace + Eval + Governance   只做 Demo 无监控  \n\n   \n\n   ", "is_new": true}, {"num": 29, "title": "如何使用这套知识系统：从 v1.0 到 v1.2", "html": "<h2>29. 如何使用这套知识系统：从 v1.0 到 v1.2</h2>\n<blockquote>\n<p>本章合并原 v1.1 使用建议与 v1.2 使用建议。放在全书后部，是为了让学习者先完成主体知识学习，再回到这里制定学习路径、实操路径和作品集包装路径。</p>\n</blockquote>\n<h3>29.1 版本脉络：每一版解决什么问题</h3>\n<table>\n<thead>\n<tr>\n  <th>版本</th>\n  <th>核心目标</th>\n  <th>解决的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>v1.0</td>\n  <td>建立 AI 产品经理知识框架</td>\n  <td>理解 LLM、RAG、Workflow、Agent、MCP、AI PRD、评测与商业化</td>\n</tr>\n<tr>\n  <td>v1.1</td>\n  <td>补生产级落地颗粒度</td>\n  <td>补工程性能、数据清洗、RAG 优化、异常兜底、评测报告、30 天训练计划</td>\n</tr>\n<tr>\n  <td>v1.2</td>\n  <td>补 Agent 工程化与 Skill 机制</td>\n  <td>补 Agent Hardness、Harness、Skill、Instruction、Hook、Subagent、Skill Eval 与治理</td>\n</tr>\n<tr>\n  <td>v1.2.1</td>\n  <td>优化结构与课件化使用</td>\n  <td>将知识地图和参考来源移动到最后，合并使用建议，形成更完整的学习闭环</td>\n</tr>\n</tbody>\n</table>\n<h3>29.2 推荐学习顺序</h3>\n<p>建议分四轮学习：</p>\n<table>\n<thead>\n<tr>\n  <th>轮次</th>\n  <th>重点章节</th>\n  <th>目标</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第一轮：建立框架</td>\n  <td>0-8 章</td>\n  <td>理解 LLM、RAG、Workflow、Agent、MCP 的关系</td>\n</tr>\n<tr>\n  <td>第二轮：学会设计</td>\n  <td>9-18 章</td>\n  <td>能写 AI PRD、评测标准、交付物清单，并能解释业务价值</td>\n</tr>\n<tr>\n  <td>第三轮：落地训练</td>\n  <td>20-25 章</td>\n  <td>能处理数据、性能、异常、评测和成果包装</td>\n</tr>\n<tr>\n  <td>第四轮：Agent 工程化</td>\n  <td>26-28 章</td>\n  <td>能设计可复用、可控、可评测的 Agent 能力体系</td>\n</tr>\n</tbody>\n</table>\n<h3>29.3 不建议的学习方式</h3>\n<ul>\n<li>不要只背概念，不做 Demo。</li>\n<li>不要只看模型新闻，不理解企业数据和业务流程。</li>\n<li>不要一开始就追求复杂 Agent。</li>\n<li>不要把 RAG 理解成“把 PDF 丢进去”。</li>\n<li>不要没有测试集就说效果好。</li>\n<li>不要没有异常兜底就进入生产。</li>\n<li>不要把 Skill 当成长 Prompt。</li>\n<li>不要把 Hook 交给模型自觉执行。</li>\n<li>不要把 MCP 当成业务逻辑本身。</li>\n</ul>\n<h3>29.4 推荐的最小可行学习闭环</h3>\n<pre><code class=\"language-text\">选一个熟悉场景\n→ 准备 5 份真实资料\n→ 建一个小知识库\n→ 写 30 条测试问题\n→ 设计 Prompt 和 Schema\n→ 跑一轮评测\n→ 整理错误样本\n→ 补异常兜底\n→ 输出 PRD + 评测报告 + 复盘\n</code></pre>\n<h3>29.5 v1.2 后新增的三个实操任务</h3>\n<h4>任务 1：把一个长 Prompt 改造成 Skill</h4>\n<p>选择你已有的复杂 Prompt，例如合同审查、周报生成、标书制作、项目资料整理。</p>\n<p>输出：</p>\n<ul>\n<li><code>SKILL.md</code></li>\n<li>references 目录设计</li>\n<li>scripts 目录设计</li>\n<li>assets 目录设计</li>\n<li>trigger / non-trigger 测试用例</li>\n<li>输出 Schema</li>\n<li>风险边界和 allowed-tools</li>\n</ul>\n<h4>任务 2：为一个项目写 AGENTS.md</h4>\n<p>选择一个软件项目或资料项目。</p>\n<p>输出：</p>\n<ul>\n<li>项目简介。</li>\n<li>启动 / 构建 / 测试命令。</li>\n<li>目录结构说明。</li>\n<li>禁止修改范围。</li>\n<li>安全规则。</li>\n<li>完成标准。</li>\n<li>输出摘要格式。</li>\n</ul>\n<h4>任务 3：设计一个 Agent Harness 方案</h4>\n<p>选择一个 Agent 应用，例如标书制作 Agent、知识库治理 Agent、代码审查 Agent。</p>\n<p>输出：</p>\n<ul>\n<li>任务状态图。</li>\n<li>上下文管理策略。</li>\n<li>Tool / MCP 清单。</li>\n<li>Skill 清单。</li>\n<li>Hook 清单。</li>\n<li>权限矩阵。</li>\n<li>Trace 日志字段。</li>\n<li>Fallback 矩阵。</li>\n<li>回滚策略。</li>\n<li>Eval 指标。</li>\n</ul>\n<h3>29.6 作品集包装建议</h3>\n<p>真正能证明 AI 产品经理能力的，不是“我懂 RAG / Agent”，而是能拿出一组完整交付物：</p>\n<table>\n<thead>\n<tr>\n  <th>交付物</th>\n  <th>证明的能力</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>AI PRD</td>\n  <td>场景拆解、需求定义、边界控制</td>\n</tr>\n<tr>\n  <td>Prompt / Schema</td>\n  <td>模型输出控制能力</td>\n</tr>\n<tr>\n  <td>知识库清洗规范</td>\n  <td>数据工程和知识治理能力</td>\n</tr>\n<tr>\n  <td>测试集</td>\n  <td>可验证的效果评估能力</td>\n</tr>\n<tr>\n  <td>评测报告</td>\n  <td>质量分析和优化决策能力</td>\n</tr>\n<tr>\n  <td>Fallback 矩阵</td>\n  <td>生产级风险控制能力</td>\n</tr>\n<tr>\n  <td>Agent Harness 方案</td>\n  <td>Agent 运行时控制能力</td>\n</tr>\n<tr>\n  <td>Skill 设计文档</td>\n  <td>可复用能力沉淀能力</td>\n</tr>\n<tr>\n  <td>项目复盘</td>\n  <td>发现问题、优化系统、讲清价值的能力</td>\n</tr>\n</tbody>\n</table>\n<h3>29.7 核心结论</h3>\n<blockquote>\n<p>v1.0 / v1.1 解决“AI 产品经理如何理解和设计 AI 应用”；v1.2 进一步解决“AI 产品经理如何设计可复用、可控、可评测的 Agent 能力体系”；v1.2.1 则把全书结构整理为更适合长期学习和课件使用的版本。</p>\n</blockquote>\n<p>更具体地说：</p>\n<pre><code class=\"language-text\">真正的 AI 产品经理转型\n= 业务场景理解\n+ LLM / RAG / Workflow / Agent 选型\n+ 数据清洗与知识治理\n+ Prompt / Schema / Workflow 设计\n+ 评测、异常兜底与上线门禁\n+ Agent Harness / Skill / Hook / Instruction 工程化能力\n+ 成本、ROI、组织落地与作品集包装\n</code></pre>\n<hr />\n", "plain": "   29. 如何使用这套知识系统：从 v1.0 到 v1.2\n\n  本章合并原 v1.1 使用建议与 v1.2 使用建议。放在全书后部，是为了让学习者先完成主体知识学习，再回到这里制定学习路径、实操路径和作品集包装路径。\n\n    29.1 版本脉络：每一版解决什么问题\n\n  版本   核心目标   解决的问题  \n             \n  v1.0   建立 AI 产品经理知识框架   理解 LLM、RAG、Workflow、Agent、MCP、AI PRD、评测与商业化  \n  v1.1   补生产级落地颗粒度   补工程性能、数据清洗、RAG 优化、异常兜底、评测报告、30 天训练计划  \n  v1.2   补 Agent 工程化与 Skill 机制   补 Agent Hardness、Harness、Skill、Instruction、Hook、Subagent、Skill Eval 与治理  \n  v1.2.1   优化结构与课件化使用   将知识地图和参考来源移动到最后，合并使用建议，形成更完整的学习闭环  \n\n    29.2 推荐学习顺序\n\n建议分四轮学习：\n\n  轮次   重点章节   目标  \n             \n  第一轮：建立框架   0 8 章   理解 LLM、RAG、Workflow、Agent、MCP 的关系  \n  第二轮：学会设计   9 18 章   能写 AI PRD、评测标准、交付物清单，并能解释业务价值  \n  第三轮：落地训练   20 25 章   能处理数据、性能、异常、评测和成果包装  \n  第四轮：Agent 工程化   26 28 章   能设计可复用、可控、可评测的 Agent 能力体系  \n\n    29.3 不建议的学习方式\n\n  不要只背概念，不做 Demo。\n  不要只看模型新闻，不理解企业数据和业务流程。\n  不要一开始就追求复杂 Agent。\n  不要把 RAG 理解成“把 PDF 丢进去”。\n  不要没有测试集就说效果好。\n  不要没有异常兜底就进入生产。\n  不要把 Skill 当成长 Prompt。\n  不要把 Hook 交给模型自觉执行。\n  不要把 MCP 当成业务逻辑本身。\n\n    29.4 推荐的最小可行学习闭环\n\n   text\n选一个熟悉场景\n→ 准备 5 份真实资料\n→ 建一个小知识库\n→ 写 30 条测试问题\n→ 设计 Prompt 和 Schema\n→ 跑一轮评测\n→ 整理错误样本\n→ 补异常兜底\n→ 输出 PRD + 评测报告 + 复盘\n   \n\n    29.5 v1.2 后新增的三个实操任务\n\n     任务 1：把一个长 Prompt 改造成 Skill\n\n选择你已有的复杂 Prompt，例如合同审查、周报生成、标书制作、项目资料整理。\n\n输出：\n\n   SKILL.md \n  references 目录设计\n  scripts 目录设计\n  assets 目录设计\n  trigger / non trigger 测试用例\n  输出 Schema\n  风险边界和 allowed tools\n\n     任务 2：为一个项目写 AGENTS.md\n\n选择一个软件项目或资料项目。\n\n输出：\n\n  项目简介。\n  启动 / 构建 / 测试命令。\n  目录结构说明。\n  禁止修改范围。\n  安全规则。\n  完成标准。\n  输出摘要格式。\n\n     任务 3：设计一个 Agent Harness 方案\n\n选择一个 Agent 应用，例如标书制作 Agent、知识库治理 Agent、代码审查 Agent。\n\n输出：\n\n  任务状态图。\n  上下文管理策略。\n  Tool / MCP 清单。\n  Skill 清单。\n  Hook 清单。\n  权限矩阵。\n  Trace 日志字段。\n  Fallback 矩阵。\n  回滚策略。\n  Eval 指标。\n\n    29.6 作品集包装建议\n\n真正能证明 AI 产品经理能力的，不是“我懂 RAG / Agent”，而是能拿出一组完整交付物：\n\n  交付物   证明的能力  \n         \n  AI PRD   场景拆解、需求定义、边界控制  \n  Prompt / Schema   模型输出控制能力  \n  知识库清洗规范   数据工程和知识治理能力  \n  测试集   可验证的效果评估能力  \n  评测报告   质量分析和优化决策能力  \n  Fallback 矩阵   生产级风险控制能力  \n  Agent Harness 方案   Agent 运行时控制能力  \n  Skill 设计文档   可复用能力沉淀能力  \n  项目复盘   发现问题、优化系统、讲清价值的能力  \n\n    29.7 核心结论\n\n  v1.0 / v1.1 解决“AI 产品经理如何理解和设计 AI 应用”；v1.2 进一步解决“AI 产品经理如何设计可复用、可控、可评测的 Agent 能力体系”；v1.2.1 则把全书结构整理为更适合长期学习和课件使用的版本。\n\n更具体地说：\n\n   text\n真正的 AI 产品经理转型\n= 业务场景理解\n+ LLM / RAG / Workflow / Agent 选型\n+ 数据清洗与知识治理\n+ Prompt / Schema / Workflow 设计\n+ 评测、异常兜底与上线门禁\n+ Agent Harness / Skill / Hook / Instruction 工程化能力\n+ 成本、ROI、组织落地与作品集包装\n   \n\n   ", "is_new": true}, {"num": 30, "title": "一页总图：AI 产品经理知识地图（v1.2 完整版）", "html": "<h2>30. 一页总图：AI 产品经理知识地图（v1.2 完整版）</h2>\n<blockquote>\n<p>本章从原第 20 章移动到全书总结位置。知识地图应放在学习系统最后，因为它需要覆盖 v1.1 的生产级落地增强内容和 v1.2 的 Agent 工程化 / Skill 机制内容。</p>\n</blockquote>\n<pre><code class=\"language-text\">AI 产品经理专业知识系统\n├─ 0 岗位定位\n│  ├─ 不是算法工程师\n│  ├─ 不是只会用工具\n│  └─ 是业务场景到 AI 产品落地的负责人\n├─ 1 LLM 基础\n│  ├─ Token\n│  ├─ 上下文窗口\n│  ├─ 幻觉\n│  ├─ 推理 / 检索 / 计算 / 执行\n│  └─ 模型选型\n├─ 2 Prompt 与结构化输出\n│  ├─ 任务说明\n│  ├─ 约束边界\n│  ├─ 输出格式\n│  ├─ Schema 校验\n│  └─ 失败处理\n├─ 3 RAG 知识增强\n│  ├─ 文档解析\n│  ├─ Chunk\n│  ├─ Embedding\n│  ├─ 向量库\n│  ├─ 检索 / Rerank\n│  ├─ 引用来源\n│  ├─ 数据清洗与标注 SOP\n│  └─ RAG 评测与优化\n├─ 4 Workflow\n│  ├─ 节点拆解\n│  ├─ 条件分支\n│  ├─ 人工审核\n│  ├─ 异常处理\n│  └─ 日志追踪\n├─ 5 Agent 工程\n│  ├─ Planning\n│  ├─ Memory\n│  ├─ Tool Use\n│  ├─ MCP\n│  ├─ Agent Hardness 任务复杂度分级【v1.2】\n│  ├─ Agent Harness 运行时控制层【v1.2 增强】\n│  │  ├─ 状态管理\n│  │  ├─ 上下文管理\n│  │  ├─ 权限控制\n│  │  ├─ Trace / 日志\n│  │  ├─ 验证器\n│  │  ├─ Fallback\n│  │  └─ 回滚与审计\n│  ├─ Skill 可复用能力包【v1.2】\n│  │  ├─ SKILL.md\n│  │  ├─ description 触发\n│  │  ├─ references\n│  │  ├─ scripts\n│  │  ├─ assets\n│  │  ├─ progressive disclosure\n│  │  ├─ skill eval\n│  │  └─ skill governance\n│  ├─ Agent Instruction / Manifest【v1.2】\n│  │  ├─ AGENTS.md\n│  │  ├─ CLAUDE.md\n│  │  ├─ GEMINI.md\n│  │  ├─ Copilot Instructions\n│  │  └─ Cursor Rules\n│  ├─ Hook 确定性控制点【v1.2】\n│  ├─ Subagent 子代理【v1.2】\n│  └─ 权限、审计与上线门禁\n├─ 6 AI 产品设计\n│  ├─ 场景适配\n│  ├─ AI PRD\n│  ├─ 交互设计\n│  ├─ 成本估算\n│  └─ ROI\n├─ 7 质量与治理\n│  ├─ 测试集\n│  ├─ 评测指标\n│  ├─ 幻觉控制\n│  ├─ Skill Eval\n│  ├─ Agent Trace\n│  ├─ 数据安全\n│  └─ 审计留痕\n├─ 8 工具生态\n│  ├─ 模型厂商\n│  ├─ RAG / Workflow 平台\n│  ├─ Agent 框架\n│  ├─ MCP Server / Client\n│  ├─ Agent Skills 标准\n│  ├─ 编程智能体\n│  ├─ Agent 配置文件生态\n│  │  ├─ AGENTS.md\n│  │  ├─ CLAUDE.md\n│  │  ├─ GEMINI.md\n│  │  └─ Cursor Rules\n│  ├─ Skill / Plugin / Hook 生态\n│  └─ 评测工具\n└─ 9 实战项目\n   ├─ 企业知识库问答\n   ├─ 合同审查助手\n   ├─ 周报生成 Workflow\n   ├─ 巡检工单 AI\n   ├─ 标书制作 Skill 包【v1.2 增强】\n   ├─ AI 原型生成工作台\n   ├─ Agent Skill 设计与评测 Demo【v1.2】\n   └─ AGENTS.md + Skill 控制开发 Agent Demo【v1.2】\n</code></pre>\n<p>v1.2 完整版中，这张图的重点变化是：<strong>Agent 不再只是“规划 + 工具调用”，而是由 Hardness 判断、Harness 控制、Skill 复用、Instruction 约束、Hook 校验、Subagent 分工、Eval / Governance 治理共同构成的工程化能力体系。</strong></p>\n<hr />\n<hr />\n", "plain": "   30. 一页总图：AI 产品经理知识地图（v1.2 完整版）\n\n  本章从原第 20 章移动到全书总结位置。知识地图应放在学习系统最后，因为它需要覆盖 v1.1 的生产级落地增强内容和 v1.2 的 Agent 工程化 / Skill 机制内容。\n\n   text\nAI 产品经理专业知识系统\n├─ 0 岗位定位\n│  ├─ 不是算法工程师\n│  ├─ 不是只会用工具\n│  └─ 是业务场景到 AI 产品落地的负责人\n├─ 1 LLM 基础\n│  ├─ Token\n│  ├─ 上下文窗口\n│  ├─ 幻觉\n│  ├─ 推理 / 检索 / 计算 / 执行\n│  └─ 模型选型\n├─ 2 Prompt 与结构化输出\n│  ├─ 任务说明\n│  ├─ 约束边界\n│  ├─ 输出格式\n│  ├─ Schema 校验\n│  └─ 失败处理\n├─ 3 RAG 知识增强\n│  ├─ 文档解析\n│  ├─ Chunk\n│  ├─ Embedding\n│  ├─ 向量库\n│  ├─ 检索 / Rerank\n│  ├─ 引用来源\n│  ├─ 数据清洗与标注 SOP\n│  └─ RAG 评测与优化\n├─ 4 Workflow\n│  ├─ 节点拆解\n│  ├─ 条件分支\n│  ├─ 人工审核\n│  ├─ 异常处理\n│  └─ 日志追踪\n├─ 5 Agent 工程\n│  ├─ Planning\n│  ├─ Memory\n│  ├─ Tool Use\n│  ├─ MCP\n│  ├─ Agent Hardness 任务复杂度分级【v1.2】\n│  ├─ Agent Harness 运行时控制层【v1.2 增强】\n│  │  ├─ 状态管理\n│  │  ├─ 上下文管理\n│  │  ├─ 权限控制\n│  │  ├─ Trace / 日志\n│  │  ├─ 验证器\n│  │  ├─ Fallback\n│  │  └─ 回滚与审计\n│  ├─ Skill 可复用能力包【v1.2】\n│  │  ├─ SKILL.md\n│  │  ├─ description 触发\n│  │  ├─ references\n│  │  ├─ scripts\n│  │  ├─ assets\n│  │  ├─ progressive disclosure\n│  │  ├─ skill eval\n│  │  └─ skill governance\n│  ├─ Agent Instruction / Manifest【v1.2】\n│  │  ├─ AGENTS.md\n│  │  ├─ CLAUDE.md\n│  │  ├─ GEMINI.md\n│  │  ├─ Copilot Instructions\n│  │  └─ Cursor Rules\n│  ├─ Hook 确定性控制点【v1.2】\n│  ├─ Subagent 子代理【v1.2】\n│  └─ 权限、审计与上线门禁\n├─ 6 AI 产品设计\n│  ├─ 场景适配\n│  ├─ AI PRD\n│  ├─ 交互设计\n│  ├─ 成本估算\n│  └─ ROI\n├─ 7 质量与治理\n│  ├─ 测试集\n│  ├─ 评测指标\n│  ├─ 幻觉控制\n│  ├─ Skill Eval\n│  ├─ Agent Trace\n│  ├─ 数据安全\n│  └─ 审计留痕\n├─ 8 工具生态\n│  ├─ 模型厂商\n│  ├─ RAG / Workflow 平台\n│  ├─ Agent 框架\n│  ├─ MCP Server / Client\n│  ├─ Agent Skills 标准\n│  ├─ 编程智能体\n│  ├─ Agent 配置文件生态\n│  │  ├─ AGENTS.md\n│  │  ├─ CLAUDE.md\n│  │  ├─ GEMINI.md\n│  │  └─ Cursor Rules\n│  ├─ Skill / Plugin / Hook 生态\n│  └─ 评测工具\n└─ 9 实战项目\n   ├─ 企业知识库问答\n   ├─ 合同审查助手\n   ├─ 周报生成 Workflow\n   ├─ 巡检工单 AI\n   ├─ 标书制作 Skill 包【v1.2 增强】\n   ├─ AI 原型生成工作台\n   ├─ Agent Skill 设计与评测 Demo【v1.2】\n   └─ AGENTS.md + Skill 控制开发 Agent Demo【v1.2】\n   \n\nv1.2 完整版中，这张图的重点变化是：  Agent 不再只是“规划 + 工具调用”，而是由 Hardness 判断、Harness 控制、Skill 复用、Instruction 约束、Hook 校验、Subagent 分工、Eval / Governance 治理共同构成的工程化能力体系。  \n\n   \n\n   ", "is_new": true}, {"num": 31, "title": "参考校准来源", "html": "<h2>31. 参考校准来源</h2>\n<blockquote>\n<p>本章从原第 21 章移动到全书最后，作为整个知识系统的统一参考来源说明。</p>\n</blockquote>\n<ul>\n<li>OpenAI API 文档：Responses API、Structured Outputs、Agents SDK、Embeddings、Retrieval。</li>\n<li>Model Context Protocol 官方文档：MCP 定义、架构、Servers、Clients、Tools。</li>\n<li>LangChain / LangGraph 官方文档：Tools、Agents、Agent Runtime、Human-in-the-loop、Persistence。</li>\n<li>AWS RAG 说明：Retrieval-Augmented Generation 的定义与企业知识增强价值。</li>\n<li>Dify 官方资料：Agentic Workflow、RAG Pipeline、Knowledge Base 能力。</li>\n<li>RAGAS / ARES 等 RAG 评测论文：RAG 质量评测维度。</li>\n</ul>\n<h3>31.1 v1.2 参考校准来源：Agent 工程化、Skill 与规则生态</h3>\n<ul>\n<li>OpenAI Codex Skills 文档：Skill 作为按需加载的能力包，包含 <code>SKILL.md</code>，并通过 progressive disclosure 管理上下文。https://developers.openai.com/codex/skills</li>\n<li>Claude / Anthropic Agent Skills 文档：Skill 以文件系统包形式提供指令、描述和可选支持资源，按需加载。https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview</li>\n<li>Agent Skills 开放规范：Skill 通过 Discovery → Activation → Execution 三阶段加载。https://agentskills.io/home</li>\n<li>Microsoft Agent Framework Skills 文档：Agent Skills 是包含 instructions、scripts、resources 的可移植能力包，并采用 progressive disclosure。https://learn.microsoft.com/en-us/agent-framework/agents/skills</li>\n<li>OpenAI Codex Hooks 文档：Hook 是 Agent 生命周期中的确定性控制点，例如 PreToolUse、PostToolUse、SubagentStart、Stop 等。https://developers.openai.com/codex/hooks</li>\n<li>AGENTS.md 官方说明：AGENTS.md 是面向 coding agents 的 README，用于提供项目上下文和执行说明。https://agents.md/</li>\n<li>OpenAI Codex AGENTS.md 文档：Codex 会在开始工作前读取 AGENTS.md，并通过全局与项目级规则叠加提供稳定上下文。https://developers.openai.com/codex/guides/agents-md</li>\n<li>GitHub Copilot 自定义指令文档：支持 repository-wide、path-specific、agent instructions，包含 AGENTS.md、CLAUDE.md、GEMINI.md 等形式。https://docs.github.com/copilot/customizing-copilot/adding-custom-instructions-for-github-copilot</li>\n<li>Gemini CLI GEMINI.md 文档：GEMINI.md 用于提供项目级指令、persona、编码风格等上下文。https://geminicli.com/docs/cli/gemini-md/</li>\n<li>Martin Fowler Harness Engineering：Harness 被用作“模型之外的一切”的简写，常被概括为 Agent = Model + Harness。https://martinfowler.com/articles/harness-engineering.html</li>\n</ul>\n<hr />\n\n<h3>31.3 v1.3 新增来源索引</h3>\n<ul>\n<li><strong>GraphRAG</strong>: Microsoft Research 论文《From Local to Global: A Graph RAG Approach to Query-Focused Summarization》 (Edge et al., 2024).</li>\n<li><strong>Multi-Agent</strong>: Microsoft 论文《AutoGen: Enabling Next-Gen LLM Applications》(Wu et al., 2023).</li>\n<li><strong>LangGraph</strong>: LangChain 官方文档 - LangGraph (Stateful Multi-Agent).</li>\n<li><strong>MCP</strong>: Anthropic 发布的 Model Context Protocol 官方标准文档.</li>\n<li><strong>LLM-as-a-Judge</strong>: LMSYS Org 论文《Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena》(Zheng et al., 2023).</li>\n</ul>\n\n<h3>31.4 v1.4 新增前沿索引</h3>\n<ul>\n<li><strong>Generative UI</strong>: Vercel 官方技术文档《Generative UI with Next.js AI SDK》.</li>\n<li><strong>Data Flywheel / DPO</strong>: Anthropic 论文《Training a Helpful and Harmless Assistant with Reinforcement Learning from Human Feedback》.</li>\n<li><strong>Realtime API</strong>: OpenAI 官方开发者文档《Realtime API via WebRTC》.</li>\n<li><strong>AI Safety & Guardrails</strong>: OWASP 基金会《Top 10 for Large Language Model Applications》及 NVIDIA《NeMo Guardrails Architecture》.</li>\n</ul>\n", "plain": "   31. 参考校准来源\n\n  本章从原第 21 章移动到全书最后，作为整个知识系统的统一参考来源说明。\n\n  OpenAI API 文档：Responses API、Structured Outputs、Agents SDK、Embeddings、Retrieval。\n  Model Context Protocol 官方文档：MCP 定义、架构、Servers、Clients、Tools。\n  LangChain / LangGraph 官方文档：Tools、Agents、Agent Runtime、Human in the loop、Persistence。\n  AWS RAG 说明：Retrieval Augmented Generation 的定义与企业知识增强价值。\n  Dify 官方资料：Agentic Workflow、RAG Pipeline、Knowledge Base 能力。\n  RAGAS / ARES 等 RAG 评测论文：RAG 质量评测维度。\n\n\n    31.1 v1.2 参考校准来源：Agent 工程化、Skill 与规则生态\n\n  OpenAI Codex Skills 文档：Skill 作为按需加载的能力包，包含  SKILL.md ，并通过 progressive disclosure 管理上下文。https://developers.openai.com/codex/skills\n  Claude / Anthropic Agent Skills 文档：Skill 以文件系统包形式提供指令、描述和可选支持资源，按需加载。https://platform.claude.com/docs/en/agents and tools/agent skills/overview\n  Agent Skills 开放规范：Skill 通过 Discovery → Activation → Execution 三阶段加载。https://agentskills.io/home\n  Microsoft Agent Framework Skills 文档：Agent Skills 是包含 instructions、scripts、resources 的可移植能力包，并采用 progressive disclosure。https://learn.microsoft.com/en us/agent framework/agents/skills\n  OpenAI Codex Hooks 文档：Hook 是 Agent 生命周期中的确定性控制点，例如 PreToolUse、PostToolUse、SubagentStart、Stop 等。https://developers.openai.com/codex/hooks\n  AGENTS.md 官方说明：AGENTS.md 是面向 coding agents 的 README，用于提供项目上下文和执行说明。https://agents.md/\n  OpenAI Codex AGENTS.md 文档：Codex 会在开始工作前读取 AGENTS.md，并通过全局与项目级规则叠加提供稳定上下文。https://developers.openai.com/codex/guides/agents md\n  GitHub Copilot 自定义指令文档：支持 repository wide、path specific、agent instructions，包含 AGENTS.md、CLAUDE.md、GEMINI.md 等形式。https://docs.github.com/copilot/customizing copilot/adding custom instructions for github copilot\n  Gemini CLI GEMINI.md 文档：GEMINI.md 用于提供项目级指令、persona、编码风格等上下文。https://geminicli.com/docs/cli/gemini md/\n  Martin Fowler Harness Engineering：Harness 被用作“模型之外的一切”的简写，常被概括为 Agent = Model + Harness。https://martinfowler.com/articles/harness engineering.html\n\n\n   \n\n    31.3 v1.3 新增来源索引\n\n  GraphRAG: Microsoft Research 论文《From Local to Global: A Graph RAG Approach...》\n  Multi-Agent: Microsoft 论文《AutoGen...》\n  LangGraph: LangChain 官方文档.\n  MCP: Anthropic 发布的 Model Context Protocol.\n  LLM-as-a-Judge: LMSYS Org 论文《Judging LLM-as-a-Judge...》\n\n\n    31.4 v1.4 新增前沿索引\n\n  Generative UI: Vercel 官方技术文档.\n  Data Flywheel / DPO: Anthropic 论文.\n  Realtime API: OpenAI 官方开发者文档.\n  AI Safety & Guardrails: OWASP 基金会规范.\n", "is_new": false}], "quiz": [{"q": "v1.2.1 这次迭代主要解决什么问题？", "opts": ["重写全部知识体系", "移动知识地图和参考来源、合并使用建议、优化目录结构", "删除 Agent Skill 内容", "只修改页面颜色"], "a": 1, "explain": "v1.2.1 是结构整理迭代，不推翻 v1.2 主体内容。"}, {"q": "RAG 最核心的产品价值是什么？", "opts": ["让模型训练得更快", "让模型基于外部知识回答并提供依据", "让模型完全不出错", "替代业务系统"], "a": 1, "explain": "RAG 的核心是检索外部知识并把相关资料作为生成依据。"}, {"q": "什么时候优先用 Workflow 而不是 Agent？", "opts": ["流程固定、规则明确", "任务路径完全开放", "需要模型自由探索", "没有任何业务规则"], "a": 0, "explain": "固定业务流程优先 Workflow，开放多步骤任务才考虑 Agent。"}, {"q": "Agent Harness 主要解决什么问题？", "opts": ["训练大模型", "控制、观察、验证和回滚 Agent 执行过程", "美化聊天界面", "替代所有业务系统"], "a": 1, "explain": "Harness 是模型外面的运行时控制层。"}, {"q": "Skill 与 Prompt 的核心区别是什么？", "opts": ["Skill 是一次性输入", "Prompt 是文件夹", "Skill 是可复用任务能力包，Prompt 多数是本次任务说明", "二者没有区别"], "a": 2, "explain": "Skill 封装流程、资料、脚本、模板和评测，可跨任务复用。"}, {"q": "Skill 的 description 为什么重要？", "opts": ["决定字体样式", "决定 Agent 是否触发该 Skill", "决定模型价格", "决定网页布局"], "a": 1, "explain": "Agent 通常先读取名称和 description，再决定是否加载完整 SKILL.md。"}, {"q": "能用确定性脚本完成的关键校验，应该优先放在哪里？", "opts": ["Hook / Script", "随便写在用户 Prompt 里", "让模型自己记住", "完全不需要校验"], "a": 0, "explain": "Hook 适合强制执行关键节点校验或拦截。"}, {"q": "AGENTS.md 更适合放什么？", "opts": ["本次临时需求", "项目长期规则、构建测试命令、安全边界", "用户的聊天闲聊", "模型参数"], "a": 1, "explain": "AGENTS.md 是给 Agent 的项目级 README。"}, {"q": "Agent Hardness L2 更适合什么实现？", "opts": ["普通闲聊", "固定多步骤 Workflow", "高风险自主 Agent", "完全人工"], "a": 1, "explain": "L2 是固定多步骤流程，通常优先 Workflow。"}, {"q": "Subagent 的主要价值是什么？", "opts": ["让成本无限降低", "上下文隔离、并行处理和专门任务分工", "替代所有测试", "让模型无需权限"], "a": 1, "explain": "Subagent 适合复杂任务拆分，但需要主流程汇总验证。"}, {"q": "Skill Eval 不包括哪一项？", "opts": ["Trigger Eval", "Non-trigger Eval", "Output Eval", "只看模型回答是否优雅"], "a": 3, "explain": "Skill 评测应覆盖触发、非触发、输出、回归、安全等维度。"}, {"q": "GraphRAG 相比于传统向量 RAG，在哪个场景下优势最明显？", "opts": ["精准查找某一条特定事实", "生成文章摘要", "跨文档、跨实体的宏观主题分析与总结", "翻译多语言文本"], "a": 2, "explain": "GraphRAG 建立实体连通性与社区摘要，特别擅长“连接点滴线索”的宏观推理。"}, {"q": "在 Multi-Agent 架构中，Supervisor 模式的主要特征是？", "opts": ["多个 Agent 互相平等地进行头脑风暴", "一个高级 LLM 作为 Router 规划并下发任务给多个垂直子 Agent", "不需要任何编排", "使用单体大模型一次性完成所有事情"], "a": 1, "explain": "Supervisor 模式通过主管 Agent 将任务路由拆解，由专业子 Agent 分工执行。"}, {"q": "MCP (Model Context Protocol) 协议中，不属于其核心对象的是？", "opts": ["Resources (资源)", "Prompts (模板)", "Tools (工具)", "Vectors (向量)"], "a": 3, "explain": "MCP 标准定义的核心是 Resources、Prompts 和 Tools，不包含底层 Vectors 的概念。"}, {"q": "Generative UI (生成式界面) 的核心特征是什么？", "opts": ["模型回答的文字排版更漂亮", "模型直接根据意图流式返回一个完整的、可直接操作的结构化前端组件", "自动生成代码并部署网站", "让模型学会画图"], "a": 1, "explain": "Generative UI 使得 LUI 和 GUI 融合，突破了文字聊天框的限制，直接渲染可交互组件。"}, {"q": "实时语音 Agent 系统中，VAD 的主要作用是什么？", "opts": ["翻译语言", "控制音量大小", "进行语音活动检测，从而判断用户是否在说话、是否需要触发系统打断 (Interruption)", "防止克隆人声"], "a": 2, "explain": "VAD (Voice Activity Detection) 负责检测人声，是实现多模态低延迟打断与并发控制的关键。"}], "flashcards": [{"term": "v1.2.1", "desc": "结构整理版：移动知识地图和参考来源到最后，合并使用建议，保留 v1.2 主体内容。"}, {"term": "Agent Hardness", "desc": "Agent 任务复杂度分级，用来判断是否需要 Agent 以及需要多复杂的控制体系。"}, {"term": "Agent Harness", "desc": "模型之外的运行时控制层，管理上下文、状态、工具、权限、日志、验证和回滚。"}, {"term": "Agent Skill", "desc": "可复用任务能力包，通常由 SKILL.md、references、scripts、assets、evals 组成。"}, {"term": "Progressive Disclosure", "desc": "按需加载机制：先加载名称和描述，触发后再加载完整 Skill 与相关资源。"}, {"term": "AGENTS.md", "desc": "面向 Agent 的项目 README，提供项目级长期上下文、命令、规则和验收标准。"}, {"term": "Hook", "desc": "Agent 生命周期中的确定性控制点，用于工具调用前后、停止前等节点的校验与拦截。"}, {"term": "Subagent", "desc": "用于专门子任务的子代理，帮助上下文隔离、并行处理和复杂任务分工。"}, {"term": "Skill Eval", "desc": "评测 Skill 是否该触发、是否误触发、输出是否合格、新版本是否回退。"}, {"term": "GraphRAG", "desc": "将文档预处理为实体与关系图谱，利用社区摘要提升宏观主题问答质量的检索技术。"}, {"term": "Agentic RAG", "desc": "将线性检索转化为带有意图路由、多步检索、失败退回闭环能力的智能检索体系。"}, {"term": "MCP 协议", "desc": "Model Context Protocol，打通模型与企业系统的标准化开放协议，定义 Resource、Prompt、Tool。"}, {"term": "LLM-as-a-Judge", "desc": "使用强模型(如 GPT-4)基于打分 Schema 对系统输出进行多维自动化评测的方法论。"}, {"term": "SLM", "desc": "小语言模型(Small Language Model)，适合在端侧或特定高频场景处理敏感数据，用算力摊销替代 Token 计费。"}, {"term": "Generative UI", "desc": "生成式界面，模型流式下发渲染好的可操作前端组件（如动态表单），取代纯文字交互。"}, {"term": "DPO / Data Flywheel", "desc": "直接偏好优化与数据飞轮，通过收集端侧的点赞/修改等偏好数据，反哺并微调模型，建立数据护城河。"}, {"term": "VAD 打断机制", "desc": "Voice Activity Detection，在实时语音大模型中检测人声，实现用户插话时的即时打断与 Token 丢弃。"}, {"term": "NeMo Guardrails", "desc": "NVIDIA 提出的企业级安全护栏框架，用于在输入和输出端防御提示词注入和信息越权。"}, {"term": "Zero-shot TTS", "desc": "零样本语音生成与声音克隆，仅需极短的参考音频即可模拟发音人的音色。"}], "projects": [{"name": "企业知识库问答 RAG Demo", "tag": "RAG", "desc": "准备 5-10 份真实资料，建立知识库，设计引用来源、无依据拒答、测试集和评测报告。"}, {"name": "AI 自动生成项目周报 Workflow", "tag": "Workflow", "desc": "用固定节点串联数据收集、摘要生成、人工审核和归档。"}, {"name": "AI 增强工程巡检流程", "tag": "Workflow + Agent", "desc": "结合巡检异常、设备知识、历史工单和人工确认，形成闭环流程。"}, {"name": "标书制作 Skill 包", "tag": "Skill", "desc": "把招标分析、缺失资料提问、响应矩阵、文档生成和校验沉淀成 SKILL.md + 模板 + 测试集。"}, {"name": "Agent Skill 设计与评测 Demo", "tag": "v1.2", "desc": "从一个长 Prompt 出发，设计 Skill 目录、触发条件、非触发条件、输出 Schema 和回归测试。"}, {"name": "AGENTS.md + Skill 控制开发 Agent Demo", "tag": "v1.2", "desc": "为软件项目写 AGENTS.md，再用 Skill 控制任务创建、执行、测试和索引维护。"}, {"name": "v1.2.1 知识系统复盘", "tag": "结构整理", "desc": "对照第 29-31 章，检查学习路径、知识地图和参考来源是否能支撑你的学习闭环。"}, {"name": "GraphRAG 知识图谱抽取", "tag": "v1.3 进阶", "desc": "上传 5 份研报，使用 GraphRAG 抽取实体与关系，生成可视化知识图谱，并评测对宏观问题的回答质量。"}, {"name": "基于 MCP 的本地文件网关", "tag": "v1.3 进阶", "desc": "基于 Anthropic MCP 标准跑通一个本地 Server，向 Agent 暴露本地读取文件的 Resource 能力。"}, {"name": "LLM-as-a-Judge 自动化评测流水线", "tag": "v1.3 进阶", "desc": "基于 100 条黄金测试集，用 RAGAS 框架的 Context Precision/Recall 跑出自动化评测基准分数。"}, {"name": "Generative UI 意图组件 Demo", "tag": "v1.4 前沿", "desc": "基于 Vercel AI SDK，设计当用户提问“查一下张三请假单”时，直接渲染出可审批交互卡片的场景。"}, {"name": "Data Flywheel 数据回流管线设计", "tag": "v1.4 前沿", "desc": "为内部知识库产品设计全套“隐式反馈+显式修正台”埋点，并规划其作为 Reranker 微调数据的落地方案。"}], "knowledgeMapHtml": "<div class=\"map-grid\">\n  <div class=\"map-card\"><h3>基础认知</h3><p>岗位定位、LLM、Token、上下文窗口、Prompt、Schema、模型能力边界。</p></div>\n  <div class=\"map-card\"><h3>知识增强</h3><p>RAG、Chunk、Embedding、向量数据库、混合检索、Rerank、引用来源、RAG 评测。</p></div>\n  <div class=\"map-card\"><h3>流程编排</h3><p>Workflow、节点设计、条件分支、人工审核、异常处理、日志追踪。</p></div>\n  <div class=\"map-card highlight\"><h3>Agent Hardness</h3><p>L0 普通问答 → L5 高风险跨系统执行。先做任务复杂度分级，再决定是否需要 Agent。</p></div>\n  <div class=\"map-card highlight\"><h3>Agent Harness</h3><p>状态、上下文、工具、权限、Trace、验证器、Fallback、回滚与审计。</p></div>\n  <div class=\"map-card highlight\"><h3>Agent Skill</h3><p>SKILL.md + references + scripts + assets + evals，沉淀可复用任务能力。</p></div>\n  <div class=\"map-card highlight\"><h3>Instruction / Manifest</h3><p>AGENTS.md、CLAUDE.md、GEMINI.md、Copilot Instructions、Cursor Rules。</p></div>\n  <div class=\"map-card highlight\"><h3>Hook / Subagent</h3><p>Hook 做确定性校验；Subagent 做复杂任务的上下文隔离、并行探索和专门分工。</p></div>\n  <div class=\"map-card\"><h3>产品落地</h3><p>AI PRD、数据清洗 SOP、测试集、评测报告、成本测算、ROI、上线门禁。</p></div>\n  <div class=\"map-card\"><h3>实战作品</h3><p>企业知识库问答、周报 Workflow、巡检工单 AI、标书 Skill 包、Agent Skill Demo。</p></div>\n  <div class=\"map-card highlight\"><h3>v1.3 进阶前沿</h3><p>GraphRAG 图谱检索、Multi-Agent 协同路由、MCP 标准企业网关接入、LLM-as-a-Judge 评测与 SLM 降级。</p></div>\n  <div class=\"map-card highlight\"><h3>v1.4 前沿交互与护城河</h3><p>Generative UI 动态组件、Realtime WebRTC 语音打断、Streaming TTS 克隆、DPO 数据飞轮回流与 Guardrails 安全护栏。</p></div>\n</div>"};
const storageKey='ai_pm_course_v121_progress';let currentIndex=0;let currentTab='course';let progress=JSON.parse(localStorage.getItem(storageKey)||'{}');const navEl=document.getElementById('nav');const contentEl=document.getElementById('content');const searchEl=document.getElementById('search');
function saveProgress(){localStorage.setItem(storageKey,JSON.stringify(progress))}function updateProgress(){const total=DATA.sections.length;const done=Object.keys(progress).filter(k=>progress[k]).length;const pct=total?Math.round(done/total*100):0;document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressText').textContent=`学习进度：${done} / ${total} 章（${pct}%）`}
function badgeLabel(s){if([9,11,14].includes(s.num))return 'v1.4'; if([5,7,8,10,31].includes(s.num))return 'v1.3'; if(s.num>=20&&s.num<=25)return 'v1.1'; if(s.num>=26&&s.num<=28)return 'v1.2'; if(s.num>=29&&s.num<=30)return '总结'; return ''}
function renderNav(){const q=searchEl.value.trim().toLowerCase();navEl.innerHTML='';DATA.sections.forEach((s,idx)=>{const hay=(s.num+' '+s.title+' '+s.plain).toLowerCase();if(q&&!hay.includes(q))return;const btn=document.createElement('button');btn.className=idx===currentIndex&&currentTab==='course'?'active':'';const done=progress[s.num]?' ✓':'';const label=badgeLabel(s);const badge=label?`<span class="badge">${label}</span>`:'';btn.innerHTML=`${s.num}. ${s.title}${badge}${done}`;btn.onclick=()=>{currentTab='course';currentIndex=idx;setActiveTab();renderCourse();updateMarkReadBtn();renderNav();window.scrollTo(0,0)};navEl.appendChild(btn)});if(!navEl.children.length)navEl.innerHTML='<div class="empty">没有找到匹配章节</div>'}
function setActiveTab(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
function renderCourse(){  const s=DATA.sections[currentIndex];  contentEl.innerHTML=`<article class="article" style="position:relative;">    <div id="ttsBtn" style="position:absolute;top:28px;right:28px;font-size:24px;cursor:pointer;user-select:none;transition:transform 0.2s" title="朗读本章">🎧</div>    ${s.html}    <div class="section-controls">      <button class="primary" id="prevBtn">上一章</button>      <button class="primary" id="nextBtn">下一章</button>    </div>  </article>`;    const ttsBtn = document.getElementById('ttsBtn');  ttsBtn.onclick = () => {    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {      window.speechSynthesis.cancel();      ttsBtn.textContent = '🎧';    } else {      const u = new SpeechSynthesisUtterance(s.plain);      u.lang = 'zh-CN';      u.rate = 1.0;      u.onend = () => { if(document.getElementById('ttsBtn')) document.getElementById('ttsBtn').textContent = '🎧'; };      window.speechSynthesis.speak(u);      ttsBtn.textContent = '⏸️';    }  };  document.getElementById('prevBtn').onclick=()=>{if(currentIndex>0){currentIndex--;renderCourse();updateMarkReadBtn();renderNav();window.scrollTo(0,0)}};  document.getElementById('nextBtn').onclick=()=>{if(currentIndex<DATA.sections.length-1){currentIndex++;renderCourse();updateMarkReadBtn();renderNav();window.scrollTo(0,0)}};}
function renderMap(){contentEl.innerHTML=`<article class="article"><h2>AI 产品经理知识地图 v1.2 完整版</h2><p>v1.2.1 将知识地图移动到全书末尾，使其覆盖 v1.1 的生产级落地增强内容和 v1.2 的 Agent 工程化 / Skill 机制内容。</p>${DATA.knowledgeMapHtml}</article>`}
function renderV12(){const items=DATA.sections.filter(s=>s.num===7||(s.num>=20&&s.num<=30));contentEl.innerHTML='<article class="article"><h2>v1.1 / v1.2 / v1.2.1 增强内容</h2><div class="card-grid">'+items.map(s=>`<div class="card"><h3>${s.num}. ${s.title}</h3><p>${badgeLabel(s)||'增强'}：点击左侧目录可进入完整内容。</p><button class="primary" onclick="openSection(${s.num})">打开章节</button></div>`).join('')+'</div></article>'}
function openSection(num){const idx=DATA.sections.findIndex(s=>s.num===num);if(idx>=0){currentIndex=idx;currentTab='course';setActiveTab();renderCourse();updateMarkReadBtn();renderNav();window.scrollTo(0,0)}}
function renderV13(){const items=DATA.sections.filter(s=>[5,7,8,10,31].includes(s.num));contentEl.innerHTML='<article class="article"><h2>v1.3 进阶内容</h2><div class="card-grid">'+items.map(s=>`<div class="card"><h3>${s.num}. ${s.title}</h3><p><span class="badge">v1.3</span> 进阶：点击左侧目录进入章节末尾查看。</p><button class="primary" onclick="openSection(${s.num})">打开章节</button></div>`).join('')+'</div></article>'}
function renderV14(){const items=DATA.sections.filter(s=>[9,11,14,31].includes(s.num));contentEl.innerHTML='<article class="article"><h2>v1.4 前沿内容</h2><div class="card-grid">'+items.map(s=>`<div class="card"><h3>${s.num}. ${s.title}</h3><p><span class="badge">v1.4</span> 前沿：点击左侧目录进入章节末尾查看。</p><button class="primary" onclick="openSection(${s.num})">打开章节</button></div>`).join('')+'</div></article>'}
function renderQuiz(){contentEl.innerHTML='<article class="article"><h2>综合测验</h2><p>点击选项后会显示答案。题目覆盖 v1.1 生产级落地、v1.2 Agent 工程化和 v1.2.1 结构整理。</p><div id="quizBox"></div></article>';const box=document.getElementById('quizBox');DATA.quiz.forEach((item,qi)=>{const div=document.createElement('div');div.className='quiz-item';div.innerHTML=`<h3>${qi+1}. ${item.q}</h3>`;item.opts.forEach((opt,oi)=>{const b=document.createElement('button');b.className='option';b.textContent=opt;b.onclick=()=>{div.querySelectorAll('.option').forEach((x,xi)=>{x.classList.toggle('correct',xi===item.a);x.classList.toggle('wrong',xi===oi&&oi!==item.a)});if(!div.querySelector('.explain')){const p=document.createElement('p');p.className='explain';p.textContent=item.explain;div.appendChild(p)}};div.appendChild(b)});box.appendChild(div)})}
function renderFlashcards(){contentEl.innerHTML='<article class="article"><h2>AI 产品经理术语闪卡</h2><p>点击卡片翻面。</p><div class="card-grid" id="flashBox"></div></article>';const box=document.getElementById('flashBox');DATA.flashcards.forEach(c=>{const div=document.createElement('div');div.className='card flashcard';div.innerHTML=`<div class="term">${c.term}</div><div class="desc">${c.desc}</div>`;div.onclick=()=>div.classList.toggle('flipped');box.appendChild(div)})}
function renderProjects(){contentEl.innerHTML='<article class="article"><h2>实战项目库</h2><p>建议至少完成一个 RAG 项目、一个生产级评测 / 兜底项目和一个 v1.2 Skill / Agent Harness 项目。</p><div class="card-grid">'+DATA.projects.map(p=>`<div class="card"><span class="badge">${p.tag}</span><h3>${p.name}</h3><p>${p.desc}</p></div>`).join('')+'</div></article>'}
function updateThemeBtn(){const cur=document.documentElement.getAttribute('data-theme');const btn=document.getElementById('themeBtn');if(btn){btn.innerHTML=cur==='dark'?'<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>':'<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>'}}
function updateMarkReadBtn(){const s=DATA.sections[currentIndex];const btn=document.getElementById('markRead');if(btn){btn.textContent=progress[s.num]?'取消本章已学':'标记本章已学'}}
function renderCurrentTab(){window.speechSynthesis.cancel();setActiveTab();if(currentTab==='course')renderCourse();updateMarkReadBtn();if(currentTab==='map')renderMap();if(currentTab==='v12')renderV12();if(currentTab==='v13')renderV13();if(currentTab==='v14')renderV14();if(currentTab==='quiz')renderQuiz();if(currentTab==='flashcards')renderFlashcards();if(currentTab==='projects')renderProjects();renderNav();updateProgress()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;renderCurrentTab()});document.getElementById('markRead').onclick=()=>{const s=DATA.sections[currentIndex];if(progress[s.num]){delete progress[s.num]}else{progress[s.num]=true}saveProgress();renderNav();updateProgress();updateMarkReadBtn()};document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');updateThemeBtn()};updateThemeBtn();searchEl.addEventListener('input',renderNav);renderCurrentTab();
</script>
