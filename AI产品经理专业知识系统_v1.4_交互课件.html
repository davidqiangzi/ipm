h3>14.7 BI 与经营分析</h3>\n<p>场景：经营指标问答、异常归因、报表解读。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">SQL / BI 工具 + LLM 解读 + 权限 + 指标口径库\n</code></pre>\n<p>关键问题：</p>\n<ul>\n<li>指标口径统一。</li>\n<li>数字由系统计算，不由模型猜。</li>\n<li>模型负责解释和洞察。</li>\n</ul>\n<hr />\n<hr />\n\n<h3>14.7 v1.4 前沿：Realtime Multi-modal (实时多模态 Agent)</h3>\n<p>传统的“录音-ASR转文字-LLM思考-TTS转语音”具有瀑布流的高延迟，无法做真正的实时交互。</p>\n<h4>14.7.1 WebRTC 与端到端语音</h4>\n<p>OpenAI Realtime API 级别的架构，音频直接在网络协议中流式对传。PM 的核心指标：将端到端延迟控制在 500ms（人类舒适区）以内。</p>\n<h4>14.7.2 VAD 与打断机制 (Interruption)</h4>\n<p>系统必须能识别 VAD (Voice Activity Detection)，当用户突然插话时，需瞬间截断当前生成的 Token 队列并丢弃多余音频，重新生成。</p>\n\n<h3>14.8 v1.4 前沿：TTS (文本转语音) 与音频产品化</h3>\n<p>TTS 不仅是读字，更要有情感和资产安全性：</p>\n<ul>\n<li><strong>Zero-shot Voice Cloning (零样本声音克隆)</strong>：仅需 3-5 秒音频即可克隆音色，PM 必须设计鉴权验证防线，防止滥用。</li>\n<li><strong>Emotion/Prosody Control (情感与韵律控制)</strong>：通过 Prompt 给大模型打上呼吸、停顿、笑声标签，取代传统的 SSML 标签调节。</li>\n<li><strong>Streaming Chunk 策略</strong>：流式 TTS 需要将整段话切分成“句子块”下发，以掩盖生成延迟。</li>\n</ul>\n", "plain": "   14. 行业应用场景库\n\n    14.1 企业知识库问答\n\n场景：制度、流程、合同、项目资料、产品手册问答。\n\n能力组合：\n\n   text\nRAG + 权限 + 引用来源 + 反馈学习\n   \n\n关键指标：\n\n  回答准确率。\n  引用准确率。\n  无依据拒答率。\n  文档更新时效。\n  用户满意度。\n\n    14.2 合同 / 法务初审\n\n场景：条款识别、风险提示、义务提取、违约责任判断。\n\n能力组合：\n\n   text\n文档解析 + RAG + 条款抽取 + Schema + 人工复核\n   \n\n注意：不能让 AI 做最终法律结论，必须有人审。\n\n    14.3 标书 / 方案生成\n\n场景：根据招标文件、企业资料、项目经验生成投标材料。\n\n能力组合：\n\n   text\n资料索引 + 招标文件解析 + 缺失项澄清 + 文档生成 + 人工审阅\n   \n\n关键设计：\n\n  素材库。\n  章节模板。\n  响应点检查。\n  偏离表。\n  格式一致性。\n  Word 输出。\n\n    14.4 工程项目管理\n\n场景：施工周报、质量安全问题、进度风险、会议纪要。\n\n能力组合：\n\n   text\nRAG + Workflow + 报告模板 + 数据分析 + 人工审核\n   \n\n    14.5 FM / 运维管理\n\n场景：报障、派单、巡检、维修记录、设备知识库。\n\n能力组合：\n\n   text\n图像识别 + 工单 Workflow + 设备知识库 RAG + SLA 规则\n   \n\n    14.6 智慧消防 / 消控室远程值守\n\n场景：报警识别、处置建议、操作留痕、集中监管。\n\n能力组合：\n\n   text\n设备数据接入 + 规则引擎 + RAG 处置知识库 + Workflow + 人工确认 + 审计留痕\n   \n\n注意：涉及远程控制和安全责任，AI 应以辅助研判、辅助处置、生成记录为主，高风险控制动作必须严格授权与留痕。\n\n    14.7 BI 与经营分析\n\n场景：经营指标问答、异常归因、报表解读。\n\n能力组合：\n\n   text\nSQL / BI 工具 + LLM 解读 + 权限 + 指标口径库\n   \n\n关键问题：\n\n  指标口径统一。\n  数字由系统计算，不由模型猜。\n  模型负责解释和洞察。\n\n   \n\n   \n\n    14.7 v1.4 前沿：Realtime Multi-modal (实时多模态 Agent)\n\n传统的 ASR-LLM-TTS 具有高延迟。\n\n    14.7.1 WebRTC 与端到端语音\n\n音频直接流式对传，将端到端延迟控制在 500ms 以内。\n\n    14.7.2 VAD 与打断机制\n\n识别 VAD，当用户突然插话时截断当前生成的 Token 队列。\n\n    14.8 v1.4 前沿：TTS (文本转语音) 与音频产品化\n\n  Zero-shot Voice Cloning：防范零样本克隆引发的欺诈风险。\n  Emotion/Prosody Control：基于文本和 Prompt 控制呼吸和情绪，取代 SSML。\n  Streaming Chunk 策略：流式 TTS 需要句子切分降低首包延迟。\n", "is_new": false}, {"num": 15, "title": "AI 产品实战项目设计", "html": "<h2>15. AI 产品实战项目设计</h2>\n<h3>15.1 项目一：企业知识库问答 RAG Demo</h3>\n<p>目标：基于企业制度、合同、项目资料，回答用户问题并给出来源。</p>\n<p>输入资料：</p>\n<ul>\n<li>企业制度。</li>\n<li>项目方案。</li>\n<li>合同条款。</li>\n<li>会议纪要。</li>\n<li>周报。</li>\n</ul>\n<p>核心流程：</p>\n<pre><code class=\"language-text\">上传资料\n→ 文档解析\n→ Chunk 切分\n→ Embedding\n→ 用户提问\n→ 检索\n→ Rerank\n→ 生成答案\n→ 引用来源\n→ 用户反馈\n</code></pre>\n<p>PRD 重点：</p>\n<ul>\n<li>知识库管理。</li>\n<li>文档版本。</li>\n<li>权限控制。</li>\n<li>问答引用。</li>\n<li>无依据拒答。</li>\n<li>反馈与纠错。</li>\n</ul>\n<p>验收标准：</p>\n<ul>\n<li>标准问题正确率 ≥ 80%。</li>\n<li>关键结论有来源。</li>\n<li>无资料问题不编造。</li>\n<li>输出格式稳定。</li>\n</ul>\n<h3>15.2 项目二：合同条款审查助手</h3>\n<p>目标：识别合同中付款、交付、违约、逾期、验收、解除等关键条款，并输出风险。</p>\n<p>流程：</p>\n<pre><code class=\"language-text\">上传合同\n→ 条款切分\n→ 条款分类\n→ 风险识别\n→ 原文引用\n→ 风险等级\n→ 人工复核\n→ 导出审查报告\n</code></pre>\n<p>输出字段：</p>\n<pre><code class=\"language-json\">{\n  &quot;clause_type&quot;: &quot;逾期责任&quot;,\n  &quot;is_found&quot;: true,\n  &quot;original_text&quot;: &quot;……&quot;,\n  &quot;interpretation&quot;: &quot;……&quot;,\n  &quot;risk_level&quot;: &quot;medium&quot;,\n  &quot;basis&quot;: &quot;第X条&quot;,\n  &quot;unsupported_inference&quot;: &quot;……&quot;,\n  &quot;review_suggestion&quot;: &quot;建议人工进一步确认比例是否明确&quot;\n}\n</code></pre>\n<p>关键规则：</p>\n<ul>\n<li>逐条依据原文解释。</li>\n<li>不得扩大解释。</li>\n<li>没有依据必须说明“未明确”。</li>\n<li>推理建议必须与资料结论分开。</li>\n</ul>\n<h3>15.3 项目三：AI 自动生成项目周报</h3>\n<p>目标：根据进度数据、会议纪要、问题清单，自动生成周报。</p>\n<p>流程：</p>\n<pre><code class=\"language-text\">收集输入\n→ 数据清洗\n→ 风险提取\n→ 周报生成\n→ 人工修改\n→ 定稿导出\n→ 归档\n</code></pre>\n<p>输出：</p>\n<ul>\n<li>本周进展。</li>\n<li>下周计划。</li>\n<li>风险问题。</li>\n<li>需协调事项。</li>\n<li>关键节点。</li>\n<li>管理建议。</li>\n</ul>\n<h3>15.4 项目四：AI 增强巡检与工单流程</h3>\n<p>目标：让巡检异常自动转工单，并辅助判断紧急程度和处置建议。</p>\n<p>流程：</p>\n<pre><code class=\"language-text\">巡检发现异常\n→ 图片 / 文本识别\n→ 关联设备和位置\n→ 判断故障类型\n→ 生成工单\n→ 派单\n→ 维修记录\n→ 报障人确认\n→ 归档分析\n</code></pre>\n<p>AI 角色：</p>\n<ul>\n<li>识别异常描述。</li>\n<li>补全工单字段。</li>\n<li>推荐故障类型。</li>\n<li>生成维修建议。</li>\n<li>总结维修记录。</li>\n<li>分析高频问题。</li>\n</ul>\n<h3>15.5 项目五：AI 标书制作三 Skill 包</h3>\n<p>目标：建立从资料索引、招标文件分析、缺失项澄清到 Word 标书生成的受控流程。</p>\n<p>三个 Skill：</p>\n<ol>\n<li><strong>资料索引 Skill</strong>：识别资料类型，整理目录，建立索引。</li>\n<li><strong>任务创建 Skill</strong>：分析招标文件，识别响应点，列缺失项，生成执行 Prompt。</li>\n<li><strong>受控执行 Skill</strong>：按索引和任务生成标书，校验格式和响应完整性，维护索引。</li>\n</ol>\n<p>关键价值：</p>\n<ul>\n<li>多会话协作不跑偏。</li>\n<li>资料可复用。</li>\n<li>输出可追踪。</li>\n<li>缺失项先提问。</li>\n<li>Word 文档可编辑。</li>\n</ul>\n<h3>15.6 项目六：AI 原型生成工作台</h3>\n<p>目标：从需求自然语言生成原型，再可视化微调，最后导出前端工程。</p>\n<p>核心架构：</p>\n<pre><code class=\"language-text\">需求输入\n→ Page DSL\n→ 组件注册中心\n→ 可视化编辑器\n→ AI Patch 局部修改\n→ React / Vue Codegen\n→ MCP 工具受控执行\n→ Skill 约束开发 Agent\n</code></pre>\n<p>关键产品思想：</p>\n<ul>\n<li>不直接生成不可控 HTML。</li>\n<li>用 DSL 作为中间资产。</li>\n<li>AI 只能局部 Patch，不默认重写整页。</li>\n<li>组件来自注册中心。</li>\n<li>导出代码不能依赖编辑器内部状态。</li>\n<li>Agent 工具权限受控。</li>\n</ul>\n<hr />\n<hr />\n", "plain": "   15. AI 产品实战项目设计\n\n    15.1 项目一：企业知识库问答 RAG Demo\n\n目标：基于企业制度、合同、项目资料，回答用户问题并给出来源。\n\n输入资料：\n\n  企业制度。\n  项目方案。\n  合同条款。\n  会议纪要。\n  周报。\n\n核心流程：\n\n   text\n上传资料\n→ 文档解析\n→ Chunk 切分\n→ Embedding\n→ 用户提问\n→ 检索\n→ Rerank\n→ 生成答案\n→ 引用来源\n→ 用户反馈\n   \n\nPRD 重点：\n\n  知识库管理。\n  文档版本。\n  权限控制。\n  问答引用。\n  无依据拒答。\n  反馈与纠错。\n\n验收标准：\n\n  标准问题正确率 ≥ 80%。\n  关键结论有来源。\n  无资料问题不编造。\n  输出格式稳定。\n\n    15.2 项目二：合同条款审查助手\n\n目标：识别合同中付款、交付、违约、逾期、验收、解除等关键条款，并输出风险。\n\n流程：\n\n   text\n上传合同\n→ 条款切分\n→ 条款分类\n→ 风险识别\n→ 原文引用\n→ 风险等级\n→ 人工复核\n→ 导出审查报告\n   \n\n输出字段：\n\n   json\n{\n  \"clause type\": \"逾期责任\",\n  \"is found\": true,\n  \"original text\": \"……\",\n  \"interpretation\": \"……\",\n  \"risk level\": \"medium\",\n  \"basis\": \"第X条\",\n  \"unsupported inference\": \"……\",\n  \"review suggestion\": \"建议人工进一步确认比例是否明确\"\n}\n   \n\n关键规则：\n\n  逐条依据原文解释。\n  不得扩大解释。\n  没有依据必须说明“未明确”。\n  推理建议必须与资料结论分开。\n\n    15.3 项目三：AI 自动生成项目周报\n\n目标：根据进度数据、会议纪要、问题清单，自动生成周报。\n\n流程：\n\n   text\n收集输入\n→ 数据清洗\n→ 风险提取\n→ 周报生成\n→ 人工修改\n→ 定稿导出\n→ 归档\n   \n\n输出：\n\n  本周进展。\n  下周计划。\n  风险问题。\n  需协调事项。\n  关键节点。\n  管理建议。\n\n    15.4 项目四：AI 增强巡检与工单流程\n\n目标：让巡检异常自动转工单，并辅助判断紧急程度和处置建议。\n\n流程：\n\n   text\n巡检发现异常\n→ 图片 / 文本识别\n→ 关联设备和位置\n→ 判断故障类型\n→ 生成工单\n→ 派单\n→ 维修记录\n→ 报障人确认\n→ 归档分析\n   \n\nAI 角色：\n\n  识别异常描述。\n  补全工单字段。\n  推荐故障类型。\n  生成维修建议。\n  总结维修记录。\n  分析高频问题。\n\n    15.5 项目五：AI 标书制作三 Skill 包\n\n目标：建立从资料索引、招标文件分析、缺失项澄清到 Word 标书生成的受控流程。\n\n三个 Skill：\n\n1.   资料索引 Skill  ：识别资料类型，整理目录，建立索引。\n2.   任务创建 Skill  ：分析招标文件，识别响应点，列缺失项，生成执行 Prompt。\n3.   受控执行 Skill  ：按索引和任务生成标书，校验格式和响应完整性，维护索引。\n\n关键价值：\n\n  多会话协作不跑偏。\n  资料可复用。\n  输出可追踪。\n  缺失项先提问。\n  Word 文档可编辑。\n\n    15.6 项目六：AI 原型生成工作台\n\n目标：从需求自然语言生成原型，再可视化微调，最后导出前端工程。\n\n核心架构：\n\n   text\n需求输入\n→ Page DSL\n→ 组件注册中心\n→ 可视化编辑器\n→ AI Patch 局部修改\n→ React / Vue Codegen\n→ MCP 工具受控执行\n→ Skill 约束开发 Agent\n   \n\n关键产品思想：\n\n  不直接生成不可控 HTML。\n  用 DSL 作为中间资产。\n  AI 只能局部 Patch，不默认重写整页。\n  组件来自注册中心。\n  导出代码不能依赖编辑器内部状态。\n  Agent 工具权限受控。\n\n   \n\n   ", "is_new": false}, {"num": 16, "title": "学习路线图", "html": "<h2>16. 学习路线图</h2>\n<h3>16.1 第一阶段：建立 AI 应用总认知（1 周）</h3>\n<p>目标：搞清楚 LLM、RAG、Workflow、Agent 的关系。</p>\n<p>学习内容：</p>\n<ul>\n<li>LLM 是什么。</li>\n<li>Token、上下文、幻觉。</li>\n<li>Prompt 基础。</li>\n<li>RAG 基本流程。</li>\n<li>Agent 与 Workflow 区别。</li>\n</ul>\n<p>产出：</p>\n<ul>\n<li>一张 AI 应用能力地图。</li>\n<li>一份 5 个业务场景的 AI 适配分析。</li>\n</ul>\n<h3>16.2 第二阶段：Prompt 与结构化输出（1 周）</h3>\n<p>目标：能写稳定可用的业务 Prompt。</p>\n<p>学习内容：</p>\n<ul>\n<li>Prompt 模板。</li>\n<li>输出格式。</li>\n<li>JSON Schema。</li>\n<li>失败处理。</li>\n<li>自检与一致性检查。</li>\n</ul>\n<p>产出：</p>\n<ul>\n<li>3 个业务 Prompt。</li>\n<li>1 个结构化输出 Schema。</li>\n<li>1 套测试问题。</li>\n</ul>\n<h3>16.3 第三阶段：RAG 知识库（2 周）</h3>\n<p>目标：能做一个企业知识库问答 Demo。</p>\n<p>学习内容：</p>\n<ul>\n<li>文档解析。</li>\n<li>Chunk。</li>\n<li>Embedding。</li>\n<li>向量数据库。</li>\n<li>检索。</li>\n<li>Rerank。</li>\n<li>引用来源。</li>\n<li>RAG 评测。</li>\n</ul>\n<p>产出：</p>\n<ul>\n<li>一个 RAG Demo。</li>\n<li>一套测试集。</li>\n<li>一份 RAG 产品 PRD。</li>\n</ul>\n<h3>16.4 第四阶段：Workflow（1-2 周）</h3>\n<p>目标：把 AI 嵌入业务流程。</p>\n<p>学习内容：</p>\n<ul>\n<li>节点拆解。</li>\n<li>条件分支。</li>\n<li>人工审核。</li>\n<li>异常处理。</li>\n<li>日志追踪。</li>\n</ul>\n<p>产出：</p>\n<ul>\n<li>一个周报生成 Workflow。</li>\n<li>一个合同审查 Workflow。</li>\n</ul>\n<h3>16.5 第五阶段：Agent 与工具调用（2 周）</h3>\n<p>目标：理解 Agent 工程，不被概念迷惑。</p>\n<p>学习内容：</p>\n<ul>\n<li>Tool Use。</li>\n<li>MCP。</li>\n<li>ReAct。</li>\n<li>Plan-and-Solve。</li>\n<li>Reflection。</li>\n<li>上下文工程。</li>\n<li>权限与验证。</li>\n</ul>\n<p>产出：</p>\n<ul>\n<li>一个能调用工具的 Agent Demo。</li>\n<li>一份 Agent 风险控制方案。</li>\n</ul>\n<h3>16.6 第六阶段：项目作品集包装（2 周）</h3>\n<p>目标：把学习成果变成简历和面试可讲案例。</p>\n<p>产出：</p>\n<ul>\n<li>AI 产品案例说明。</li>\n<li>PRD。</li>\n<li>架构图。</li>\n<li>流程图。</li>\n<li>Demo 截图。</li>\n<li>测试集与评测结果。</li>\n<li>商业价值分析。</li>\n</ul>\n<hr />\n<hr />\n", "plain": "   16. 学习路线图\n\n    16.1 第一阶段：建立 AI 应用总认知（1 周）\n\n目标：搞清楚 LLM、RAG、Workflow、Agent 的关系。\n\n学习内容：\n\n  LLM 是什么。\n  Token、上下文、幻觉。\n  Prompt 基础。\n  RAG 基本流程。\n  Agent 与 Workflow 区别。\n\n产出：\n\n  一张 AI 应用能力地图。\n  一份 5 个业务场景的 AI 适配分析。\n\n    16.2 第二阶段：Prompt 与结构化输出（1 周）\n\n目标：能写稳定可用的业务 Prompt。\n\n学习内容：\n\n  Prompt 模板。\n  输出格式。\n  JSON Schema。\n  失败处理。\n  自检与一致性检查。\n\n产出：\n\n  3 个业务 Prompt。\n  1 个结构化输出 Schema。\n  1 套测试问题。\n\n    16.3 第三阶段：RAG 知识库（2 周）\n\n目标：能做一个企业知识库问答 Demo。\n\n学习内容：\n\n  文档解析。\n  Chunk。\n  Embedding。\n  向量数据库。\n  检索。\n  Rerank。\n  引用来源。\n  RAG 评测。\n\n产出：\n\n  一个 RAG Demo。\n  一套测试集。\n  一份 RAG 产品 PRD。\n\n    16.4 第四阶段：Workflow（1 2 周）\n\n目标：把 AI 嵌入业务流程。\n\n学习内容：\n\n  节点拆解。\n  条件分支。\n  人工审核。\n  异常处理。\n  日志追踪。\n\n产出：\n\n  一个周报生成 Workflow。\n  一个合同审查 Workflow。\n\n    16.5 第五阶段：Agent 与工具调用（2 周）\n\n目标：理解 Agent 工程，不被概念迷惑。\n\n学习内容：\n\n  Tool Use。\n  MCP。\n  ReAct。\n  Plan and Solve。\n  Reflection。\n  上下文工程。\n  权限与验证。\n\n产出：\n\n  一个能调用工具的 Agent Demo。\n  一份 Agent 风险控制方案。\n\n    16.6 第六阶段：项目作品集包装（2 周）\n\n目标：把学习成果变成简历和面试可讲案例。\n\n产出：\n\n  AI 产品案例说明。\n  PRD。\n  架构图。\n  流程图。\n  Demo 截图。\n  测试集与评测结果。\n  商业价值分析。\n\n   \n\n   ", "is_new": false}, {"num": 17, "title": "AI 产品经理面试讲法", "html": "<h2>17. AI 产品经理面试讲法</h2>\n<h3>17.1 如何解释 LLM</h3>\n<blockquote>\n<p>LLM 不是数据库，而是一个基于上下文生成结果的通用语言理解与生成模型。它擅长理解、总结、生成和推理，但不天然知道企业内部知识，也不能保证事实正确，因此企业落地时通常要结合 RAG、工具调用、结构化输出和评测机制。</p>\n</blockquote>\n<h3>17.2 如何解释 RAG</h3>\n<blockquote>\n<p>RAG 是把企业文档、制度、合同等外部知识先检索出来，再交给大模型基于资料回答。它的价值是降低幻觉、补充私有知识、提供引用来源。但 RAG 不等于万能准确，文档解析、切分、检索、排序、Prompt 和评测都会影响最终质量。</p>\n</blockquote>\n<h3>17.3 如何解释 Agent</h3>\n<blockquote>\n<p>Agent 是在模型基础上增加规划、记忆和工具调用能力，让 AI 可以围绕目标执行多步骤任务。真正难点不在“让模型自己跑”，而在工具权限、上下文管理、执行状态、质量验证、人机协同和安全治理。</p>\n</blockquote>\n<h3>17.4 如何解释 Workflow</h3>\n<blockquote>\n<p>Workflow 是把 AI 能力嵌入固定业务流程，通过节点、条件、人工审核和异常处理实现可控自动化。企业落地时，流程明确的场景优先用 Workflow，开放复杂任务才考虑 Agent。</p>\n</blockquote>\n<h3>17.5 如何讲你的 AI 产品方法论</h3>\n<blockquote>\n<p>我会先做场景拆解，判断任务适合 LLM、RAG、Workflow、Agent 还是传统系统；然后设计输入、知识来源、Prompt、输出 Schema、人工审核和评测指标；最后通过 PoC、小范围 MVP、质量评测和成本监控推进上线，确保 AI 功能不是 Demo，而是可追踪、可验证、可运营的产品能力。</p>\n</blockquote>\n<hr />\n<hr />\n", "plain": "   17. AI 产品经理面试讲法\n\n    17.1 如何解释 LLM\n\n  LLM 不是数据库，而是一个基于上下文生成结果的通用语言理解与生成模型。它擅长理解、总结、生成和推理，但不天然知道企业内部知识，也不能保证事实正确，因此企业落地时通常要结合 RAG、工具调用、结构化输出和评测机制。\n\n    17.2 如何解释 RAG\n\n  RAG 是把企业文档、制度、合同等外部知识先检索出来，再交给大模型基于资料回答。它的价值是降低幻觉、补充私有知识、提供引用来源。但 RAG 不等于万能准确，文档解析、切分、检索、排序、Prompt 和评测都会影响最终质量。\n\n    17.3 如何解释 Agent\n\n  Agent 是在模型基础上增加规划、记忆和工具调用能力，让 AI 可以围绕目标执行多步骤任务。真正难点不在“让模型自己跑”，而在工具权限、上下文管理、执行状态、质量验证、人机协同和安全治理。\n\n    17.4 如何解释 Workflow\n\n  Workflow 是把 AI 能力嵌入固定业务流程，通过节点、条件、人工审核和异常处理实现可控自动化。企业落地时，流程明确的场景优先用 Workflow，开放复杂任务才考虑 Agent。\n\n    17.5 如何讲你的 AI 产品方法论\n\n  我会先做场景拆解，判断任务适合 LLM、RAG、Workflow、Agent 还是传统系统；然后设计输入、知识来源、Prompt、输出 Schema、人工审核和评测指标；最后通过 PoC、小范围 MVP、质量评测和成本监控推进上线，确保 AI 功能不是 Demo，而是可追踪、可验证、可运营的产品能力。\n\n   \n\n   ", "is_new": false}, {"num": 18, "title": "AI 产品经理常用交付物清单", "html": "<h2>18. AI 产品经理常用交付物清单</h2>\n<h3>18.1 需求阶段</h3>\n<ul>\n<li>AI 场景清单。</li>\n<li>AI 适配性分析。</li>\n<li>用户旅程图。</li>\n<li>业务流程图。</li>\n<li>数据 / 知识来源清单。</li>\n<li>风险评估表。</li>\n</ul>\n<h3>18.2 设计阶段</h3>\n<ul>\n<li>AI PRD。</li>\n<li>Prompt 设计文档。</li>\n<li>输出 Schema。</li>\n<li>Workflow 节点设计。</li>\n<li>Agent 工具清单。</li>\n<li>权限设计。</li>\n<li>交互原型。</li>\n</ul>\n<h3>18.3 验证阶段</h3>\n<ul>\n<li>测试集。</li>\n<li>标准答案。</li>\n<li>评测报告。</li>\n<li>错误样本库。</li>\n<li>成本测算。</li>\n<li>PoC 总结。</li>\n</ul>\n<h3>18.4 上线阶段</h3>\n<ul>\n<li>上线方案。</li>\n<li>运维手册。</li>\n<li>用户培训材料。</li>\n<li>监控指标。</li>\n<li>应急预案。</li>\n<li>版本迭代计划。</li>\n</ul>\n<h3>18.5 商业化阶段</h3>\n<ul>\n<li>解决方案 PPT。</li>\n<li>商业模式说明。</li>\n<li>ROI 测算。</li>\n<li>报价模型。</li>\n<li>交付模板。</li>\n<li>客户案例。</li>\n</ul>\n<hr />\n<hr />\n", "plain": "   18. AI 产品经理常用交付物清单\n\n    18.1 需求阶段\n\n  AI 场景清单。\n  AI 适配性分析。\n  用户旅程图。\n  业务流程图。\n  数据 / 知识来源清单。\n  风险评估表。\n\n    18.2 设计阶段\n\n  AI PRD。\n  Prompt 设计文档。\n  输出 Schema。\n  Workflow 节点设计。\n  Agent 工具清单。\n  权限设计。\n  交互原型。\n\n    18.3 验证阶段\n\n  测试集。\n  标准答案。\n  评测报告。\n  错误样本库。\n  成本测算。\n  PoC 总结。\n\n    18.4 上线阶段\n\n  上线方案。\n  运维手册。\n  用户培训材料。\n  监控指标。\n  应急预案。\n  版本迭代计划。\n\n    18.5 商业化阶段\n\n  解决方案 PPT。\n  商业模式说明。\n  ROI 测算。\n  报价模型。\n  交付模板。\n  客户案例。\n\n   \n\n   ", "is_new": false}, {"num": 19, "title": "最小可行学习闭环", "html": "<h2>19. 最小可行学习闭环</h2>\n<p>不要只学概念，建议按这个闭环推进：</p>\n<pre><code class=\"language-text\">选一个真实业务场景\n→ 准备 10 份真实或模拟资料\n→ 做一个 RAG Demo\n→ 建 30 条测试问题\n→ 记录错误案例\n→ 优化 Chunk / Prompt / 检索\n→ 增加 Workflow\n→ 增加人工审核\n→ 输出 PRD 和案例说明\n→ 包装成作品集\n</code></pre>\n<p>最推荐的第一个项目：</p>\n<pre><code class=\"language-text\">工程项目知识库问答 RAG Demo\n</code></pre>\n<p>原因：</p>\n<ul>\n<li>符合你的 BIM / 工程 / 地产背景。</li>\n<li>容易准备资料。</li>\n<li>能覆盖文档解析、RAG、Prompt、引用来源、评测。</li>\n<li>面试时容易讲清楚业务价值。</li>\n<li>后续可扩展到合同审查、周报生成、巡检工单、标书制作。</li>\n</ul>\n<hr />\n<hr />\n", "plain": "   19. 最小可行学习闭环\n\n不要只学概念，建议按这个闭环推进：\n\n   text\n选一个真实业务场景\n→ 准备 10 份真实或模拟资料\n→ 做一个 RAG Demo\n→ 建 30 条测试问题\n→ 记录错误案例\n→ 优化 Chunk / Prompt / 检索\n→ 增加 Workflow\n→ 增加人工审核\n→ 输出 PRD 和案例说明\n→ 包装成作品集\n   \n\n最推荐的第一个项目：\n\n   text\n工程项目知识库问答 RAG Demo\n   \n\n原因：\n\n  符合你的 BIM / 工程 / 地产背景。\n  容易准备资料。\n  能覆盖文档解析、RAG、Prompt、引用来源、评测。\n  面试时容易讲清楚业务价值。\n  后续可扩展到合同审查、周报生成、巡检工单、标书制作。\n\n   \n\n   ", "is_new": false}, {"num": 20, "title": "AI 产品经理必须懂的工程性能常识", "html": "<h2>20. AI 产品经理必须懂的工程性能常识</h2>\n<blockquote>\n<p>本章是 v1.1 新增内容。目的不是把产品经理训练成算法工程师，而是让产品经理能听懂技术团队在说什么，并能把技术约束转化为产品取舍、体验策略、验收指标和上线边界。</p>\n</blockquote>\n<h3>20.1 为什么 AI 产品经理必须懂一点工程性能</h3>\n<p>AI 产品上线后最常见的问题不是“模型完全不会”，而是：</p>\n<ul>\n<li>Demo 阶段响应很快，上线多人使用后变慢。</li>\n<li>单轮问答效果不错，多轮对话后上下文混乱。</li>\n<li>RAG 检索偶尔准、偶尔不准，业务方觉得不稳定。</li>\n<li>加了 Rerank 后准确率提升，但时延明显增加。</li>\n<li>长文档问题经常触发 Token 超限，模型输出被截断。</li>\n<li>结构化输出偶尔不符合 JSON Schema，导致后续流程失败。</li>\n<li>Agent 调工具偶发失败，用户不知道到底是模型失败、接口失败还是权限失败。</li>\n</ul>\n<p>这些问题如果只交给技术团队处理，产品经理就会失去对体验、成本、风险和上线节奏的控制。</p>\n<h3>20.2 产品经理需要理解的性能指标</h3>\n<table>\n<thead>\n<tr>\n  <th>指标</th>\n  <th>含义</th>\n  <th>产品经理要关注什么</th>\n  <th>常见产品取舍</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>首 Token 延迟</td>\n  <td>用户发起请求后，模型开始输出第一个字的时间</td>\n  <td>用户是否感觉“卡住”</td>\n  <td>采用流式输出、等待态、异步任务</td>\n</tr>\n<tr>\n  <td>总响应时长</td>\n  <td>从请求到完整答案返回的总时间</td>\n  <td>任务是否还能被用户接受</td>\n  <td>缩短上下文、减少工具调用、分段输出</td>\n</tr>\n<tr>\n  <td>并发能力</td>\n  <td>同时处理多少用户请求</td>\n  <td>高峰期是否排队或限流</td>\n  <td>排队提示、套餐限制、后台任务</td>\n</tr>\n<tr>\n  <td>吞吐量</td>\n  <td>单位时间可完成多少请求</td>\n  <td>系统整体处理能力</td>\n  <td>批处理、缓存、模型路由</td>\n</tr>\n<tr>\n  <td>Token 消耗</td>\n  <td>输入和输出消耗的 Token 数</td>\n  <td>成本是否可控</td>\n  <td>Prompt 压缩、上下文裁剪、摘要</td>\n</tr>\n<tr>\n  <td>检索时延</td>\n  <td>从知识库召回资料的时间</td>\n  <td>RAG 是否拖慢整体体验</td>\n  <td>调整 topK、索引、过滤条件</td>\n</tr>\n<tr>\n  <td>工具调用时延</td>\n  <td>Agent 调外部接口的耗时</td>\n  <td>多步骤任务是否可用</td>\n  <td>并行调用、超时控制、失败降级</td>\n</tr>\n<tr>\n  <td>Schema 通过率</td>\n  <td>模型输出符合结构化格式的比例</td>\n  <td>后续流程是否稳定</td>\n  <td>输出约束、重试、校验器、兜底</td>\n</tr>\n<tr>\n  <td>失败率</td>\n  <td>超时、报错、无结果、权限失败等比例</td>\n  <td>是否达到上线门槛</td>\n  <td>灰度、监控、人工接管</td>\n</tr>\n</tbody>\n</table>\n<h3>20.3 向量数据库与索引：产品经理需要懂到什么程度</h3>\n<p>向量数据库不是“万能知识库”，它的核心作用是：把文本转换成向量后，按照语义相似度找出最相关的内容。</p>\n<p>产品经理不需要掌握 HNSW 的算法细节，但需要理解以下产品级事实：</p>\n<ol>\n<li><p><strong>召回速度和召回质量存在权衡</strong><br />\n索引越大、检索越复杂、过滤条件越多，速度可能越慢；为了提高速度，系统可能牺牲一部分召回完整性。</p>\n</li>\n<li><p><strong>topK 不是越大越好</strong><br />\ntopK 太小可能漏资料，topK 太大可能引入噪声，还会挤占模型上下文。</p>\n</li>\n<li><p><strong>向量检索不擅长精确字段匹配</strong><br />\n例如合同编号、设备编码、楼栋房号、条款号等，往往需要关键词检索、元数据过滤或结构化数据库配合。</p>\n</li>\n<li><p><strong>知识库更新会影响结果稳定性</strong><br />\n新增、删除、重建索引后，同一个问题的召回结果可能变化，因此需要版本管理和回归测试。</p>\n</li>\n<li><p><strong>Embedding 模型变化会导致召回结果变化</strong><br />\n更换 Embedding 模型后，原有向量需要重建，测试集也要重新验证。</p>\n</li>\n</ol>\n<h3>20.4 RAG 性能的常见权衡</h3>\n<table>\n<thead>\n<tr>\n  <th>设计项</th>\n  <th>倾向准确</th>\n  <th>倾向速度 / 成本</th>\n  <th>产品判断方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>topK</td>\n  <td>增大 topK，召回更多资料</td>\n  <td>减小 topK，减少噪声和上下文</td>\n  <td>高风险问答可提高 topK，普通问答保持较小</td>\n</tr>\n<tr>\n  <td>Rerank</td>\n  <td>增加 Rerank，提高排序质量</td>\n  <td>不使用 Rerank，减少时延</td>\n  <td>对合同、制度、规范类问答建议启用</td>\n</tr>\n<tr>\n  <td>Chunk 大小</td>\n  <td>大 Chunk 保留上下文</td>\n  <td>小 Chunk 更精准、成本更低</td>\n  <td>条款类小 Chunk，方案类可适当大 Chunk</td>\n</tr>\n<tr>\n  <td>混合检索</td>\n  <td>向量 + 关键词更稳</td>\n  <td>单一检索更简单</td>\n  <td>编号、日期、名称多的场景建议混合检索</td>\n</tr>\n<tr>\n  <td>引用颗粒度</td>\n  <td>引用到段落 / 页码更可信</td>\n  <td>只引用文件名实现更简单</td>\n  <td>对外展示和高风险场景要细引用</td>\n</tr>\n<tr>\n  <td>回答生成</td>\n  <td>让模型综合归纳</td>\n  <td>只输出原文摘录</td>\n  <td>低风险可归纳，高风险要严格依据原文</td>\n</tr>\n</tbody>\n</table>\n<h3>20.5 模型推理、流式输出与用户体验</h3>\n<p>流式输出只能改善“用户感觉有响应”，不等于后端真实处理更快。</p>\n<p>产品设计时要区分三类等待：</p>\n<table>\n<thead>\n<tr>\n  <th>等待类型</th>\n  <th>用户看到什么</th>\n  <th>产品策略</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>短等待，1-3 秒</td>\n  <td>轻微停顿</td>\n  <td>普通 loading 即可</td>\n</tr>\n<tr>\n  <td>中等待，3-10 秒</td>\n  <td>感觉系统在思考</td>\n  <td>显示“正在检索资料 / 正在分析条款”</td>\n</tr>\n<tr>\n  <td>长等待，10 秒以上</td>\n  <td>可能认为系统卡死</td>\n  <td>采用异步任务、进度提示、消息通知</td>\n</tr>\n</tbody>\n</table>\n<p>建议在 PRD 中明确：</p>\n<pre><code class=\"language-text\">响应体验要求：\n1. 1 秒内展示请求已收到。\n2. 3 秒内展示当前处理阶段。\n3. 超过 10 秒提示用户可能需要较长时间。\n4. 超过 30 秒自动中止或转为后台任务。\n5. 后台任务完成后通过站内消息 / 邮件 / 待办提醒用户。\n</code></pre>\n<h3>20.6 Token 预算设计</h3>\n<p>Token 是 AI 产品的“隐性成本”和“隐性容量限制”。</p>\n<p>一个 RAG 请求通常包含：</p>\n<pre><code class=\"language-text\">系统 Prompt\n+ 用户问题\n+ 历史对话\n+ 检索到的知识片段\n+ 输出格式要求\n+ 工具调用结果\n+ 模型最终回答\n</code></pre>\n<p>产品经理需要在 PRD 中定义 Token 预算策略：</p>\n<table>\n<thead>\n<tr>\n  <th>预算项</th>\n  <th>建议策略</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>系统 Prompt</td>\n  <td>保持精简，避免堆砌重复规则</td>\n</tr>\n<tr>\n  <td>历史对话</td>\n  <td>只保留与当前问题相关的上下文，必要时摘要</td>\n</tr>\n<tr>\n  <td>知识片段</td>\n  <td>控制 topK 和片段长度，按相关性排序</td>\n</tr>\n<tr>\n  <td>工具结果</td>\n  <td>只传必要字段，不传完整原始响应</td>\n</tr>\n<tr>\n  <td>输出长度</td>\n  <td>按任务设置上限，例如摘要 500 字、报告 1500 字</td>\n</tr>\n<tr>\n  <td>超限处理</td>\n  <td>分段处理、摘要压缩、追问用户缩小范围</td>\n</tr>\n</tbody>\n</table>\n<h3>20.7 模型网关、路由与降级</h3>\n<p>生产级 AI 产品不应该把所有任务都绑定到一个模型。</p>\n<p>常见模型路由策略：</p>\n<table>\n<thead>\n<tr>\n  <th>任务类型</th>\n  <th>推荐策略</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>简单分类、抽取、改写</td>\n  <td>使用低成本快速模型</td>\n</tr>\n<tr>\n  <td>复杂推理、方案生成、长文档分析</td>\n  <td>使用能力更强的模型</td>\n</tr>\n<tr>\n  <td>高风险审核</td>\n  <td>强模型 + 规则校验 + 人工复核</td>\n</tr>\n<tr>\n  <td>高并发问答</td>\n  <td>快模型优先，必要时排队或降级</td>\n</tr>\n<tr>\n  <td>私有数据场景</td>\n  <td>优先使用满足数据合规要求的模型部署方式</td>\n</tr>\n</tbody>\n</table>\n<p>降级策略示例：</p>\n<pre><code class=\"language-text\">主模型不可用 → 备用模型\n备用模型不可用 → 模板化回答 / 人工处理\n知识库检索不可用 → 明确提示暂无法基于资料回答\n工具接口不可用 → 中止动作，不允许模型编造结果\n</code></pre>\n<h3>20.8 缓存机制：降低成本和提升体验</h3>\n<p>AI 产品中可以缓存的内容包括：</p>\n<ul>\n<li>高频标准问题的答案。</li>\n<li>知识库检索结果。</li>\n<li>文档解析结果。</li>\n<li>Embedding 结果。</li>\n<li>模板化报告中固定部分。</li>\n<li>Agent 工具调用中非实时数据。</li>\n</ul>\n<p>但缓存必须注意：</p>\n<ol>\n<li>权限变化后缓存必须失效。</li>\n<li>文档更新后相关答案缓存必须失效。</li>\n<li>涉及实时状态的问题不能直接使用旧缓存。</li>\n<li>对外输出时要显示答案生成或资料更新时间。</li>\n</ol>\n<h3>20.9 AI 产品工程性能 PRD 增补字段</h3>\n<p>在 AI 产品 PRD 中，建议新增以下字段：</p>\n<table>\n<thead>\n<tr>\n  <th>字段</th>\n  <th>内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>模型调用链路</td>\n  <td>用哪个模型、是否经过模型网关、是否有备用模型</td>\n</tr>\n<tr>\n  <td>响应时间目标</td>\n  <td>首 Token、总响应时长、超时阈值</td>\n</tr>\n<tr>\n  <td>并发目标</td>\n  <td>预计日活、峰值并发、排队策略</td>\n</tr>\n<tr>\n  <td>Token 预算</td>\n  <td>单次请求最大输入 / 输出 Token，超限策略</td>\n</tr>\n<tr>\n  <td>检索配置</td>\n  <td>topK、Rerank、混合检索、元数据过滤</td>\n</tr>\n<tr>\n  <td>缓存策略</td>\n  <td>哪些内容缓存、缓存多久、失效条件</td>\n</tr>\n<tr>\n  <td>降级策略</td>\n  <td>模型失败、检索失败、工具失败时怎么处理</td>\n</tr>\n<tr>\n  <td>成本估算</td>\n  <td>单次调用成本、月度调用量、预算上限</td>\n</tr>\n<tr>\n  <td>监控指标</td>\n  <td>时延、错误率、Token、成本、召回质量、用户反馈</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   20. AI 产品经理必须懂的工程性能常识\n\n  本章是 v1.1 新增内容。目的不是把产品经理训练成算法工程师，而是让产品经理能听懂技术团队在说什么，并能把技术约束转化为产品取舍、体验策略、验收指标和上线边界。\n\n    20.1 为什么 AI 产品经理必须懂一点工程性能\n\nAI 产品上线后最常见的问题不是“模型完全不会”，而是：\n\n  Demo 阶段响应很快，上线多人使用后变慢。\n  单轮问答效果不错，多轮对话后上下文混乱。\n  RAG 检索偶尔准、偶尔不准，业务方觉得不稳定。\n  加了 Rerank 后准确率提升，但时延明显增加。\n  长文档问题经常触发 Token 超限，模型输出被截断。\n  结构化输出偶尔不符合 JSON Schema，导致后续流程失败。\n  Agent 调工具偶发失败，用户不知道到底是模型失败、接口失败还是权限失败。\n\n这些问题如果只交给技术团队处理，产品经理就会失去对体验、成本、风险和上线节奏的控制。\n\n    20.2 产品经理需要理解的性能指标\n\n  指标   含义   产品经理要关注什么   常见产品取舍  \n                 \n  首 Token 延迟   用户发起请求后，模型开始输出第一个字的时间   用户是否感觉“卡住”   采用流式输出、等待态、异步任务  \n  总响应时长   从请求到完整答案返回的总时间   任务是否还能被用户接受   缩短上下文、减少工具调用、分段输出  \n  并发能力   同时处理多少用户请求   高峰期是否排队或限流   排队提示、套餐限制、后台任务  \n  吞吐量   单位时间可完成多少请求   系统整体处理能力   批处理、缓存、模型路由  \n  Token 消耗   输入和输出消耗的 Token 数   成本是否可控   Prompt 压缩、上下文裁剪、摘要  \n  检索时延   从知识库召回资料的时间   RAG 是否拖慢整体体验   调整 topK、索引、过滤条件  \n  工具调用时延   Agent 调外部接口的耗时   多步骤任务是否可用   并行调用、超时控制、失败降级  \n  Schema 通过率   模型输出符合结构化格式的比例   后续流程是否稳定   输出约束、重试、校验器、兜底  \n  失败率   超时、报错、无结果、权限失败等比例   是否达到上线门槛   灰度、监控、人工接管  \n\n    20.3 向量数据库与索引：产品经理需要懂到什么程度\n\n向量数据库不是“万能知识库”，它的核心作用是：把文本转换成向量后，按照语义相似度找出最相关的内容。\n\n产品经理不需要掌握 HNSW 的算法细节，但需要理解以下产品级事实：\n\n1.   召回速度和召回质量存在权衡    \n   索引越大、检索越复杂、过滤条件越多，速度可能越慢；为了提高速度，系统可能牺牲一部分召回完整性。\n\n2.   topK 不是越大越好    \n   topK 太小可能漏资料，topK 太大可能引入噪声，还会挤占模型上下文。\n\n3.   向量检索不擅长精确字段匹配    \n   例如合同编号、设备编码、楼栋房号、条款号等，往往需要关键词检索、元数据过滤或结构化数据库配合。\n\n4.   知识库更新会影响结果稳定性    \n   新增、删除、重建索引后，同一个问题的召回结果可能变化，因此需要版本管理和回归测试。\n\n5.   Embedding 模型变化会导致召回结果变化    \n   更换 Embedding 模型后，原有向量需要重建，测试集也要重新验证。\n\n    20.4 RAG 性能的常见权衡\n\n  设计项   倾向准确   倾向速度 / 成本   产品判断方式  \n                 \n  topK   增大 topK，召回更多资料   减小 topK，减少噪声和上下文   高风险问答可提高 topK，普通问答保持较小  \n  Rerank   增加 Rerank，提高排序质量   不使用 Rerank，减少时延   对合同、制度、规范类问答建议启用  \n  Chunk 大小   大 Chunk 保留上下文   小 Chunk 更精准、成本更低   条款类小 Chunk，方案类可适当大 Chunk  \n  混合检索   向量 + 关键词更稳   单一检索更简单   编号、日期、名称多的场景建议混合检索  \n  引用颗粒度   引用到段落 / 页码更可信   只引用文件名实现更简单   对外展示和高风险场景要细引用  \n  回答生成   让模型综合归纳   只输出原文摘录   低风险可归纳，高风险要严格依据原文  \n\n    20.5 模型推理、流式输出与用户体验\n\n流式输出只能改善“用户感觉有响应”，不等于后端真实处理更快。\n\n产品设计时要区分三类等待：\n\n  等待类型   用户看到什么   产品策略  \n             \n  短等待，1 3 秒   轻微停顿   普通 loading 即可  \n  中等待，3 10 秒   感觉系统在思考   显示“正在检索资料 / 正在分析条款”  \n  长等待，10 秒以上   可能认为系统卡死   采用异步任务、进度提示、消息通知  \n\n建议在 PRD 中明确：\n\n   text\n响应体验要求：\n1. 1 秒内展示请求已收到。\n2. 3 秒内展示当前处理阶段。\n3. 超过 10 秒提示用户可能需要较长时间。\n4. 超过 30 秒自动中止或转为后台任务。\n5. 后台任务完成后通过站内消息 / 邮件 / 待办提醒用户。\n   \n\n    20.6 Token 预算设计\n\nToken 是 AI 产品的“隐性成本”和“隐性容量限制”。\n\n一个 RAG 请求通常包含：\n\n   text\n系统 Prompt\n+ 用户问题\n+ 历史对话\n+ 检索到的知识片段\n+ 输出格式要求\n+ 工具调用结果\n+ 模型最终回答\n   \n\n产品经理需要在 PRD 中定义 Token 预算策略：\n\n  预算项   建议策略  \n         \n  系统 Prompt   保持精简，避免堆砌重复规则  \n  历史对话   只保留与当前问题相关的上下文，必要时摘要  \n  知识片段   控制 topK 和片段长度，按相关性排序  \n  工具结果   只传必要字段，不传完整原始响应  \n  输出长度   按任务设置上限，例如摘要 500 字、报告 1500 字  \n  超限处理   分段处理、摘要压缩、追问用户缩小范围  \n\n    20.7 模型网关、路由与降级\n\n生产级 AI 产品不应该把所有任务都绑定到一个模型。\n\n常见模型路由策略：\n\n  任务类型   推荐策略  \n         \n  简单分类、抽取、改写   使用低成本快速模型  \n  复杂推理、方案生成、长文档分析   使用能力更强的模型  \n  高风险审核   强模型 + 规则校验 + 人工复核  \n  高并发问答   快模型优先，必要时排队或降级  \n  私有数据场景   优先使用满足数据合规要求的模型部署方式  \n\n降级策略示例：\n\n   text\n主模型不可用 → 备用模型\n备用模型不可用 → 模板化回答 / 人工处理\n知识库检索不可用 → 明确提示暂无法基于资料回答\n工具接口不可用 → 中止动作，不允许模型编造结果\n   \n\n    20.8 缓存机制：降低成本和提升体验\n\nAI 产品中可以缓存的内容包括：\n\n  高频标准问题的答案。\n  知识库检索结果。\n  文档解析结果。\n  Embedding 结果。\n  模板化报告中固定部分。\n  Agent 工具调用中非实时数据。\n\n但缓存必须注意：\n\n1. 权限变化后缓存必须失效。\n2. 文档更新后相关答案缓存必须失效。\n3. 涉及实时状态的问题不能直接使用旧缓存。\n4. 对外输出时要显示答案生成或资料更新时间。\n\n    20.9 AI 产品工程性能 PRD 增补字段\n\n在 AI 产品 PRD 中，建议新增以下字段：\n\n  字段   内容  \n         \n  模型调用链路   用哪个模型、是否经过模型网关、是否有备用模型  \n  响应时间目标   首 Token、总响应时长、超时阈值  \n  并发目标   预计日活、峰值并发、排队策略  \n  Token 预算   单次请求最大输入 / 输出 Token，超限策略  \n  检索配置   topK、Rerank、混合检索、元数据过滤  \n  缓存策略   哪些内容缓存、缓存多久、失效条件  \n  降级策略   模型失败、检索失败、工具失败时怎么处理  \n  成本估算   单次调用成本、月度调用量、预算上限  \n  监控指标   时延、错误率、Token、成本、召回质量、用户反馈  \n\n   \n\n   ", "is_new": true}, {"num": 21, "title": "知识库数据清洗、标注与质检 SOP", "html": "<h2>21. 知识库数据清洗、标注与质检 SOP</h2>\n<blockquote>\n<p>本章是 v1.1 新增内容。原文档已经讲了文档入库、Chunk、Embedding、检索、Rerank、引用和评测。本章进一步把它细化成项目可执行 SOP，解决“知道要做知识库，但不知道怎么组织资料、清洗、标注和验收”的问题。</p>\n</blockquote>\n<h3>21.1 知识库建设的真实工作量</h3>\n<p>企业知识库项目的难点通常不是把文档丢进系统，而是：</p>\n<ul>\n<li>文档版本混乱，不知道哪个是正式版。</li>\n<li>PDF 扫描件、表格、图片、页眉页脚导致解析噪声。</li>\n<li>同一个概念在不同部门叫法不同。</li>\n<li>文档权限复杂，不能所有人都看所有资料。</li>\n<li>条款、表格、附件、补充协议之间存在交叉引用。</li>\n<li>测试问题缺乏标准答案，业务方只凭感觉评价“好不好”。</li>\n</ul>\n<p>所以知识库建设不是技术动作，而是一个数据产品工程。</p>\n<h3>21.2 知识库数据工程总流程</h3>\n<pre><code class=\"language-text\">资料盘点\n→ 权限确认\n→ 文档分级\n→ 文档清洗\n→ 元数据补充\n→ Chunk 切分\n→ Chunk 质检\n→ Embedding 入库\n→ 测试集建设\n→ 人工评测\n→ 错误样本复盘\n→ 持续更新机制\n</code></pre>\n<h3>21.3 资料盘点清单</h3>\n<table>\n<thead>\n<tr>\n  <th>盘点项</th>\n  <th>说明</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文档名称</td>\n  <td>原始文件名和标准文件名</td>\n  <td>《XX 项目施工周报第 12 期》</td>\n</tr>\n<tr>\n  <td>文档类型</td>\n  <td>制度、合同、方案、报告、会议纪要、FAQ</td>\n  <td>合同 / 制度 / 项目资料</td>\n</tr>\n<tr>\n  <td>业务归属</td>\n  <td>哪个部门、项目或业务线负责</td>\n  <td>工程管理部 / 成本部</td>\n</tr>\n<tr>\n  <td>权威等级</td>\n  <td>正式发布、草稿、历史版本、参考资料</td>\n  <td>正式版优先</td>\n</tr>\n<tr>\n  <td>生效状态</td>\n  <td>有效、废止、待确认</td>\n  <td>有效</td>\n</tr>\n<tr>\n  <td>生效时间</td>\n  <td>文档适用起始时间</td>\n  <td>2026-01-01</td>\n</tr>\n<tr>\n  <td>版本号</td>\n  <td>版本标识</td>\n  <td>v1.0 / v2.1</td>\n</tr>\n<tr>\n  <td>权限范围</td>\n  <td>哪些角色可见</td>\n  <td>总部 / 项目 / 外包单位</td>\n</tr>\n<tr>\n  <td>更新频率</td>\n  <td>固定周期或不定期</td>\n  <td>每月 / 每周</td>\n</tr>\n<tr>\n  <td>负责人</td>\n  <td>内容维护人</td>\n  <td>业务负责人 / 文档管理员</td>\n</tr>\n</tbody>\n</table>\n<h3>21.4 文档清洗标准</h3>\n<table>\n<thead>\n<tr>\n  <th>问题类型</th>\n  <th>清洗规则</th>\n  <th>验收标准</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>页眉页脚</td>\n  <td>删除重复页眉、页脚、页码、水印</td>\n  <td>不进入 Chunk 内容</td>\n</tr>\n<tr>\n  <td>目录</td>\n  <td>保留目录层级，但不作为正文重复入库</td>\n  <td>不影响检索结果</td>\n</tr>\n<tr>\n  <td>扫描件</td>\n  <td>OCR 后人工抽检</td>\n  <td>关键字段识别准确</td>\n</tr>\n<tr>\n  <td>表格</td>\n  <td>转为 Markdown 表格或结构化 JSON</td>\n  <td>行列关系不丢失</td>\n</tr>\n<tr>\n  <td>图片</td>\n  <td>关键图表需要文字说明</td>\n  <td>不只保留“图片”占位</td>\n</tr>\n<tr>\n  <td>附件</td>\n  <td>与主文档建立关联</td>\n  <td>可追溯来源</td>\n</tr>\n<tr>\n  <td>重复文档</td>\n  <td>保留权威版本，历史版本标记</td>\n  <td>不重复召回冲突内容</td>\n</tr>\n<tr>\n  <td>废止文档</td>\n  <td>不进入正式知识库或标记为废止</td>\n  <td>不用于确定性回答</td>\n</tr>\n<tr>\n  <td>混合语言</td>\n  <td>保持原文，必要时补翻译字段</td>\n  <td>检索不失真</td>\n</tr>\n<tr>\n  <td>乱码</td>\n  <td>人工修复或剔除</td>\n  <td>不产生无意义 Chunk</td>\n</tr>\n</tbody>\n</table>\n<h3>21.5 元数据标准</h3>\n<p>知识库不是只存正文，还必须存元数据。</p>\n<p>建议最小元数据字段：</p>\n<pre><code class=\"language-json\">{\n  &quot;doc_id&quot;: &quot;DOC-2026-001&quot;,\n  &quot;doc_name&quot;: &quot;XX项目施工周报第12期&quot;,\n  &quot;doc_type&quot;: &quot;施工周报&quot;,\n  &quot;business_domain&quot;: &quot;工程管理&quot;,\n  &quot;project_name&quot;: &quot;XX项目&quot;,\n  &quot;department&quot;: &quot;工程管理部&quot;,\n  &quot;version&quot;: &quot;v1.0&quot;,\n  &quot;effective_status&quot;: &quot;有效&quot;,\n  &quot;effective_date&quot;: &quot;2026-06-01&quot;,\n  &quot;permission_level&quot;: &quot;项目团队可见&quot;,\n  &quot;source_file&quot;: &quot;XX项目施工周报第12期.pdf&quot;,\n  &quot;page_start&quot;: 3,\n  &quot;page_end&quot;: 4,\n  &quot;chunk_id&quot;: &quot;DOC-2026-001-C012&quot;\n}\n</code></pre>\n<p>元数据的产品价值：</p>\n<ul>\n<li>支持权限过滤。</li>\n<li>支持按项目、部门、文档类型筛选。</li>\n<li>支持引用来源。</li>\n<li>支持版本更新和失效。</li>\n<li>支持错误追溯和人工复核。</li>\n</ul>\n<h3>21.6 Chunk 切分质检规则</h3>\n<table>\n<thead>\n<tr>\n  <th>检查项</th>\n  <th>合格标准</th>\n  <th>常见问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>语义完整性</td>\n  <td>单个 Chunk 表达一个完整意思</td>\n  <td>把一条制度切断导致语义残缺</td>\n</tr>\n<tr>\n  <td>长度控制</td>\n  <td>不过长，不严重挤占上下文</td>\n  <td>一整章作为一个 Chunk</td>\n</tr>\n<tr>\n  <td>标题继承</td>\n  <td>Chunk 保留上级标题路径</td>\n  <td>不知道内容属于哪个章节</td>\n</tr>\n<tr>\n  <td>表格完整</td>\n  <td>表头和行内容在同一 Chunk 中</td>\n  <td>表头和数据分离</td>\n</tr>\n<tr>\n  <td>条款编号</td>\n  <td>保留编号、层级和原文</td>\n  <td>丢失第几条、第几款</td>\n</tr>\n<tr>\n  <td>来源可追溯</td>\n  <td>保留文件名、页码、段落</td>\n  <td>无法引用来源</td>\n</tr>\n<tr>\n  <td>重复控制</td>\n  <td>避免相同内容多次入库</td>\n  <td>多版本重复召回</td>\n</tr>\n<tr>\n  <td>权限继承</td>\n  <td>Chunk 继承文档权限</td>\n  <td>越权召回资料</td>\n</tr>\n</tbody>\n</table>\n<h3>21.7 标注规范：什么是好答案</h3>\n<p>建议将回答质量分为 5 类：</p>\n<table>\n<thead>\n<tr>\n  <th>等级</th>\n  <th>判定标准</th>\n  <th>处理方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>A 正确且有依据</td>\n  <td>回答正确，引用来源准确，未扩大解释</td>\n  <td>通过</td>\n</tr>\n<tr>\n  <td>B 基本正确但不完整</td>\n  <td>核心结论正确，但遗漏部分条件</td>\n  <td>记录优化</td>\n</tr>\n<tr>\n  <td>C 引用了资料但解释偏差</td>\n  <td>找到资料，但理解或归纳错误</td>\n  <td>优化 Prompt / 输出约束</td>\n</tr>\n<tr>\n  <td>D 无依据生成</td>\n  <td>知识库无依据却给出确定答案</td>\n  <td>必须修复</td>\n</tr>\n<tr>\n  <td>E 事实错误 / 越权 / 高风险</td>\n  <td>输出错误、泄密或误导</td>\n  <td>禁止上线</td>\n</tr>\n</tbody>\n</table>\n<h3>21.8 测试集建设标准</h3>\n<p>一个可用的 RAG 测试集至少包括：</p>\n<table>\n<thead>\n<tr>\n  <th>问题类型</th>\n  <th style=\"text-align:right\">占比建议</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>标准事实问答</td>\n  <td style=\"text-align:right\">25%</td>\n  <td>“本项目的合同工期是多少天？”</td>\n</tr>\n<tr>\n  <td>条款解释</td>\n  <td style=\"text-align:right\">20%</td>\n  <td>“逾期责任如何约定？”</td>\n</tr>\n<tr>\n  <td>跨文档综合</td>\n  <td style=\"text-align:right\">15%</td>\n  <td>“本周进度风险和合同节点是否冲突？”</td>\n</tr>\n<tr>\n  <td>同义改写</td>\n  <td style=\"text-align:right\">10%</td>\n  <td>“延期怎么赔？”</td>\n</tr>\n<tr>\n  <td>无答案问题</td>\n  <td style=\"text-align:right\">10%</td>\n  <td>“资料里有没有明确罚款比例？”</td>\n</tr>\n<tr>\n  <td>歧义问题</td>\n  <td style=\"text-align:right\">10%</td>\n  <td>“这个项目现在怎么样？”</td>\n</tr>\n<tr>\n  <td>高风险问题</td>\n  <td style=\"text-align:right\">5%</td>\n  <td>“能不能直接给出法律责任结论？”</td>\n</tr>\n<tr>\n  <td>权限边界问题</td>\n  <td style=\"text-align:right\">5%</td>\n  <td>“外包单位能否查看成本明细？”</td>\n</tr>\n</tbody>\n</table>\n<p>建议数量：</p>\n<ul>\n<li>Demo：20-30 条。</li>\n<li>PoC：50-100 条。</li>\n<li>MVP：100-300 条。</li>\n<li>生产系统：持续沉淀，不低于核心场景高频问题覆盖。</li>\n</ul>\n<h3>21.9 人工评审表模板</h3>\n<table>\n<thead>\n<tr>\n  <th>字段</th>\n  <th>填写说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>question_id</td>\n  <td>测试问题编号</td>\n</tr>\n<tr>\n  <td>user_question</td>\n  <td>用户问题</td>\n</tr>\n<tr>\n  <td>expected_answer</td>\n  <td>标准答案</td>\n</tr>\n<tr>\n  <td>required_sources</td>\n  <td>必须引用的来源</td>\n</tr>\n<tr>\n  <td>model_answer</td>\n  <td>模型回答</td>\n</tr>\n<tr>\n  <td>retrieved_chunks</td>\n  <td>实际召回片段</td>\n</tr>\n<tr>\n  <td>source_correct</td>\n  <td>来源是否正确</td>\n</tr>\n<tr>\n  <td>answer_correct</td>\n  <td>答案是否正确</td>\n</tr>\n<tr>\n  <td>faithfulness_score</td>\n  <td>是否忠实于原文，1-5 分</td>\n</tr>\n<tr>\n  <td>completeness_score</td>\n  <td>是否完整，1-5 分</td>\n</tr>\n<tr>\n  <td>risk_level</td>\n  <td>低 / 中 / 高</td>\n</tr>\n<tr>\n  <td>error_type</td>\n  <td>召回失败 / 理解错误 / 幻觉 / 越权 / 格式错误</td>\n</tr>\n<tr>\n  <td>action</td>\n  <td>优化数据 / 优化 Prompt / 优化检索 / 加人工审核</td>\n</tr>\n</tbody>\n</table>\n<h3>21.10 错误样本库分类</h3>\n<p>错误样本库不是“bug 列表”，而是 AI 产品持续优化的核心资产。</p>\n<table>\n<thead>\n<tr>\n  <th>错误类型</th>\n  <th>可能原因</th>\n  <th>优化方向</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>未召回正确资料</td>\n  <td>Chunk 切分差、Embedding 不适配、topK 太小</td>\n  <td>调整 Chunk、混合检索、Rerank</td>\n</tr>\n<tr>\n  <td>召回正确但答错</td>\n  <td>Prompt 约束不足、模型理解错误</td>\n  <td>增加依据解释、限制自由发挥</td>\n</tr>\n<tr>\n  <td>引用错误</td>\n  <td>来源字段缺失、引用规则不清</td>\n  <td>强制引用 chunk_id / 页码</td>\n</tr>\n<tr>\n  <td>无依据编造</td>\n  <td>拒答规则弱</td>\n  <td>增加“无依据必须拒答”</td>\n</tr>\n<tr>\n  <td>答案不完整</td>\n  <td>召回片段不足、上下文被截断</td>\n  <td>增加多路召回、分步回答</td>\n</tr>\n<tr>\n  <td>格式错误</td>\n  <td>Schema 复杂、输出示例不足</td>\n  <td>简化 Schema、增加重试</td>\n</tr>\n<tr>\n  <td>越权回答</td>\n  <td>权限过滤缺失</td>\n  <td>检索前权限过滤</td>\n</tr>\n<tr>\n  <td>旧版本污染</td>\n  <td>废止文档未处理</td>\n  <td>版本管理、失效机制</td>\n</tr>\n</tbody>\n</table>\n<h3>21.11 知识库上线前验收门槛</h3>\n<p>建议最低验收门槛：</p>\n<pre><code class=\"language-text\">1. 核心问题正确率 ≥ 85%\n2. 高风险问题正确拒答率 ≥ 95%\n3. 引用来源准确率 ≥ 90%\n4. 无依据编造率 ≤ 3%\n5. 权限边界问题越权率 = 0\n6. Schema 输出通过率 ≥ 98%\n7. P95 响应时间满足业务要求\n8. 所有错误样本已分类并有处理结论\n</code></pre>\n<hr />\n<hr />\n", "plain": "   21. 知识库数据清洗、标注与质检 SOP\n\n  本章是 v1.1 新增内容。原文档已经讲了文档入库、Chunk、Embedding、检索、Rerank、引用和评测。本章进一步把它细化成项目可执行 SOP，解决“知道要做知识库，但不知道怎么组织资料、清洗、标注和验收”的问题。\n\n    21.1 知识库建设的真实工作量\n\n企业知识库项目的难点通常不是把文档丢进系统，而是：\n\n  文档版本混乱，不知道哪个是正式版。\n  PDF 扫描件、表格、图片、页眉页脚导致解析噪声。\n  同一个概念在不同部门叫法不同。\n  文档权限复杂，不能所有人都看所有资料。\n  条款、表格、附件、补充协议之间存在交叉引用。\n  测试问题缺乏标准答案，业务方只凭感觉评价“好不好”。\n\n所以知识库建设不是技术动作，而是一个数据产品工程。\n\n    21.2 知识库数据工程总流程\n\n   text\n资料盘点\n→ 权限确认\n→ 文档分级\n→ 文档清洗\n→ 元数据补充\n→ Chunk 切分\n→ Chunk 质检\n→ Embedding 入库\n→ 测试集建设\n→ 人工评测\n→ 错误样本复盘\n→ 持续更新机制\n   \n\n    21.3 资料盘点清单\n\n  盘点项   说明   示例  \n             \n  文档名称   原始文件名和标准文件名   《XX 项目施工周报第 12 期》  \n  文档类型   制度、合同、方案、报告、会议纪要、FAQ   合同 / 制度 / 项目资料  \n  业务归属   哪个部门、项目或业务线负责   工程管理部 / 成本部  \n  权威等级   正式发布、草稿、历史版本、参考资料   正式版优先  \n  生效状态   有效、废止、待确认   有效  \n  生效时间   文档适用起始时间   2026 01 01  \n  版本号   版本标识   v1.0 / v2.1  \n  权限范围   哪些角色可见   总部 / 项目 / 外包单位  \n  更新频率   固定周期或不定期   每月 / 每周  \n  负责人   内容维护人   业务负责人 / 文档管理员  \n\n    21.4 文档清洗标准\n\n  问题类型   清洗规则   验收标准  \n             \n  页眉页脚   删除重复页眉、页脚、页码、水印   不进入 Chunk 内容  \n  目录   保留目录层级，但不作为正文重复入库   不影响检索结果  \n  扫描件   OCR 后人工抽检   关键字段识别准确  \n  表格   转为 Markdown 表格或结构化 JSON   行列关系不丢失  \n  图片   关键图表需要文字说明   不只保留“图片”占位  \n  附件   与主文档建立关联   可追溯来源  \n  重复文档   保留权威版本，历史版本标记   不重复召回冲突内容  \n  废止文档   不进入正式知识库或标记为废止   不用于确定性回答  \n  混合语言   保持原文，必要时补翻译字段   检索不失真  \n  乱码   人工修复或剔除   不产生无意义 Chunk  \n\n    21.5 元数据标准\n\n知识库不是只存正文，还必须存元数据。\n\n建议最小元数据字段：\n\n   json\n{\n  \"doc id\": \"DOC 2026 001\",\n  \"doc name\": \"XX项目施工周报第12期\",\n  \"doc type\": \"施工周报\",\n  \"business domain\": \"工程管理\",\n  \"project name\": \"XX项目\",\n  \"department\": \"工程管理部\",\n  \"version\": \"v1.0\",\n  \"effective status\": \"有效\",\n  \"effective date\": \"2026 06 01\",\n  \"permission level\": \"项目团队可见\",\n  \"source file\": \"XX项目施工周报第12期.pdf\",\n  \"page start\": 3,\n  \"page end\": 4,\n  \"chunk id\": \"DOC 2026 001 C012\"\n}\n   \n\n元数据的产品价值：\n\n  支持权限过滤。\n  支持按项目、部门、文档类型筛选。\n  支持引用来源。\n  支持版本更新和失效。\n  支持错误追溯和人工复核。\n\n    21.6 Chunk 切分质检规则\n\n  检查项   合格标准   常见问题  \n             \n  语义完整性   单个 Chunk 表达一个完整意思   把一条制度切断导致语义残缺  \n  长度控制   不过长，不严重挤占上下文   一整章作为一个 Chunk  \n  标题继承   Chunk 保留上级标题路径   不知道内容属于哪个章节  \n  表格完整   表头和行内容在同一 Chunk 中   表头和数据分离  \n  条款编号   保留编号、层级和原文   丢失第几条、第几款  \n  来源可追溯   保留文件名、页码、段落   无法引用来源  \n  重复控制   避免相同内容多次入库   多版本重复召回  \n  权限继承   Chunk 继承文档权限   越权召回资料  \n\n    21.7 标注规范：什么是好答案\n\n建议将回答质量分为 5 类：\n\n  等级   判定标准   处理方式  \n             \n  A 正确且有依据   回答正确，引用来源准确，未扩大解释   通过  \n  B 基本正确但不完整   核心结论正确，但遗漏部分条件   记录优化  \n  C 引用了资料但解释偏差   找到资料，但理解或归纳错误   优化 Prompt / 输出约束  \n  D 无依据生成   知识库无依据却给出确定答案   必须修复  \n  E 事实错误 / 越权 / 高风险   输出错误、泄密或误导   禁止上线  \n\n    21.8 测试集建设标准\n\n一个可用的 RAG 测试集至少包括：\n\n  问题类型   占比建议   示例  \n        :     \n  标准事实问答   25%   “本项目的合同工期是多少天？”  \n  条款解释   20%   “逾期责任如何约定？”  \n  跨文档综合   15%   “本周进度风险和合同节点是否冲突？”  \n  同义改写   10%   “延期怎么赔？”  \n  无答案问题   10%   “资料里有没有明确罚款比例？”  \n  歧义问题   10%   “这个项目现在怎么样？”  \n  高风险问题   5%   “能不能直接给出法律责任结论？”  \n  权限边界问题   5%   “外包单位能否查看成本明细？”  \n\n建议数量：\n\n  Demo：20 30 条。\n  PoC：50 100 条。\n  MVP：100 300 条。\n  生产系统：持续沉淀，不低于核心场景高频问题覆盖。\n\n    21.9 人工评审表模板\n\n  字段   填写说明  \n         \n  question id   测试问题编号  \n  user question   用户问题  \n  expected answer   标准答案  \n  required sources   必须引用的来源  \n  model answer   模型回答  \n  retrieved chunks   实际召回片段  \n  source correct   来源是否正确  \n  answer correct   答案是否正确  \n  faithfulness score   是否忠实于原文，1 5 分  \n  completeness score   是否完整，1 5 分  \n  risk level   低 / 中 / 高  \n  error type   召回失败 / 理解错误 / 幻觉 / 越权 / 格式错误  \n  action   优化数据 / 优化 Prompt / 优化检索 / 加人工审核  \n\n    21.10 错误样本库分类\n\n错误样本库不是“bug 列表”，而是 AI 产品持续优化的核心资产。\n\n  错误类型   可能原因   优化方向  \n             \n  未召回正确资料   Chunk 切分差、Embedding 不适配、topK 太小   调整 Chunk、混合检索、Rerank  \n  召回正确但答错   Prompt 约束不足、模型理解错误   增加依据解释、限制自由发挥  \n  引用错误   来源字段缺失、引用规则不清   强制引用 chunk id / 页码  \n  无依据编造   拒答规则弱   增加“无依据必须拒答”  \n  答案不完整   召回片段不足、上下文被截断   增加多路召回、分步回答  \n  格式错误   Schema 复杂、输出示例不足   简化 Schema、增加重试  \n  越权回答   权限过滤缺失   检索前权限过滤  \n  旧版本污染   废止文档未处理   版本管理、失效机制  \n\n    21.11 知识库上线前验收门槛\n\n建议最低验收门槛：\n\n   text\n1. 核心问题正确率 ≥ 85%\n2. 高风险问题正确拒答率 ≥ 95%\n3. 引用来源准确率 ≥ 90%\n4. 无依据编造率 ≤ 3%\n5. 权限边界问题越权率 = 0\n6. Schema 输出通过率 ≥ 98%\n7. P95 响应时间满足业务要求\n8. 所有错误样本已分类并有处理结论\n   \n\n   \n\n   ", "is_new": true}, {"num": 22, "title": "RAG 生产级优化与问题排查手册", "html": "<h2>22. RAG 生产级优化与问题排查手册</h2>\n<blockquote>\n<p>本章是 v1.1 新增内容。原文档已经建立了 RAG 的基本知识，本章进一步回答：当 RAG 效果不好时，产品经理应该如何定位问题，而不是只说“模型不行”。</p>\n</blockquote>\n<h3>22.1 RAG 问题定位总思路</h3>\n<p>RAG 的回答质量由四个环节共同决定：</p>\n<pre><code class=\"language-text\">用户问题理解\n→ 检索是否找到正确资料\n→ 排序是否把正确资料放在前面\n→ 生成是否忠实依据资料回答\n</code></pre>\n<p>因此排查时要分层：</p>\n<table>\n<thead>\n<tr>\n  <th>层级</th>\n  <th>要问的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>问题理解层</td>\n  <td>用户问题是否清楚？是否存在歧义？</td>\n</tr>\n<tr>\n  <td>检索层</td>\n  <td>正确资料有没有被召回？</td>\n</tr>\n<tr>\n  <td>排序层</td>\n  <td>正确资料是否排在前几位？</td>\n</tr>\n<tr>\n  <td>上下文层</td>\n  <td>正确资料是否进入模型上下文？</td>\n</tr>\n<tr>\n  <td>生成层</td>\n  <td>模型是否忠实依据资料回答？</td>\n</tr>\n<tr>\n  <td>输出层</td>\n  <td>是否按格式、引用和风险规则输出？</td>\n</tr>\n</tbody>\n</table>\n<h3>22.2 RAG 常见问题矩阵</h3>\n<table>\n<thead>\n<tr>\n  <th>现象</th>\n  <th>可能原因</th>\n  <th>产品经理排查动作</th>\n  <th>优化方向</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>完全答非所问</td>\n  <td>用户问题歧义、检索失败</td>\n  <td>查看召回片段</td>\n  <td>增加追问、改检索配置</td>\n</tr>\n<tr>\n  <td>找不到明明存在的资料</td>\n  <td>Chunk 切分不合理、关键词缺失</td>\n  <td>用原文关键词测试</td>\n  <td>混合检索、元数据过滤</td>\n</tr>\n<tr>\n  <td>答案引用了错误文件</td>\n  <td>多版本文档冲突</td>\n  <td>检查文档权威等级</td>\n  <td>版本管理、废止旧文档</td>\n</tr>\n<tr>\n  <td>找到资料但解释错</td>\n  <td>Prompt 未限制解释边界</td>\n  <td>对比原文和回答</td>\n  <td>增加“不得扩大解释”规则</td>\n</tr>\n<tr>\n  <td>回答太泛</td>\n  <td>召回片段太多或问题太宽</td>\n  <td>检查 topK 和问题类型</td>\n  <td>追问用户、分步回答</td>\n</tr>\n<tr>\n  <td>回答遗漏条件</td>\n  <td>topK 太小或上下文截断</td>\n  <td>检查召回覆盖</td>\n  <td>增大 topK、分段检索</td>\n</tr>\n<tr>\n  <td>引用来源不准确</td>\n  <td>来源元数据缺失</td>\n  <td>检查 chunk_id / 页码</td>\n  <td>完善元数据</td>\n</tr>\n<tr>\n  <td>无答案还硬答</td>\n  <td>拒答策略缺失</td>\n  <td>检查无答案测试集</td>\n  <td>增加拒答门槛</td>\n</tr>\n<tr>\n  <td>响应慢</td>\n  <td>Rerank、长上下文、模型慢</td>\n  <td>查看链路耗时</td>\n  <td>缓存、路由、异步任务</td>\n</tr>\n</tbody>\n</table>\n<h3>22.3 RAG 调优顺序</h3>\n<p>不要一上来就换模型。建议按以下顺序排查：</p>\n<pre><code class=\"language-text\">1. 看原始资料是否正确、完整、权威。\n2. 看文档解析是否出现乱码、表格丢失、页眉污染。\n3. 看 Chunk 是否语义完整。\n4. 看正确 Chunk 是否被召回。\n5. 看正确 Chunk 是否排在前面。\n6. 看正确 Chunk 是否进入模型上下文。\n7. 看 Prompt 是否要求基于原文回答。\n8. 看输出 Schema 和引用规则是否清晰。\n9. 最后再考虑更换 Embedding、Rerank 或 LLM。\n</code></pre>\n<h3>22.4 召回失败时怎么优化</h3>\n<table>\n<thead>\n<tr>\n  <th>优化手段</th>\n  <th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>调整 Chunk 大小</td>\n  <td>内容被切碎或过长</td>\n</tr>\n<tr>\n  <td>增加标题路径</td>\n  <td>章节上下文丢失</td>\n</tr>\n<tr>\n  <td>增加元数据</td>\n  <td>需要按项目、部门、文档类型过滤</td>\n</tr>\n<tr>\n  <td>使用关键词检索</td>\n  <td>编号、名称、日期、条款号多</td>\n</tr>\n<tr>\n  <td>使用混合检索</td>\n  <td>语义问题 + 精确词都重要</td>\n</tr>\n<tr>\n  <td>启用 Rerank</td>\n  <td>召回有正确资料但排序靠后</td>\n</tr>\n<tr>\n  <td>Query 改写</td>\n  <td>用户表达不规范、口语化</td>\n</tr>\n<tr>\n  <td>建同义词表</td>\n  <td>业务术语多、叫法不统一</td>\n</tr>\n</tbody>\n</table>\n<h3>22.5 生成错误时怎么优化</h3>\n<p>如果召回正确但回答错误，重点不是检索，而是生成控制。</p>\n<p>可用策略：</p>\n<ol>\n<li>要求逐条依据原文回答。</li>\n<li>要求每个结论绑定来源。</li>\n<li>禁止扩大解释、禁止自行补充。</li>\n<li>对无依据结论单独标记“仅供参考”。</li>\n<li>高风险问题只输出原文摘要，不输出判断意见。</li>\n<li>增加回答前自检：问题、答案、来源是否一致。</li>\n<li>结构化输出时增加字段含义和空置规则。</li>\n</ol>\n<p>示例 Prompt 约束：</p>\n<pre><code class=\"language-text\">你必须基于检索到的资料回答。\n每个结论必须对应至少一个来源。\n如果资料没有明确说明，请输出“当前资料未明确”。\n不得根据常识、经验或行业惯例补充资料中没有的信息。\n不得扩大解释合同条款、制度条款或法律条文。\n</code></pre>\n<h3>22.6 引用来源设计</h3>\n<table>\n<thead>\n<tr>\n  <th>引用层级</th>\n  <th>适用场景</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文件名</td>\n  <td>普通知识问答</td>\n  <td>来源：《项目管理制度》</td>\n</tr>\n<tr>\n  <td>文件名 + 章节</td>\n  <td>制度问答</td>\n  <td>来源：《项目管理制度》第 3 章</td>\n</tr>\n<tr>\n  <td>文件名 + 页码</td>\n  <td>PDF / 报告类</td>\n  <td>来源：第 12 页</td>\n</tr>\n<tr>\n  <td>文件名 + 条款号</td>\n  <td>合同 / 法规</td>\n  <td>来源：第 8.2 条</td>\n</tr>\n<tr>\n  <td>chunk_id</td>\n  <td>系统调试 / 评测</td>\n  <td>DOC-001-C008</td>\n</tr>\n<tr>\n  <td>原文片段</td>\n  <td>高风险场景</td>\n  <td>展示原文摘录</td>\n</tr>\n</tbody>\n</table>\n<p>产品建议：</p>\n<ul>\n<li>用户侧显示“可理解来源”。</li>\n<li>运营 / 评测侧保留 chunk_id。</li>\n<li>高风险问答必须展示原文片段。</li>\n</ul>\n<h3>22.7 RAG 成本优化</h3>\n<table>\n<thead>\n<tr>\n  <th>成本来源</th>\n  <th>优化方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文档解析</td>\n  <td>增量解析，避免重复入库</td>\n</tr>\n<tr>\n  <td>Embedding</td>\n  <td>文档不变不重复向量化</td>\n</tr>\n<tr>\n  <td>检索</td>\n  <td>控制 topK 和过滤范围</td>\n</tr>\n<tr>\n  <td>Rerank</td>\n  <td>只对高价值场景启用</td>\n</tr>\n<tr>\n  <td>LLM 输入</td>\n  <td>压缩 Prompt、控制上下文</td>\n</tr>\n<tr>\n  <td>LLM 输出</td>\n  <td>限制回答长度</td>\n</tr>\n<tr>\n  <td>高频问题</td>\n  <td>答案缓存</td>\n</tr>\n<tr>\n  <td>评测</td>\n  <td>自动评测 + 抽样人工复核</td>\n</tr>\n</tbody>\n</table>\n<h3>22.8 RAG 运营看板指标</h3>\n<p>建议上线后持续监控：</p>\n<table>\n<thead>\n<tr>\n  <th>指标</th>\n  <th>目的</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>日问题量</td>\n  <td>看使用规模</td>\n</tr>\n<tr>\n  <td>有效问题率</td>\n  <td>看用户是否真的在解决业务问题</td>\n</tr>\n<tr>\n  <td>无答案率</td>\n  <td>看知识库覆盖不足</td>\n</tr>\n<tr>\n  <td>拒答率</td>\n  <td>看拒答策略是否过严或合理</td>\n</tr>\n<tr>\n  <td>用户追问率</td>\n  <td>看第一次回答是否清楚</td>\n</tr>\n<tr>\n  <td>点赞 / 点踩率</td>\n  <td>看主观满意度</td>\n</tr>\n<tr>\n  <td>引用点击率</td>\n  <td>看用户是否依赖来源</td>\n</tr>\n<tr>\n  <td>错误反馈类型</td>\n  <td>指导优化</td>\n</tr>\n<tr>\n  <td>响应时延</td>\n  <td>体验监控</td>\n</tr>\n<tr>\n  <td>Token 成本</td>\n  <td>成本监控</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   22. RAG 生产级优化与问题排查手册\n\n  本章是 v1.1 新增内容。原文档已经建立了 RAG 的基本知识，本章进一步回答：当 RAG 效果不好时，产品经理应该如何定位问题，而不是只说“模型不行”。\n\n    22.1 RAG 问题定位总思路\n\nRAG 的回答质量由四个环节共同决定：\n\n   text\n用户问题理解\n→ 检索是否找到正确资料\n→ 排序是否把正确资料放在前面\n→ 生成是否忠实依据资料回答\n   \n\n因此排查时要分层：\n\n  层级   要问的问题  \n         \n  问题理解层   用户问题是否清楚？是否存在歧义？  \n  检索层   正确资料有没有被召回？  \n  排序层   正确资料是否排在前几位？  \n  上下文层   正确资料是否进入模型上下文？  \n  生成层   模型是否忠实依据资料回答？  \n  输出层   是否按格式、引用和风险规则输出？  \n\n    22.2 RAG 常见问题矩阵\n\n  现象   可能原因   产品经理排查动作   优化方向  \n                 \n  完全答非所问   用户问题歧义、检索失败   查看召回片段   增加追问、改检索配置  \n  找不到明明存在的资料   Chunk 切分不合理、关键词缺失   用原文关键词测试   混合检索、元数据过滤  \n  答案引用了错误文件   多版本文档冲突   检查文档权威等级   版本管理、废止旧文档  \n  找到资料但解释错   Prompt 未限制解释边界   对比原文和回答   增加“不得扩大解释”规则  \n  回答太泛   召回片段太多或问题太宽   检查 topK 和问题类型   追问用户、分步回答  \n  回答遗漏条件   topK 太小或上下文截断   检查召回覆盖   增大 topK、分段检索  \n  引用来源不准确   来源元数据缺失   检查 chunk id / 页码   完善元数据  \n  无答案还硬答   拒答策略缺失   检查无答案测试集   增加拒答门槛  \n  响应慢   Rerank、长上下文、模型慢   查看链路耗时   缓存、路由、异步任务  \n\n    22.3 RAG 调优顺序\n\n不要一上来就换模型。建议按以下顺序排查：\n\n   text\n1. 看原始资料是否正确、完整、权威。\n2. 看文档解析是否出现乱码、表格丢失、页眉污染。\n3. 看 Chunk 是否语义完整。\n4. 看正确 Chunk 是否被召回。\n5. 看正确 Chunk 是否排在前面。\n6. 看正确 Chunk 是否进入模型上下文。\n7. 看 Prompt 是否要求基于原文回答。\n8. 看输出 Schema 和引用规则是否清晰。\n9. 最后再考虑更换 Embedding、Rerank 或 LLM。\n   \n\n    22.4 召回失败时怎么优化\n\n  优化手段   适用场景  \n         \n  调整 Chunk 大小   内容被切碎或过长  \n  增加标题路径   章节上下文丢失  \n  增加元数据   需要按项目、部门、文档类型过滤  \n  使用关键词检索   编号、名称、日期、条款号多  \n  使用混合检索   语义问题 + 精确词都重要  \n  启用 Rerank   召回有正确资料但排序靠后  \n  Query 改写   用户表达不规范、口语化  \n  建同义词表   业务术语多、叫法不统一  \n\n    22.5 生成错误时怎么优化\n\n如果召回正确但回答错误，重点不是检索，而是生成控制。\n\n可用策略：\n\n1. 要求逐条依据原文回答。\n2. 要求每个结论绑定来源。\n3. 禁止扩大解释、禁止自行补充。\n4. 对无依据结论单独标记“仅供参考”。\n5. 高风险问题只输出原文摘要，不输出判断意见。\n6. 增加回答前自检：问题、答案、来源是否一致。\n7. 结构化输出时增加字段含义和空置规则。\n\n示例 Prompt 约束：\n\n   text\n你必须基于检索到的资料回答。\n每个结论必须对应至少一个来源。\n如果资料没有明确说明，请输出“当前资料未明确”。\n不得根据常识、经验或行业惯例补充资料中没有的信息。\n不得扩大解释合同条款、制度条款或法律条文。\n   \n\n    22.6 引用来源设计\n\n  引用层级   适用场景   示例  \n             \n  文件名   普通知识问答   来源：《项目管理制度》  \n  文件名 + 章节   制度问答   来源：《项目管理制度》第 3 章  \n  文件名 + 页码   PDF / 报告类   来源：第 12 页  \n  文件名 + 条款号   合同 / 法规   来源：第 8.2 条  \n  chunk id   系统调试 / 评测   DOC 001 C008  \n  原文片段   高风险场景   展示原文摘录  \n\n产品建议：\n\n  用户侧显示“可理解来源”。\n  运营 / 评测侧保留 chunk id。\n  高风险问答必须展示原文片段。\n\n    22.7 RAG 成本优化\n\n  成本来源   优化方式  \n         \n  文档解析   增量解析，避免重复入库  \n  Embedding   文档不变不重复向量化  \n  检索   控制 topK 和过滤范围  \n  Rerank   只对高价值场景启用  \n  LLM 输入   压缩 Prompt、控制上下文  \n  LLM 输出   限制回答长度  \n  高频问题   答案缓存  \n  评测   自动评测 + 抽样人工复核  \n\n    22.8 RAG 运营看板指标\n\n建议上线后持续监控：\n\n  指标   目的  \n         \n  日问题量   看使用规模  \n  有效问题率   看用户是否真的在解决业务问题  \n  无答案率   看知识库覆盖不足  \n  拒答率   看拒答策略是否过严或合理  \n  用户追问率   看第一次回答是否清楚  \n  点赞 / 点踩率   看主观满意度  \n  引用点击率   看用户是否依赖来源  \n  错误反馈类型   指导优化  \n  响应时延   体验监控  \n  Token 成本   成本监控  \n\n   \n\n   ", "is_new": true}, {"num": 23, "title": "Workflow / Agent 异常处理与 Fallback 矩阵", "html": "<h2>23. Workflow / Agent 异常处理与 Fallback 矩阵</h2>\n<blockquote>\n<p>本章是 v1.1 新增内容。企业级 AI 产品不能只设计“理想路径”，必须设计失败路径、降级路径、人工接管路径和审计路径。</p>\n</blockquote>\n<h3>23.1 为什么异常处理是 AI 产品的分水岭</h3>\n<p>传统系统的异常通常来自接口、网络、权限或数据格式。AI 产品除了这些，还会出现：</p>\n<ul>\n<li>模型输出不稳定。</li>\n<li>结构化结果不合格。</li>\n<li>RAG 召回噪声。</li>\n<li>Agent 调错工具。</li>\n<li>多步骤任务中途偏离目标。</li>\n<li>模型输出看似合理但实际无依据。</li>\n</ul>\n<p>所以 AI 产品 PRD 必须写清楚：失败了怎么办。</p>\n<h3>23.2 通用异常分级</h3>\n<table>\n<thead>\n<tr>\n  <th>等级</th>\n  <th>类型</th>\n  <th>示例</th>\n  <th>处理原则</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>P0 致命风险</td>\n  <td>越权、泄密、错误执行高风险动作</td>\n  <td>未授权查看合同金额</td>\n  <td>阻断、告警、人工处理</td>\n</tr>\n<tr>\n  <td>P1 高风险</td>\n  <td>输出错误但可能被用户采信</td>\n  <td>错误解释合同责任</td>\n  <td>拒答或人工复核</td>\n</tr>\n<tr>\n  <td>P2 中风险</td>\n  <td>影响效率但不直接造成损失</td>\n  <td>输出格式错误、接口超时</td>\n  <td>重试、降级、提示</td>\n</tr>\n<tr>\n  <td>P3 低风险</td>\n  <td>体验问题</td>\n  <td>回答慢、措辞不佳</td>\n  <td>优化体验和运营</td>\n</tr>\n</tbody>\n</table>\n<h3>23.3 异常处理矩阵</h3>\n<table>\n<thead>\n<tr>\n  <th>异常场景</th>\n  <th>用户侧表现</th>\n  <th>系统处理</th>\n  <th>产品兜底文案</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>模型 5 秒未返回</td>\n  <td>仍在等待</td>\n  <td>展示处理阶段</td>\n  <td>“正在分析资料，请稍候。”</td>\n</tr>\n<tr>\n  <td>模型 30 秒未返回</td>\n  <td>任务超时</td>\n  <td>中止或转异步</td>\n  <td>“本次分析时间较长，已为你转为后台处理。”</td>\n</tr>\n<tr>\n  <td>API 限流</td>\n  <td>暂不可用</td>\n  <td>排队或降级模型</td>\n  <td>“当前请求较多，系统将稍后继续处理。”</td>\n</tr>\n<tr>\n  <td>模型输出截断</td>\n  <td>回答不完整</td>\n  <td>继续生成或提示重试</td>\n  <td>“回答内容较长，已分段继续生成。”</td>\n</tr>\n<tr>\n  <td>JSON Schema 不通过</td>\n  <td>流程无法继续</td>\n  <td>自动重试一次</td>\n  <td>“生成结果格式异常，系统正在重新整理。”</td>\n</tr>\n<tr>\n  <td>二次重试仍失败</td>\n  <td>任务失败</td>\n  <td>中止并记录日志</td>\n  <td>“本次生成失败，请调整输入后重试。”</td>\n</tr>\n<tr>\n  <td>RAG 无召回</td>\n  <td>没有依据</td>\n  <td>拒答</td>\n  <td>“资料库未检索到相关依据，无法给出确定回答。”</td>\n</tr>\n<tr>\n  <td>RAG 低相关</td>\n  <td>依据不足</td>\n  <td>追问或拒答</td>\n  <td>“当前问题范围较宽，请补充项目、时间或文档范围。”</td>\n</tr>\n<tr>\n  <td>工具调用失败</td>\n  <td>动作未完成</td>\n  <td>回滚、中止</td>\n  <td>“外部系统暂未返回结果，本次操作未执行。”</td>\n</tr>\n<tr>\n  <td>权限不足</td>\n  <td>看不到资料</td>\n  <td>阻断</td>\n  <td>“你暂无权限查看该资料。”</td>\n</tr>\n<tr>\n  <td>高风险动作</td>\n  <td>需要确认</td>\n  <td>人工确认</td>\n  <td>“该操作会影响业务数据，请确认后再执行。”</td>\n</tr>\n<tr>\n  <td>Agent 循环过多</td>\n  <td>任务卡住</td>\n  <td>达到步数上限停止</td>\n  <td>“任务已停止，未能完成全部步骤。”</td>\n</tr>\n<tr>\n  <td>成本超预算</td>\n  <td>暂停任务</td>\n  <td>提示或审批</td>\n  <td>“该任务预计消耗较高，需要审批后继续。”</td>\n</tr>\n</tbody>\n</table>\n<h3>23.4 Workflow 节点级兜底设计</h3>\n<p>每个 Workflow 节点都应该定义：</p>\n<table>\n<thead>\n<tr>\n  <th>字段</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>节点目标</td>\n  <td>这个节点要完成什么</td>\n</tr>\n<tr>\n  <td>输入要求</td>\n  <td>必填字段、格式、权限</td>\n</tr>\n<tr>\n  <td>输出 Schema</td>\n  <td>结构化输出字段</td>\n</tr>\n<tr>\n  <td>成功标准</td>\n  <td>什么算成功</td>\n</tr>\n<tr>\n  <td>失败条件</td>\n  <td>哪些情况算失败</td>\n</tr>\n<tr>\n  <td>重试规则</td>\n  <td>重试次数、间隔、是否更换模型</td>\n</tr>\n<tr>\n  <td>超时规则</td>\n  <td>多久超时、超时后怎么处理</td>\n</tr>\n<tr>\n  <td>人工介入</td>\n  <td>哪些条件转人工</td>\n</tr>\n<tr>\n  <td>日志字段</td>\n  <td>需要记录哪些信息</td>\n</tr>\n<tr>\n  <td>回滚策略</td>\n  <td>失败后是否撤销上一步</td>\n</tr>\n</tbody>\n</table>\n<h3>23.5 Agent 运行时控制</h3>\n<p>Agent 的风险在于“动态决策”，所以必须给它加运行边界。</p>\n<table>\n<thead>\n<tr>\n  <th>控制项</th>\n  <th>建议规则</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>最大步骤数</td>\n  <td>例如最多 5-10 步，超过停止</td>\n</tr>\n<tr>\n  <td>工具白名单</td>\n  <td>只能调用允许的工具</td>\n</tr>\n<tr>\n  <td>工具权限</td>\n  <td>不同角色可调用不同工具</td>\n</tr>\n<tr>\n  <td>参数校验</td>\n  <td>工具调用前校验参数</td>\n</tr>\n<tr>\n  <td>高风险动作确认</td>\n  <td>写入、删除、提交、付款等必须人工确认</td>\n</tr>\n<tr>\n  <td>中间结果可见</td>\n  <td>关键步骤让用户看到</td>\n</tr>\n<tr>\n  <td>运行日志</td>\n  <td>保存推理摘要、工具调用、结果、错误</td>\n</tr>\n<tr>\n  <td>回滚能力</td>\n  <td>对可逆动作设计撤销</td>\n</tr>\n<tr>\n  <td>成本上限</td>\n  <td>单任务 Token / 金额上限</td>\n</tr>\n<tr>\n  <td>终止条件</td>\n  <td>达成目标、失败、超预算、超步数、用户取消</td>\n</tr>\n</tbody>\n</table>\n<h3>23.6 高风险场景处理原则</h3>\n<p>以下场景不建议让模型自动决策并直接执行：</p>\n<ul>\n<li>合同责任判断。</li>\n<li>法律法规结论。</li>\n<li>财务付款、审批、扣款。</li>\n<li>消防、安防、生产安全等高风险操作。</li>\n<li>人事考核、处罚、录用淘汰。</li>\n<li>医疗、心理、金融投资建议。</li>\n<li>数据删除、批量修改、权限变更。</li>\n</ul>\n<p>产品处理原则：</p>\n<pre><code class=\"language-text\">AI 可以辅助整理、归纳、提示风险；\nAI 不应直接替代责任人做最终决策；\n高风险结论必须显示依据、置信度、限制条件和人工确认入口。\n</code></pre>\n<h3>23.7 异常日志与审计字段</h3>\n<table>\n<thead>\n<tr>\n  <th>字段</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>trace_id</td>\n  <td>单次任务追踪 ID</td>\n</tr>\n<tr>\n  <td>user_id</td>\n  <td>用户 ID</td>\n</tr>\n<tr>\n  <td>role</td>\n  <td>用户角色</td>\n</tr>\n<tr>\n  <td>request_time</td>\n  <td>请求时间</td>\n</tr>\n<tr>\n  <td>input</td>\n  <td>用户输入</td>\n</tr>\n<tr>\n  <td>workflow_node</td>\n  <td>当前节点</td>\n</tr>\n<tr>\n  <td>model_name</td>\n  <td>使用模型</td>\n</tr>\n<tr>\n  <td>prompt_version</td>\n  <td>Prompt 版本</td>\n</tr>\n<tr>\n  <td>knowledge_base_version</td>\n  <td>知识库版本</td>\n</tr>\n<tr>\n  <td>retrieved_chunks</td>\n  <td>召回片段 ID</td>\n</tr>\n<tr>\n  <td>tool_calls</td>\n  <td>工具调用记录</td>\n</tr>\n<tr>\n  <td>output</td>\n  <td>模型输出</td>\n</tr>\n<tr>\n  <td>schema_valid</td>\n  <td>Schema 是否通过</td>\n</tr>\n<tr>\n  <td>error_type</td>\n  <td>错误类型</td>\n</tr>\n<tr>\n  <td>fallback_action</td>\n  <td>兜底动作</td>\n</tr>\n<tr>\n  <td>human_review</td>\n  <td>是否人工复核</td>\n</tr>\n<tr>\n  <td>final_status</td>\n  <td>成功 / 失败 / 转人工</td>\n</tr>\n</tbody>\n</table>\n<h3>23.8 AI 产品异常处理 PRD 模板</h3>\n<pre><code class=\"language-text\">【异常处理设计】\n\n1. 异常场景：\n   - 模型超时\n   - 检索无结果\n   - 输出格式错误\n   - 权限不足\n   - 工具调用失败\n\n2. 异常等级：P0 / P1 / P2 / P3\n\n3. 触发条件：\n   - 例如：模型 30 秒未返回；Schema 校验失败；召回相关度低于阈值。\n\n4. 系统动作：\n   - 重试 / 降级 / 拒答 / 转人工 / 回滚 / 告警。\n\n5. 用户提示：\n   - 用户能理解的提示语，不暴露技术细节。\n\n6. 日志记录：\n   - 记录 trace_id、Prompt 版本、知识库版本、错误类型。\n\n7. 运营处理：\n   - 错误进入样本库，每周复盘。\n</code></pre>\n<hr />\n<hr />\n", "plain": "   23. Workflow / Agent 异常处理与 Fallback 矩阵\n\n  本章是 v1.1 新增内容。企业级 AI 产品不能只设计“理想路径”，必须设计失败路径、降级路径、人工接管路径和审计路径。\n\n    23.1 为什么异常处理是 AI 产品的分水岭\n\n传统系统的异常通常来自接口、网络、权限或数据格式。AI 产品除了这些，还会出现：\n\n  模型输出不稳定。\n  结构化结果不合格。\n  RAG 召回噪声。\n  Agent 调错工具。\n  多步骤任务中途偏离目标。\n  模型输出看似合理但实际无依据。\n\n所以 AI 产品 PRD 必须写清楚：失败了怎么办。\n\n    23.2 通用异常分级\n\n  等级   类型   示例   处理原则  \n                 \n  P0 致命风险   越权、泄密、错误执行高风险动作   未授权查看合同金额   阻断、告警、人工处理  \n  P1 高风险   输出错误但可能被用户采信   错误解释合同责任   拒答或人工复核  \n  P2 中风险   影响效率但不直接造成损失   输出格式错误、接口超时   重试、降级、提示  \n  P3 低风险   体验问题   回答慢、措辞不佳   优化体验和运营  \n\n    23.3 异常处理矩阵\n\n  异常场景   用户侧表现   系统处理   产品兜底文案  \n                 \n  模型 5 秒未返回   仍在等待   展示处理阶段   “正在分析资料，请稍候。”  \n  模型 30 秒未返回   任务超时   中止或转异步   “本次分析时间较长，已为你转为后台处理。”  \n  API 限流   暂不可用   排队或降级模型   “当前请求较多，系统将稍后继续处理。”  \n  模型输出截断   回答不完整   继续生成或提示重试   “回答内容较长，已分段继续生成。”  \n  JSON Schema 不通过   流程无法继续   自动重试一次   “生成结果格式异常，系统正在重新整理。”  \n  二次重试仍失败   任务失败   中止并记录日志   “本次生成失败，请调整输入后重试。”  \n  RAG 无召回   没有依据   拒答   “资料库未检索到相关依据，无法给出确定回答。”  \n  RAG 低相关   依据不足   追问或拒答   “当前问题范围较宽，请补充项目、时间或文档范围。”  \n  工具调用失败   动作未完成   回滚、中止   “外部系统暂未返回结果，本次操作未执行。”  \n  权限不足   看不到资料   阻断   “你暂无权限查看该资料。”  \n  高风险动作   需要确认   人工确认   “该操作会影响业务数据，请确认后再执行。”  \n  Agent 循环过多   任务卡住   达到步数上限停止   “任务已停止，未能完成全部步骤。”  \n  成本超预算   暂停任务   提示或审批   “该任务预计消耗较高，需要审批后继续。”  \n\n    23.4 Workflow 节点级兜底设计\n\n每个 Workflow 节点都应该定义：\n\n  字段   说明  \n         \n  节点目标   这个节点要完成什么  \n  输入要求   必填字段、格式、权限  \n  输出 Schema   结构化输出字段  \n  成功标准   什么算成功  \n  失败条件   哪些情况算失败  \n  重试规则   重试次数、间隔、是否更换模型  \n  超时规则   多久超时、超时后怎么处理  \n  人工介入   哪些条件转人工  \n  日志字段   需要记录哪些信息  \n  回滚策略   失败后是否撤销上一步  \n\n    23.5 Agent 运行时控制\n\nAgent 的风险在于“动态决策”，所以必须给它加运行边界。\n\n  控制项   建议规则  \n         \n  最大步骤数   例如最多 5 10 步，超过停止  \n  工具白名单   只能调用允许的工具  \n  工具权限   不同角色可调用不同工具  \n  参数校验   工具调用前校验参数  \n  高风险动作确认   写入、删除、提交、付款等必须人工确认  \n  中间结果可见   关键步骤让用户看到  \n  运行日志   保存推理摘要、工具调用、结果、错误  \n  回滚能力   对可逆动作设计撤销  \n  成本上限   单任务 Token / 金额上限  \n  终止条件   达成目标、失败、超预算、超步数、用户取消  \n\n    23.6 高风险场景处理原则\n\n以下场景不建议让模型自动决策并直接执行：\n\n  合同责任判断。\n  法律法规结论。\n  财务付款、审批、扣款。\n  消防、安防、生产安全等高风险操作。\n  人事考核、处罚、录用淘汰。\n  医疗、心理、金融投资建议。\n  数据删除、批量修改、权限变更。\n\n产品处理原则：\n\n   text\nAI 可以辅助整理、归纳、提示风险；\nAI 不应直接替代责任人做最终决策；\n高风险结论必须显示依据、置信度、限制条件和人工确认入口。\n   \n\n    23.7 异常日志与审计字段\n\n  字段   说明  \n         \n  trace id   单次任务追踪 ID  \n  user id   用户 ID  \n  role   用户角色  \n  request time   请求时间  \n  input   用户输入  \n  workflow node   当前节点  \n  model name   使用模型  \n  prompt version   Prompt 版本  \n  knowledge base version   知识库版本  \n  retrieved chunks   召回片段 ID  \n  tool calls   工具调用记录  \n  output   模型输出  \n  schema valid   Schema 是否通过  \n  error type   错误类型  \n  fallback action   兜底动作  \n  human review   是否人工复核  \n  final status   成功 / 失败 / 转人工  \n\n    23.8 AI 产品异常处理 PRD 模板\n\n   text\n【异常处理设计】\n\n1. 异常场景：\n     模型超时\n     检索无结果\n     输出格式错误\n     权限不足\n     工具调用失败\n\n2. 异常等级：P0 / P1 / P2 / P3\n\n3. 触发条件：\n     例如：模型 30 秒未返回；Schema 校验失败；召回相关度低于阈值。\n\n4. 系统动作：\n     重试 / 降级 / 拒答 / 转人工 / 回滚 / 告警。\n\n5. 用户提示：\n     用户能理解的提示语，不暴露技术细节。\n\n6. 日志记录：\n     记录 trace id、Prompt 版本、知识库版本、错误类型。\n\n7. 运营处理：\n     错误进入样本库，每周复盘。\n   \n\n   \n\n   ", "is_new": true}, {"num": 24, "title": "AI 产品评测报告模板与案例", "html": "<h2>24. AI 产品评测报告模板与案例</h2>\n<blockquote>\n<p>本章是 v1.1 新增内容。AI 产品经理不能只交付 PRD，还应该交付评测报告。评测报告是判断 AI 功能能否从 Demo 进入 MVP / 生产上线的重要依据。</p>\n</blockquote>\n<h3>24.1 为什么需要评测报告</h3>\n<p>AI 功能不是“功能做完就等于验收通过”。必须回答：</p>\n<ul>\n<li>这个 AI 功能在哪些问题上表现好？</li>\n<li>哪些问题上会失败？</li>\n<li>是否有无依据编造？</li>\n<li>是否会越权？</li>\n<li>是否能稳定输出结构化结果？</li>\n<li>成本和时延是否可接受？</li>\n<li>是否达到上线门槛？</li>\n</ul>\n<h3>24.2 评测报告结构</h3>\n<pre><code class=\"language-text\">1. 评测背景\n2. 评测对象\n3. 评测范围\n4. 测试集说明\n5. 评测指标\n6. 测试结果\n7. 错误样本分析\n8. 风险与限制\n9. 优化建议\n10. 上线结论\n</code></pre>\n<h3>24.3 评测对象说明模板</h3>\n<table>\n<thead>\n<tr>\n  <th>字段</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>产品名称</td>\n  <td>工程项目知识库问答助手</td>\n</tr>\n<tr>\n  <td>功能版本</td>\n  <td>v0.3 PoC</td>\n</tr>\n<tr>\n  <td>模型版本</td>\n  <td>XXX 模型 2026-xx</td>\n</tr>\n<tr>\n  <td>知识库版本</td>\n  <td>KB-Project-2026-06-01</td>\n</tr>\n<tr>\n  <td>Prompt 版本</td>\n  <td>prompt-rag-qa-v0.4</td>\n</tr>\n<tr>\n  <td>测试时间</td>\n  <td>2026-06-10</td>\n</tr>\n<tr>\n  <td>测试人员</td>\n  <td>产品经理 + 业务专家 + 测试人员</td>\n</tr>\n<tr>\n  <td>评测范围</td>\n  <td>项目基础信息、合同条款、施工周报、质量安全问题</td>\n</tr>\n</tbody>\n</table>\n<h3>24.4 指标体系</h3>\n<table>\n<thead>\n<tr>\n  <th>指标</th>\n  <th>定义</th>\n  <th>建议门槛</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>回答正确率</td>\n  <td>答案与标准答案一致的比例</td>\n  <td>≥ 85%</td>\n</tr>\n<tr>\n  <td>引用准确率</td>\n  <td>引用来源与答案匹配的比例</td>\n  <td>≥ 90%</td>\n</tr>\n<tr>\n  <td>忠实度</td>\n  <td>是否严格基于资料回答</td>\n  <td>≥ 4/5</td>\n</tr>\n<tr>\n  <td>完整度</td>\n  <td>是否覆盖关键条件</td>\n  <td>≥ 4/5</td>\n</tr>\n<tr>\n  <td>拒答正确率</td>\n  <td>无依据时正确拒答的比例</td>\n  <td>≥ 95%</td>\n</tr>\n<tr>\n  <td>幻觉率</td>\n  <td>无依据却生成确定结论的比例</td>\n  <td>≤ 3%</td>\n</tr>\n<tr>\n  <td>Schema 通过率</td>\n  <td>结构化输出格式合格比例</td>\n  <td>≥ 98%</td>\n</tr>\n<tr>\n  <td>P95 响应时间</td>\n  <td>95% 请求的响应时间</td>\n  <td>按场景定义</td>\n</tr>\n<tr>\n  <td>单次平均成本</td>\n  <td>平均每次调用成本</td>\n  <td>不超过预算</td>\n</tr>\n<tr>\n  <td>人工接管率</td>\n  <td>需要人工处理的比例</td>\n  <td>按业务阶段定义</td>\n</tr>\n</tbody>\n</table>\n<h3>24.5 错误样本分析模板</h3>\n<table>\n<thead>\n<tr>\n  <th>question_id</th>\n  <th>问题</th>\n  <th>错误类型</th>\n  <th>原因分析</th>\n  <th>优化动作</th>\n  <th>优先级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Q-012</td>\n  <td>合同是否明确逾期罚款比例？</td>\n  <td>无依据编造</td>\n  <td>资料只写有逾期责任，未写比例</td>\n  <td>增加“未明确比例”拒答规则</td>\n  <td>P0</td>\n</tr>\n<tr>\n  <td>Q-021</td>\n  <td>本周安全风险有哪些？</td>\n  <td>回答不完整</td>\n  <td>只召回周报，未召回问题清单</td>\n  <td>增加跨文档检索</td>\n  <td>P1</td>\n</tr>\n<tr>\n  <td>Q-034</td>\n  <td>项目延期责任是谁？</td>\n  <td>高风险判断</td>\n  <td>模型扩大解释</td>\n  <td>改为只输出原文和风险提示</td>\n  <td>P0</td>\n</tr>\n</tbody>\n</table>\n<h3>24.6 示例：RAG 问答评测结论</h3>\n<pre><code class=\"language-text\">本轮共测试 100 个问题，其中标准事实问答 30 个、条款解释 20 个、跨文档综合 20 个、无答案问题 15 个、歧义问题 10 个、高风险问题 5 个。\n\n总体结果：\n- 回答正确率：86%\n- 引用准确率：91%\n- 拒答正确率：93%\n- 幻觉率：4%\n- Schema 通过率：99%\n- P95 响应时间：8.6 秒\n\n结论：\n当前版本已基本满足 PoC 验收要求，但暂不建议直接进入生产上线。主要原因是无答案问题拒答正确率未达到 95%，且高风险条款解释中仍存在扩大解释现象。建议完成 P0 错误样本修复后，再进行第二轮回归测试。\n</code></pre>\n<h3>24.7 上线结论分级</h3>\n<table>\n<thead>\n<tr>\n  <th>结论</th>\n  <th>含义</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>可上线</td>\n  <td>关键指标达标，风险可控</td>\n</tr>\n<tr>\n  <td>可灰度上线</td>\n  <td>核心能力可用，但需限制范围和监控</td>\n</tr>\n<tr>\n  <td>仅可内部试用</td>\n  <td>适合业务专家试用，不面向普通用户</td>\n</tr>\n<tr>\n  <td>继续 PoC</td>\n  <td>方向可行，但质量未达 MVP</td>\n</tr>\n<tr>\n  <td>暂停推进</td>\n  <td>数据、风险、成本或业务价值不满足</td>\n</tr>\n</tbody>\n</table>\n<h3>24.8 评测报告交付物清单</h3>\n<pre><code class=\"language-text\">1. 测试集 Excel / CSV\n2. 标准答案与来源文件\n3. 模型回答记录\n4. 召回片段记录\n5. 指标统计表\n6. 错误样本库\n7. 优化建议清单\n8. 上线风险说明\n9. 回归测试计划\n</code></pre>\n<hr />\n<hr />\n", "plain": "   24. AI 产品评测报告模板与案例\n\n  本章是 v1.1 新增内容。AI 产品经理不能只交付 PRD，还应该交付评测报告。评测报告是判断 AI 功能能否从 Demo 进入 MVP / 生产上线的重要依据。\n\n    24.1 为什么需要评测报告\n\nAI 功能不是“功能做完就等于验收通过”。必须回答：\n\n  这个 AI 功能在哪些问题上表现好？\n  哪些问题上会失败？\n  是否有无依据编造？\n  是否会越权？\n  是否能稳定输出结构化结果？\n  成本和时延是否可接受？\n  是否达到上线门槛？\n\n    24.2 评测报告结构\n\n   text\n1. 评测背景\n2. 评测对象\n3. 评测范围\n4. 测试集说明\n5. 评测指标\n6. 测试结果\n7. 错误样本分析\n8. 风险与限制\n9. 优化建议\n10. 上线结论\n   \n\n    24.3 评测对象说明模板\n\n  字段   示例  \n         \n  产品名称   工程项目知识库问答助手  \n  功能版本   v0.3 PoC  \n  模型版本   XXX 模型 2026 xx  \n  知识库版本   KB Project 2026 06 01  \n  Prompt 版本   prompt rag qa v0.4  \n  测试时间   2026 06 10  \n  测试人员   产品经理 + 业务专家 + 测试人员  \n  评测范围   项目基础信息、合同条款、施工周报、质量安全问题  \n\n    24.4 指标体系\n\n  指标   定义   建议门槛  \n             \n  回答正确率   答案与标准答案一致的比例   ≥ 85%  \n  引用准确率   引用来源与答案匹配的比例   ≥ 90%  \n  忠实度   是否严格基于资料回答   ≥ 4/5  \n  完整度   是否覆盖关键条件   ≥ 4/5  \n  拒答正确率   无依据时正确拒答的比例   ≥ 95%  \n  幻觉率   无依据却生成确定结论的比例   ≤ 3%  \n  Schema 通过率   结构化输出格式合格比例   ≥ 98%  \n  P95 响应时间   95% 请求的响应时间   按场景定义  \n  单次平均成本   平均每次调用成本   不超过预算  \n  人工接管率   需要人工处理的比例   按业务阶段定义  \n\n    24.5 错误样本分析模板\n\n  question id   问题   错误类型   原因分析   优化动作   优先级  \n                         \n  Q 012   合同是否明确逾期罚款比例？   无依据编造   资料只写有逾期责任，未写比例   增加“未明确比例”拒答规则   P0  \n  Q 021   本周安全风险有哪些？   回答不完整   只召回周报，未召回问题清单   增加跨文档检索   P1  \n  Q 034   项目延期责任是谁？   高风险判断   模型扩大解释   改为只输出原文和风险提示   P0  \n\n    24.6 示例：RAG 问答评测结论\n\n   text\n本轮共测试 100 个问题，其中标准事实问答 30 个、条款解释 20 个、跨文档综合 20 个、无答案问题 15 个、歧义问题 10 个、高风险问题 5 个。\n\n总体结果：\n  回答正确率：86%\n  引用准确率：91%\n  拒答正确率：93%\n  幻觉率：4%\n  Schema 通过率：99%\n  P95 响应时间：8.6 秒\n\n结论：\n当前版本已基本满足 PoC 验收要求，但暂不建议直接进入生产上线。主要原因是无答案问题拒答正确率未达到 95%，且高风险条款解释中仍存在扩大解释现象。建议完成 P0 错误样本修复后，再进行第二轮回归测试。\n   \n\n    24.7 上线结论分级\n\n  结论   含义  \n         \n  可上线   关键指标达标，风险可控  \n  可灰度上线   核心能力可用，但需限制范围和监控  \n  仅可内部试用   适合业务专家试用，不面向普通用户  \n  继续 PoC   方向可行，但质量未达 MVP  \n  暂停推进   数据、风险、成本或业务价值不满足  \n\n    24.8 评测报告交付物清单\n\n   text\n1. 测试集 Excel / CSV\n2. 标准答案与来源文件\n3. 模型回答记录\n4. 召回片段记录\n5. 指标统计表\n6. 错误样本库\n7. 优化建议清单\n8. 上线风险说明\n9. 回归测试计划\n   \n\n   \n\n   ", "is_new": true}, {"num": 25, "title": "30 天实操转型训练计划", "html": "<h2>25. 30 天实操转型训练计划</h2>\n<blockquote>\n<p>本章是 v1.1 新增内容。它把前面 0-26 章转化为一个可执行训练闭环，目标是在 30 天内产出一套可以用于面试、作品集或内部汇报的 AI 产品项目材料。</p>\n</blockquote>\n<h3>25.1 训练目标</h3>\n<p>30 天结束时，至少产出：</p>\n<ol>\n<li>一个可演示的 RAG / Workflow Demo。</li>\n<li>一份 AI 产品 PRD。</li>\n<li>一份知识库数据清洗规范。</li>\n<li>一份测试集与标准答案。</li>\n<li>一份评测报告。</li>\n<li>一份异常兜底矩阵。</li>\n<li>一份成本与 ROI 粗测算。</li>\n<li>一份项目复盘和面试讲法。</li>\n</ol>\n<h3>25.2 推荐项目方向</h3>\n<p>优先选择你熟悉的业务场景，不建议一开始做泛用聊天机器人。</p>\n<table>\n<thead>\n<tr>\n  <th>项目方向</th>\n  <th>推荐理由</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>工程项目知识库问答</td>\n  <td>适合练 RAG、引用来源、条款解释</td>\n</tr>\n<tr>\n  <td>AI 自动生成项目周报</td>\n  <td>适合练 Workflow、结构化输出、人工审核</td>\n</tr>\n<tr>\n  <td>工程巡检问题归纳助手</td>\n  <td>适合练图文资料整理、风险分类、工单流程</td>\n</tr>\n<tr>\n  <td>合同条款问答与风险提示</td>\n  <td>适合练高风险拒答、依据引用、不得扩大解释</td>\n</tr>\n<tr>\n  <td>FM 运维工单助手</td>\n  <td>适合练业务流程、派单、状态流转、Agent 工具调用</td>\n</tr>\n</tbody>\n</table>\n<h3>25.3 30 天计划总览</h3>\n<table>\n<thead>\n<tr>\n  <th>阶段</th>\n  <th style=\"text-align:right\">时间</th>\n  <th>目标</th>\n  <th>产出</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第 1 阶段</td>\n  <td style=\"text-align:right\">Day 1-5</td>\n  <td>选场景、定问题、盘点资料</td>\n  <td>场景说明、用户故事、资料清单</td>\n</tr>\n<tr>\n  <td>第 2 阶段</td>\n  <td style=\"text-align:right\">Day 6-10</td>\n  <td>清洗资料、设计知识库</td>\n  <td>清洗规范、元数据表、Chunk 策略</td>\n</tr>\n<tr>\n  <td>第 3 阶段</td>\n  <td style=\"text-align:right\">Day 11-15</td>\n  <td>搭建 Demo、设计 Prompt / Schema</td>\n  <td>Demo、Prompt、输出 Schema</td>\n</tr>\n<tr>\n  <td>第 4 阶段</td>\n  <td style=\"text-align:right\">Day 16-20</td>\n  <td>建测试集、跑评测</td>\n  <td>测试集、标准答案、首轮结果</td>\n</tr>\n<tr>\n  <td>第 5 阶段</td>\n  <td style=\"text-align:right\">Day 21-25</td>\n  <td>优化错误、补兜底</td>\n  <td>错误样本库、Fallback 矩阵</td>\n</tr>\n<tr>\n  <td>第 6 阶段</td>\n  <td style=\"text-align:right\">Day 26-30</td>\n  <td>包装成果、准备表达</td>\n  <td>PRD、评测报告、作品集页、面试讲法</td>\n</tr>\n</tbody>\n</table>\n<h3>25.4 Day 1-5：场景与问题定义</h3>\n<p>任务：</p>\n<ul>\n<li>选择一个业务场景。</li>\n<li>明确目标用户。</li>\n<li>明确用户要完成的任务。</li>\n<li>明确 AI 负责什么、人负责什么。</li>\n<li>明确不做什么。</li>\n</ul>\n<p>产出模板：</p>\n<pre><code class=\"language-text\">项目名称：工程项目知识库问答助手\n目标用户：项目经理、工程管理人员、资料管理员\n核心问题：项目资料分散，查询合同、周报、质量安全问题效率低\nAI 能力：基于资料回答问题、引用来源、提示未覆盖信息\n人工职责：确认高风险结论、维护资料、审核错误样本\n不做范围：不替代法律意见，不自动做合同责任裁定\n</code></pre>\n<h3>25.5 Day 6-10：知识库建设</h3>\n<p>任务：</p>\n<ul>\n<li>准备 5-10 份真实或模拟资料。</li>\n<li>制作文档清洗规范。</li>\n<li>补充元数据。</li>\n<li>设计 Chunk 策略。</li>\n<li>导入 Dify / Coze / RAGFlow / 自建 RAG 工具。</li>\n</ul>\n<p>产出：</p>\n<pre><code class=\"language-text\">1. 资料清单\n2. 文档清洗规范\n3. 元数据字段表\n4. Chunk 切分规则\n5. 知识库入库记录\n</code></pre>\n<h3>25.6 Day 11-15：Prompt、Schema 与 Demo</h3>\n<p>任务：</p>\n<ul>\n<li>设计系统 Prompt。</li>\n<li>设计回答输出结构。</li>\n<li>设计引用来源规则。</li>\n<li>设计无依据拒答规则。</li>\n<li>跑通最小 Demo。</li>\n</ul>\n<p>示例输出 Schema：</p>\n<pre><code class=\"language-json\">{\n  &quot;answer&quot;: &quot;基于资料的回答&quot;,\n  &quot;sources&quot;: [\n    {\n      &quot;file_name&quot;: &quot;来源文件名&quot;,\n      &quot;section&quot;: &quot;章节或条款&quot;,\n      &quot;evidence&quot;: &quot;原文片段&quot;\n    }\n  ],\n  &quot;confidence&quot;: &quot;high / medium / low&quot;,\n  &quot;missing_information&quot;: &quot;资料未覆盖的信息&quot;,\n  &quot;risk_note&quot;: &quot;需要人工确认的风险&quot;\n}\n</code></pre>\n<h3>25.7 Day 16-20：测试集与评测</h3>\n<p>任务：</p>\n<ul>\n<li>建立 50 条测试问题。</li>\n<li>为每个问题写标准答案。</li>\n<li>标注必须引用来源。</li>\n<li>记录模型回答。</li>\n<li>统计正确率、引用准确率、拒答率、幻觉率。</li>\n</ul>\n<p>测试集结构：</p>\n<pre><code class=\"language-text\">question_id\nquestion_type\nuser_question\nexpected_answer\nrequired_source\nrisk_level\nmodel_answer\nscore\nerror_type\n</code></pre>\n<h3>25.8 Day 21-25：错误优化与兜底</h3>\n<p>任务：</p>\n<ul>\n<li>将错误样本分类。</li>\n<li>判断错误来自资料、检索、Prompt、模型还是流程。</li>\n<li>优化 Prompt / Chunk / 检索参数。</li>\n<li>设计 Fallback 矩阵。</li>\n<li>做第二轮回归测试。</li>\n</ul>\n<p>至少补齐以下异常：</p>\n<pre><code class=\"language-text\">1. 无召回结果\n2. 低相关召回\n3. 输出格式错误\n4. 模型超时\n5. Token 超限\n6. 高风险问题\n7. 权限不足\n8. 工具调用失败\n</code></pre>\n<h3>25.9 Day 26-30：成果包装</h3>\n<p>最终材料建议：</p>\n<table>\n<thead>\n<tr>\n  <th>材料</th>\n  <th>用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>AI 产品 PRD</td>\n  <td>展示产品设计能力</td>\n</tr>\n<tr>\n  <td>Demo 视频 / 截图</td>\n  <td>展示能跑通</td>\n</tr>\n<tr>\n  <td>知识库建设说明</td>\n  <td>展示数据工程意识</td>\n</tr>\n<tr>\n  <td>测试集与评测报告</td>\n  <td>展示验收能力</td>\n</tr>\n<tr>\n  <td>异常兜底矩阵</td>\n  <td>展示生产级思维</td>\n</tr>\n<tr>\n  <td>成本 ROI 测算</td>\n  <td>展示商业判断</td>\n</tr>\n<tr>\n  <td>项目复盘</td>\n  <td>展示问题解决能力</td>\n</tr>\n<tr>\n  <td>面试讲法</td>\n  <td>展示表达能力</td>\n</tr>\n</tbody>\n</table>\n<h3>25.10 面试表达模板</h3>\n<pre><code class=\"language-text\">我做的不是一个简单聊天机器人，而是一个面向工程项目资料查询的 RAG 问答助手。\n\n项目里我重点解决了四个问题：\n第一，资料怎么入库，包括文档清洗、元数据、Chunk 切分和权限；\n第二，模型怎么基于资料回答，包括 Prompt、引用来源、无依据拒答和结构化输出；\n第三，效果怎么验收，包括测试集、标准答案、正确率、引用准确率和错误样本库；\n第四，生产怎么兜底，包括超时、无召回、格式错误、高风险问题和人工确认。\n\n这个项目让我理解到，AI 产品经理的关键不是会写几个 Prompt，而是能把业务、数据、模型、流程、评测和治理串成一个可上线的产品闭环。\n</code></pre>\n<hr />\n<hr />\n", "plain": "   25. 30 天实操转型训练计划\n\n  本章是 v1.1 新增内容。它把前面 0 26 章转化为一个可执行训练闭环，目标是在 30 天内产出一套可以用于面试、作品集或内部汇报的 AI 产品项目材料。\n\n    25.1 训练目标\n\n30 天结束时，至少产出：\n\n1. 一个可演示的 RAG / Workflow Demo。\n2. 一份 AI 产品 PRD。\n3. 一份知识库数据清洗规范。\n4. 一份测试集与标准答案。\n5. 一份评测报告。\n6. 一份异常兜底矩阵。\n7. 一份成本与 ROI 粗测算。\n8. 一份项目复盘和面试讲法。\n\n    25.2 推荐项目方向\n\n优先选择你熟悉的业务场景，不建议一开始做泛用聊天机器人。\n\n  项目方向   推荐理由  \n         \n  工程项目知识库问答   适合练 RAG、引用来源、条款解释  \n  AI 自动生成项目周报   适合练 Workflow、结构化输出、人工审核  \n  工程巡检问题归纳助手   适合练图文资料整理、风险分类、工单流程  \n  合同条款问答与风险提示   适合练高风险拒答、依据引用、不得扩大解释  \n  FM 运维工单助手   适合练业务流程、派单、状态流转、Agent 工具调用  \n\n    25.3 30 天计划总览\n\n  阶段   时间   目标   产出  \n        :         \n  第 1 阶段   Day 1 5   选场景、定问题、盘点资料   场景说明、用户故事、资料清单  \n  第 2 阶段   Day 6 10   清洗资料、设计知识库   清洗规范、元数据表、Chunk 策略  \n  第 3 阶段   Day 11 15   搭建 Demo、设计 Prompt / Schema   Demo、Prompt、输出 Schema  \n  第 4 阶段   Day 16 20   建测试集、跑评测   测试集、标准答案、首轮结果  \n  第 5 阶段   Day 21 25   优化错误、补兜底   错误样本库、Fallback 矩阵  \n  第 6 阶段   Day 26 30   包装成果、准备表达   PRD、评测报告、作品集页、面试讲法  \n\n    25.4 Day 1 5：场景与问题定义\n\n任务：\n\n  选择一个业务场景。\n  明确目标用户。\n  明确用户要完成的任务。\n  明确 AI 负责什么、人负责什么。\n  明确不做什么。\n\n产出模板：\n\n   text\n项目名称：工程项目知识库问答助手\n目标用户：项目经理、工程管理人员、资料管理员\n核心问题：项目资料分散，查询合同、周报、质量安全问题效率低\nAI 能力：基于资料回答问题、引用来源、提示未覆盖信息\n人工职责：确认高风险结论、维护资料、审核错误样本\n不做范围：不替代法律意见，不自动做合同责任裁定\n   \n\n    25.5 Day 6 10：知识库建设\n\n任务：\n\n  准备 5 10 份真实或模拟资料。\n  制作文档清洗规范。\n  补充元数据。\n  设计 Chunk 策略。\n  导入 Dify / Coze / RAGFlow / 自建 RAG 工具。\n\n产出：\n\n   text\n1. 资料清单\n2. 文档清洗规范\n3. 元数据字段表\n4. Chunk 切分规则\n5. 知识库入库记录\n   \n\n    25.6 Day 11 15：Prompt、Schema 与 Demo\n\n任务：\n\n  设计系统 Prompt。\n  设计回答输出结构。\n  设计引用来源规则。\n  设计无依据拒答规则。\n  跑通最小 Demo。\n\n示例输出 Schema：\n\n   json\n{\n  \"answer\": \"基于资料的回答\",\n  \"sources\":  \n    {\n      \"file name\": \"来源文件名\",\n      \"section\": \"章节或条款\",\n      \"evidence\": \"原文片段\"\n    }\n   ,\n  \"confidence\": \"high / medium / low\",\n  \"missing information\": \"资料未覆盖的信息\",\n  \"risk note\": \"需要人工确认的风险\"\n}\n   \n\n    25.7 Day 16 20：测试集与评测\n\n任务：\n\n  建立 50 条测试问题。\n  为每个问题写标准答案。\n  标注必须引用来源。\n  记录模型回答。\n  统计正确率、引用准确率、拒答率、幻觉率。\n\n测试集结构：\n\n   text\nquestion id\nquestion type\nuser question\nexpected answer\nrequired source\nrisk level\nmodel answer\nscore\nerror type\n   \n\n    25.8 Day 21 25：错误优化与兜底\n\n任务：\n\n  将错误样本分类。\n  判断错误来自资料、检索、Prompt、模型还是流程。\n  优化 Prompt / Chunk / 检索参数。\n  设计 Fallback 矩阵。\n  做第二轮回归测试。\n\n至少补齐以下异常：\n\n   text\n1. 无召回结果\n2. 低相关召回\n3. 输出格式错误\n4. 模型超时\n5. Token 超限\n6. 高风险问题\n7. 权限不足\n8. 工具调用失败\n   \n\n    25.9 Day 26 30：成果包装\n\n最终材料建议：\n\n  材料   用途  \n         \n  AI 产品 PRD   展示产品设计能力  \n  Demo 视频 / 截图   展示能跑通  \n  知识库建设说明   展示数据工程意识  \n  测试集与评测报告   展示验收能力  \n  异常兜底矩阵   展示生产级思维  \n  成本 ROI 测算   展示商业判断  \n  项目复盘   展示问题解决能力  \n  面试讲法   展示表达能力  \n\n    25.10 面试表达模板\n\n   text\n我做的不是一个简单聊天机器人，而是一个面向工程项目资料查询的 RAG 问答助手。\n\n项目里我重点解决了四个问题：\n第一，资料怎么入库，包括文档清洗、元数据、Chunk 切分和权限；\n第二，模型怎么基于资料回答，包括 Prompt、引用来源、无依据拒答和结构化输出；\n第三，效果怎么验收，包括测试集、标准答案、正确率、引用准确率和错误样本库；\n第四，生产怎么兜底，包括超时、无召回、格式错误、高风险问题和人工确认。\n\n这个项目让我理解到，AI 产品经理的关键不是会写几个 Prompt，而是能把业务、数据、模型、流程、评测和治理串成一个可上线的产品闭环。\n   \n\n   \n\n   ", "is_new": true}, {"num": 26, "title": "Agent Skill：从长 Prompt 到可复用能力包", "html": "<h2>26. Agent Skill：从长 Prompt 到可复用能力包</h2>\n<blockquote>\n<p>本章是 v1.2 新增内容。它不是替代前面 Prompt、Workflow、Tool、MCP、Agent 的章节，而是补齐一个关键问题：当某类任务需要被反复执行、反复校验、跨会话复用、跨团队共享时，应该如何把它沉淀成 Agent 可调用的“能力包”。</p>\n</blockquote>\n<h3>26.1 Skill 是什么</h3>\n<p>Agent Skill 是面向 Agent 的可复用任务能力包。它通常以文件夹形式存在，核心入口是 <code>SKILL.md</code>，并可附带参考资料、脚本、模板、示例、评测用例等资源。</p>\n<p>产品视角定义：</p>\n<blockquote>\n<p>Skill 是把某类任务的操作流程、领域知识、模板、校验规则和可选脚本封装起来，让 Agent 在需要时按需加载并稳定执行的能力单元。</p>\n</blockquote>\n<p>它适合解决的问题：</p>\n<ul>\n<li>任务经常重复，但每次输入不同。</li>\n<li>任务有明确步骤和质量标准。</li>\n<li>单靠一次 Prompt 容易漏项、跑偏或格式不稳定。</li>\n<li>需要配套模板、参考资料、示例文件或脚本。</li>\n<li>希望沉淀为团队可复用的 Agent 能力。</li>\n</ul>\n<h3>26.2 Skill 不是 Prompt，也不是 Tool</h3>\n<table>\n<thead>\n<tr>\n  <th>对象</th>\n  <th>解决的问题</th>\n  <th>典型形式</th>\n  <th>产品经理判断</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Prompt</td>\n  <td>本次任务怎么问、怎么答</td>\n  <td>一段提示词</td>\n  <td>一次性、轻量任务</td>\n</tr>\n<tr>\n  <td>System Prompt</td>\n  <td>当前 Agent 的长期行为边界</td>\n  <td>系统级指令</td>\n  <td>全局语气、身份、原则</td>\n</tr>\n<tr>\n  <td>Instruction / Manifest</td>\n  <td>项目级长期上下文和规则</td>\n  <td>AGENTS.md、CLAUDE.md、GEMINI.md、Cursor Rules</td>\n  <td>项目规则、构建测试、架构约束</td>\n</tr>\n<tr>\n  <td>Skill</td>\n  <td>某类任务的可复用执行方法</td>\n  <td>SKILL.md + references + scripts + assets</td>\n  <td>稳定复用的任务流程</td>\n</tr>\n<tr>\n  <td>Tool</td>\n  <td>一个可调用动作或函数</td>\n  <td>API、MCP Tool、CLI 命令</td>\n  <td>给 Agent 外部动作能力</td>\n</tr>\n<tr>\n  <td>MCP</td>\n  <td>工具和数据接入标准</td>\n  <td>MCP Server / Client</td>\n  <td>标准化连接外部系统</td>\n</tr>\n<tr>\n  <td>Workflow</td>\n  <td>固定业务流程编排</td>\n  <td>节点、条件、人审</td>\n  <td>路径相对固定的流程</td>\n</tr>\n<tr>\n  <td>Hook</td>\n  <td>生命周期中的确定性控制点</td>\n  <td>PreToolUse、PostToolUse、Stop 等</td>\n  <td>必须强制执行的校验或拦截</td>\n</tr>\n<tr>\n  <td>Harness</td>\n  <td>Agent 运行时控制系统</td>\n  <td>状态、上下文、权限、日志、回滚</td>\n  <td>让 Agent 可控、可观测、可恢复</td>\n</tr>\n</tbody>\n</table>\n<p>一句话区分：</p>\n<blockquote>\n<p>Prompt 是“这次怎么做”；Instruction 是“在这个项目里长期遵守什么”；Skill 是“这类任务以后都按这个方法做”；Tool 是“能调用什么动作”；Hook 是“关键节点必须检查什么”；Harness 是“整个执行过程如何受控运行”。</p>\n</blockquote>\n<h3>26.3 Skill 的标准目录结构</h3>\n<p>建议产品经理理解的 Skill 目录结构：</p>\n<pre><code class=\"language-text\">bid-document-skill/\n├─ SKILL.md\n├─ references/\n│  ├─ writing-rules.md\n│  ├─ scoring-checklist.md\n│  └─ compliance-requirements.md\n├─ scripts/\n│  ├─ validate_schema.py\n│  └─ check_required_sections.py\n├─ assets/\n│  ├─ proposal-template.docx\n│  └─ response-matrix.xlsx\n└─ evals/\n   ├─ trigger_cases.jsonl\n   ├─ non_trigger_cases.jsonl\n   └─ output_cases.jsonl\n</code></pre>\n<p>不同目录的产品含义：</p>\n<table>\n<thead>\n<tr>\n  <th>目录 / 文件</th>\n  <th>作用</th>\n  <th>适合放什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><code>SKILL.md</code></td>\n  <td>Skill 入口说明</td>\n  <td>名称、描述、触发条件、执行步骤、边界、输出要求</td>\n</tr>\n<tr>\n  <td><code>references/</code></td>\n  <td>复杂背景资料</td>\n  <td>规范、模板说明、业务规则、术语表、案例</td>\n</tr>\n<tr>\n  <td><code>scripts/</code></td>\n  <td>高确定性处理逻辑</td>\n  <td>校验、转换、解析、批处理、生成固定结构</td>\n</tr>\n<tr>\n  <td><code>assets/</code></td>\n  <td>可复用素材</td>\n  <td>模板文件、表格、图示、样例文件</td>\n</tr>\n<tr>\n  <td><code>evals/</code></td>\n  <td>测试与回归</td>\n  <td>触发测试、非触发测试、输出质量测试</td>\n</tr>\n</tbody>\n</table>\n<h3>26.4 SKILL.md 应该写什么</h3>\n<p><code>SKILL.md</code> 不是越长越好。它应该让 Agent 快速知道三件事：什么时候用、怎么做、什么时候停止。</p>\n<p>建议结构：</p>\n<pre><code class=\"language-markdown\">---\nname: bid-document-preparation\ndescription: Use this skill when the user needs to analyze tender documents, identify required response materials, ask for missing information, and generate structured bid/proposal documents.\nallowed-tools: [read_file, create_docx, validate_schema]\nversion: 1.0.0\nowner: product-team\n---\n\n# Bid Document Preparation Skill\n\n## When to use\n- 用户提供招标文件并要求分析投标响应材料。\n- 用户要求生成标书、响应矩阵、偏离表或商务技术响应文件。\n\n## When not to use\n- 用户只是询问普通写作建议。\n- 用户没有提供任何招标资料，也没有要求生成标书。\n\n## Workflow\n1. 读取招标文件。\n2. 识别资格、商务、技术、报价、格式、签章、截止时间要求。\n3. 输出缺失资料清单。\n4. 收集用户补充资料。\n5. 生成响应矩阵。\n6. 按模板生成文档。\n7. 执行 Schema 与完整性校验。\n8. 输出交付物和风险提示。\n\n## Output requirements\n- 必须输出资料清单、缺失项、风险项、生成文件、校验结果。\n- 不得编造未提供的资质、业绩、授权文件。\n</code></pre>\n<p>产品经理要把 <code>SKILL.md</code> 当作“Agent 任务操作手册”，不是当作宣传文案。</p>\n<h3>26.5 Description 与触发机制</h3>\n<p>Skill 的 <code>description</code> 极其重要，因为 Agent 通常先看到 Skill 的名称和描述，再决定是否读取完整 Skill 内容。</p>\n<p>好的 description 应该具备：</p>\n<ul>\n<li>明确任务类型。</li>\n<li>明确输入条件。</li>\n<li>明确输出结果。</li>\n<li>明确领域边界。</li>\n<li>避免过宽的营销词。</li>\n</ul>\n<p>对比：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>示例</th>\n  <th>问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>过宽</td>\n  <td><code>Helps with documents.</code></td>\n  <td>几乎所有文档任务都会误触发</td>\n</tr>\n<tr>\n  <td>过窄</td>\n  <td><code>Use only for Guangzhou 2026 property firefighting bid technical proposal chapter 3.2.</code></td>\n  <td>稍微换个场景就不会触发</td>\n</tr>\n<tr>\n  <td>推荐</td>\n  <td><code>Use when analyzing tender documents, extracting bid requirements, identifying missing response materials, and generating structured proposal documents.</code></td>\n  <td>任务、输入、输出、边界都较清楚</td>\n</tr>\n</tbody>\n</table>\n<h3>26.6 Progressive Disclosure：按需加载</h3>\n<p>Progressive Disclosure 的核心思想是：不要把所有 Skill 的完整内容一次性塞进上下文，而是分阶段加载。</p>\n<pre><code class=\"language-text\">Discovery：启动时只看到 Skill 名称、description、路径\n→ Activation：任务匹配时读取完整 SKILL.md\n→ Execution：执行时按需读取 references、scripts、assets、evals\n</code></pre>\n<p>产品价值：</p>\n<ul>\n<li>减少上下文浪费。</li>\n<li>避免多 Skill 互相干扰。</li>\n<li>让 Agent 只在需要时读取复杂规则。</li>\n<li>支持团队维护大量可复用能力包。</li>\n</ul>\n<h3>26.7 references / scripts / assets 怎么设计</h3>\n<h4>references：放稳定知识，不放临时指令</h4>\n<p>适合放：</p>\n<ul>\n<li>标准作业流程。</li>\n<li>行业术语表。</li>\n<li>写作规范。</li>\n<li>评分规则。</li>\n<li>合规要求。</li>\n<li>示例与反例。</li>\n</ul>\n<p>不适合放：</p>\n<ul>\n<li>当前用户的一次性需求。</li>\n<li>未确认的临时资料。</li>\n<li>与 Skill 无关的大段背景。</li>\n</ul>\n<h4>scripts：确定性任务交给脚本</h4>\n<p>适合脚本处理：</p>\n<ul>\n<li>JSON Schema 校验。</li>\n<li>Excel / CSV 字段检查。</li>\n<li>文档目录完整性检查。</li>\n<li>重复文件检测。</li>\n<li>批量命名、格式转换、统计。</li>\n<li>固定模板填充。</li>\n</ul>\n<p>原则：</p>\n<blockquote>\n<p>模型擅长理解、归纳、生成；脚本擅长确定性校验、格式转换、批处理。能确定性执行的，不要交给模型自由发挥。</p>\n</blockquote>\n<h4>assets：沉淀模板和样例</h4>\n<p>适合放：</p>\n<ul>\n<li>Word 模板。</li>\n<li>Excel 模板。</li>\n<li>PPT 模板。</li>\n<li>图片素材。</li>\n<li>示例输入 / 示例输出。</li>\n</ul>\n<h3>26.8 allowed-tools 与权限边界</h3>\n<p>Skill 不是越强越好。每个 Skill 都应该限制可以使用的工具。</p>\n<p>示例：</p>\n<table>\n<thead>\n<tr>\n  <th>Skill 类型</th>\n  <th>允许工具</th>\n  <th>禁止工具</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文档分析 Skill</td>\n  <td>读取文件、生成文档、Schema 校验</td>\n  <td>删除文件、发送邮件、执行系统命令</td>\n</tr>\n<tr>\n  <td>代码审查 Skill</td>\n  <td>读取代码、运行测试、生成报告</td>\n  <td>自动合并、发布生产、删除分支</td>\n</tr>\n<tr>\n  <td>财务测算 Skill</td>\n  <td>读取表格、计算、生成报表</td>\n  <td>自动付款、修改正式财务系统</td>\n</tr>\n<tr>\n  <td>客服回复 Skill</td>\n  <td>检索知识库、生成草稿</td>\n  <td>自动承诺赔付、自动修改客户资料</td>\n</tr>\n</tbody>\n</table>\n<p>产品经理在 PRD 中应明确：</p>\n<pre><code class=\"language-text\">Skill 权限要求：\n1. 只读工具有哪些？\n2. 可写工具有哪些？\n3. 哪些动作必须人工确认？\n4. 哪些工具调用需要审计日志？\n5. 哪些失败必须中止，不能重试？\n</code></pre>\n<h3>26.9 Skill 设计原则</h3>\n<ol>\n<li><strong>单一职责</strong>：一个 Skill 只解决一类任务，不做万能助手。</li>\n<li><strong>触发清晰</strong>：description 能准确描述该触发和不该触发的边界。</li>\n<li><strong>流程明确</strong>：步骤能被 Agent 按顺序执行。</li>\n<li><strong>输入可校验</strong>：缺资料时先提问，不直接编造。</li>\n<li><strong>输出结构化</strong>：能被后续系统读取、校验、归档。</li>\n<li><strong>风险可控</strong>：高风险动作必须人审。</li>\n<li><strong>可评测</strong>：有触发测试、输出测试、回归测试。</li>\n<li><strong>可版本化</strong>：变更可追踪，失败可回滚。</li>\n<li><strong>可组合</strong>：能和 MCP、Workflow、Hook、Subagent 协同。</li>\n<li><strong>可移交</strong>：其他人能看懂、维护、复用。</li>\n</ol>\n<h3>26.10 Skill 评测方法</h3>\n<p>Skill 也需要评测，不然它只是换了位置的长 Prompt。</p>\n<table>\n<thead>\n<tr>\n  <th>评测类型</th>\n  <th>目的</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Trigger Eval</td>\n  <td>应该触发时是否触发</td>\n  <td>用户说“帮我分析招标文件并列缺失资料”</td>\n</tr>\n<tr>\n  <td>Non-trigger Eval</td>\n  <td>不该触发时是否误触发</td>\n  <td>用户说“帮我润色一段宣传文案”</td>\n</tr>\n<tr>\n  <td>Output Eval</td>\n  <td>输出是否满足要求</td>\n  <td>是否包含缺失项、风险项、响应矩阵</td>\n</tr>\n<tr>\n  <td>Tool Eval</td>\n  <td>工具使用是否正确</td>\n  <td>是否调用了文档解析和校验脚本</td>\n</tr>\n<tr>\n  <td>Safety Eval</td>\n  <td>是否越权或编造</td>\n  <td>是否编造资质、业绩、报价</td>\n</tr>\n<tr>\n  <td>Regression Eval</td>\n  <td>新版本是否破坏旧能力</td>\n  <td>v1.1 用例在 v1.2 是否仍通过</td>\n</tr>\n<tr>\n  <td>With / Without Skill 对比</td>\n  <td>Skill 是否真的提升效果</td>\n  <td>同一任务有无 Skill 的质量差异</td>\n</tr>\n</tbody>\n</table>\n<h3>26.11 Skill 版本治理</h3>\n<p>Skill 应该像产品能力一样治理。</p>\n<table>\n<thead>\n<tr>\n  <th>治理项</th>\n  <th>要求</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>命名规范</td>\n  <td>名称表达领域和任务，不用泛化词</td>\n</tr>\n<tr>\n  <td>版本号</td>\n  <td>建议语义化版本，例如 1.2.0</td>\n</tr>\n<tr>\n  <td>维护人</td>\n  <td>明确 owner 和评审人</td>\n</tr>\n<tr>\n  <td>适用范围</td>\n  <td>写清楚适用业务、工具、数据边界</td>\n</tr>\n<tr>\n  <td>变更记录</td>\n  <td>每次修改说明改了什么、为什么改</td>\n</tr>\n<tr>\n  <td>测试集</td>\n  <td>Trigger / Non-trigger / Output / Regression</td>\n</tr>\n<tr>\n  <td>权限</td>\n  <td>allowed-tools、禁止动作、人审节点</td>\n</tr>\n<tr>\n  <td>发布</td>\n  <td>先灰度，再全量</td>\n</tr>\n<tr>\n  <td>回滚</td>\n  <td>新版误触发或输出下降时能回退</td>\n</tr>\n<tr>\n  <td>外部 Skill 审查</td>\n  <td>第三方 Skill 视为不可信代码和不可信指令</td>\n</tr>\n</tbody>\n</table>\n<h3>26.12 Skill 安全风险</h3>\n<p>Skill 的风险主要来自四类：</p>\n<ol>\n<li><strong>误触发风险</strong>：不该启用 Skill 时启用，导致输出跑偏。</li>\n<li><strong>越权风险</strong>：Skill 调用了超出任务所需的工具。</li>\n<li><strong>供应链风险</strong>：第三方 Skill 中夹带恶意指令、脚本或隐性触发词。</li>\n<li><strong>维护风险</strong>：Skill 过期、规则冲突、没人维护，导致 Agent 行为不可控。</li>\n</ol>\n<p>安全原则：</p>\n<pre><code class=\"language-text\">外部 Skill 先审查再启用。\n高风险 Skill 默认禁用写操作。\nSkill 触发和工具调用必须留痕。\nSkill 更新必须跑回归测试。\n任何涉及资金、权限、生产系统、合同承诺的动作必须人工确认。\n</code></pre>\n<h3>26.13 AI 产品经理如何设计一个 Skill 包</h3>\n<p>建议流程：</p>\n<pre><code class=\"language-text\">选择重复任务\n→ 定义触发条件\n→ 定义不触发边界\n→ 拆解执行步骤\n→ 准备参考资料和模板\n→ 判断哪些步骤用脚本\n→ 限定 allowed-tools\n→ 设计输出 Schema\n→ 编写 Trigger / Non-trigger / Output 测试\n→ 灰度试用\n→ 收集错误样本\n→ 版本迭代\n</code></pre>\n<p>一个合格的 Skill 交付包至少包括：</p>\n<ul>\n<li><code>SKILL.md</code></li>\n<li>触发与不触发样例</li>\n<li>输入 / 输出样例</li>\n<li>权限清单</li>\n<li>风险边界</li>\n<li>测试用例</li>\n<li>变更记录</li>\n<li>使用说明</li>\n</ul>\n<hr />\n<hr />\n", "plain": "   26. Agent Skill：从长 Prompt 到可复用能力包\n\n  本章是 v1.2 新增内容。它不是替代前面 Prompt、Workflow、Tool、MCP、Agent 的章节，而是补齐一个关键问题：当某类任务需要被反复执行、反复校验、跨会话复用、跨团队共享时，应该如何把它沉淀成 Agent 可调用的“能力包”。\n\n    26.1 Skill 是什么\n\nAgent Skill 是面向 Agent 的可复用任务能力包。它通常以文件夹形式存在，核心入口是  SKILL.md ，并可附带参考资料、脚本、模板、示例、评测用例等资源。\n\n产品视角定义：\n\n  Skill 是把某类任务的操作流程、领域知识、模板、校验规则和可选脚本封装起来，让 Agent 在需要时按需加载并稳定执行的能力单元。\n\n它适合解决的问题：\n\n  任务经常重复，但每次输入不同。\n  任务有明确步骤和质量标准。\n  单靠一次 Prompt 容易漏项、跑偏或格式不稳定。\n  需要配套模板、参考资料、示例文件或脚本。\n  希望沉淀为团队可复用的 Agent 能力。\n\n    26.2 Skill 不是 Prompt，也不是 Tool\n\n  对象   解决的问题   典型形式   产品经理判断  \n                 \n  Prompt   本次任务怎么问、怎么答   一段提示词   一次性、轻量任务  \n  System Prompt   当前 Agent 的长期行为边界   系统级指令   全局语气、身份、原则  \n  Instruction / Manifest   项目级长期上下文和规则   AGENTS.md、CLAUDE.md、GEMINI.md、Cursor Rules   项目规则、构建测试、架构约束  \n  Skill   某类任务的可复用执行方法   SKILL.md + references + scripts + assets   稳定复用的任务流程  \n  Tool   一个可调用动作或函数   API、MCP Tool、CLI 命令   给 Agent 外部动作能力  \n  MCP   工具和数据接入标准   MCP Server / Client   标准化连接外部系统  \n  Workflow   固定业务流程编排   节点、条件、人审   路径相对固定的流程  \n  Hook   生命周期中的确定性控制点   PreToolUse、PostToolUse、Stop 等   必须强制执行的校验或拦截  \n  Harness   Agent 运行时控制系统   状态、上下文、权限、日志、回滚   让 Agent 可控、可观测、可恢复  \n\n一句话区分：\n\n  Prompt 是“这次怎么做”；Instruction 是“在这个项目里长期遵守什么”；Skill 是“这类任务以后都按这个方法做”；Tool 是“能调用什么动作”；Hook 是“关键节点必须检查什么”；Harness 是“整个执行过程如何受控运行”。\n\n    26.3 Skill 的标准目录结构\n\n建议产品经理理解的 Skill 目录结构：\n\n   text\nbid document skill/\n├─ SKILL.md\n├─ references/\n│  ├─ writing rules.md\n│  ├─ scoring checklist.md\n│  └─ compliance requirements.md\n├─ scripts/\n│  ├─ validate schema.py\n│  └─ check required sections.py\n├─ assets/\n│  ├─ proposal template.docx\n│  └─ response matrix.xlsx\n└─ evals/\n   ├─ trigger cases.jsonl\n   ├─ non trigger cases.jsonl\n   └─ output cases.jsonl\n   \n\n不同目录的产品含义：\n\n  目录 / 文件   作用   适合放什么  \n             \n   SKILL.md    Skill 入口说明   名称、描述、触发条件、执行步骤、边界、输出要求  \n   references/    复杂背景资料   规范、模板说明、业务规则、术语表、案例  \n   scripts/    高确定性处理逻辑   校验、转换、解析、批处理、生成固定结构  \n   assets/    可复用素材   模板文件、表格、图示、样例文件  \n   evals/    测试与回归   触发测试、非触发测试、输出质量测试  \n\n    26.4 SKILL.md 应该写什么\n\n SKILL.md  不是越长越好。它应该让 Agent 快速知道三件事：什么时候用、怎么做、什么时候停止。\n\n建议结构：\n\n   markdown\n   \nname: bid document preparation\ndescription: Use this skill when the user needs to analyze tender documents, identify required response materials, ask for missing information, and generate structured bid/proposal documents.\nallowed
