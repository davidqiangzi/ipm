const DATA = {"introHtml": "<h1>AI 产品经理专业知识系统 v1.4（前沿架构版）</h1>\n<blockquote>\n<p>版本说明：本版是在 v1.2（Agent 工程化与 Skill 机制增强版）基础上的<strong>结构整理迭代</strong>，不是推翻重写。<br />\n本次仅做章节顺序、总结章节、知识地图和参考来源的整理：将原第 20 章“知识地图”和原第 21 章“参考校准来源”移动到全书最后；将原 v1.1 / v1.2 使用建议合并为统一的“如何使用这套知识系统”；其余主体内容保持增量继承。</p>\n</blockquote>\n<blockquote>\n<p>版本脉络：v1.0 建立 AI 产品经理知识框架；v1.1 补强生产级落地颗粒度；v1.2 补强 Agent 工程化与 Skill 机制；v1.2.1 解决目录顺序和最终总图位置问题，使知识系统更适合长期阅读、复习和课件化使用。</p>\n</blockquote>\n<blockquote>\n<p>适用对象：希望从传统产品经理、BIM / 工程数字化 / 企业信息化方向，转向“业务场景 → AI 方案 → 产品落地”的 AI 产品经理。<br />\n定位：不是算法工程师培养路线，而是面向企业 AI 应用落地的产品知识系统。<br />\n核心目标：能判断 AI 能做什么、不能做什么；能设计 RAG / Workflow / Agent 产品；能写清楚 PRD、Prompt、Schema、验收标准；能推动 PoC、MVP、生产上线和商业化包装。</p>\n</blockquote>\n<hr />\n\n<blockquote>\n<p><strong>v1.3 进阶更新</strong>：补充 GraphRAG、Agentic RAG、Multi-Agent 协同、MCP 协议网关及 LLM-as-a-Judge 自动化评测规范。</p>\n</blockquote>\n\n<blockquote>\n<p><strong>v1.4 前沿更新</strong>：补充 Generative UI 生成式界面、Realtime Multi-modal 实时多模态交互、TTS 音频内容产品化、Data Flywheel (RLHF/DPO) 数据回流闭环，以及 OWASP Guardrails 安全护栏机制。</p>\n</blockquote>\n", "sections": [{"num": 0, "title": "总览：AI 产品经理到底要掌握什么", "html": "<h2>0. 总览：AI 产品经理到底要掌握什么</h2>\n<h3>0.1 一句话定义</h3>\n<p>AI 产品经理不是“会用 AI 工具的人”，而是把业务问题拆解成可被模型、知识库、工具、流程和人机协同共同解决的产品方案负责人。</p>\n<h3>0.2 核心能力公式</h3>\n<pre><code class=\"language-text\">AI 产品落地能力\n= 业务理解 × AI 能力边界判断 × 数据/知识工程 × 流程设计 × 交互设计 × 评测验收 × 成本收益 × 风险治理\n</code></pre>\n<h3>0.3 AI 产品经理的 8 类核心能力</h3>\n<ol>\n<li><strong>业务场景拆解能力</strong>：把“我要智能化”拆成具体任务、角色、输入、输出、流程和指标。</li>\n<li><strong>AI 能力边界判断能力</strong>：判断这个问题适合 LLM、RAG、Workflow、Agent、传统规则，还是不适合 AI。</li>\n<li><strong>知识与数据产品设计能力</strong>：设计文档入库、知识结构、元数据、权限、检索、引用来源、知识更新机制。</li>\n<li><strong>Prompt 与结构化输出设计能力</strong>：定义任务、边界、约束、输出字段、Schema、失败处理、重试机制。</li>\n<li><strong>Workflow / Agent 编排能力</strong>：把模型能力嵌入业务流程，而不是只做一个聊天框。</li>\n<li><strong>AI 交互设计能力</strong>：设计对话、表单、审阅、确认、编辑、追问、引用、证据链、人机协同体验。</li>\n<li><strong>评测与验收能力</strong>：建立测试集、质量指标、人工评审标准、自动化评估、线上监控和回归测试。</li>\n<li><strong>商业化与交付能力</strong>：明确 ROI、成本结构、收费模式、上线阶段、组织落地、培训和运维机制。</li>\n</ol>\n<h3>0.4 AI 产品落地的总链路</h3>\n<pre><code class=\"language-text\">业务问题\n→ 场景拆解\n→ 判断 AI 适配方式\n→ 数据/知识准备\n→ Prompt / Workflow / Agent 设计\n→ 原型验证\n→ 评测验收\n→ MVP 上线\n→ 生产化治理\n→ 规模化复制\n</code></pre>\n<h3>0.5 AI 产品能力分层</h3>\n<table>\n<thead>\n<tr>\n  <th>层级</th>\n  <th>关键词</th>\n  <th>产品经理要懂什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>L1 工具使用</td>\n  <td>ChatGPT、Claude、Gemini、DeepSeek、通义、豆包等</td>\n  <td>会用，但不能只停留在使用</td>\n</tr>\n<tr>\n  <td>L2 Prompt 工程</td>\n  <td>任务描述、上下文、约束、示例、输出格式</td>\n  <td>能稳定控制模型输出</td>\n</tr>\n<tr>\n  <td>L3 RAG 知识增强</td>\n  <td>文档入库、切分、Embedding、检索、Rerank、引用</td>\n  <td>让模型基于企业资料回答</td>\n</tr>\n<tr>\n  <td>L4 Workflow 编排</td>\n  <td>节点、条件、人工审核、循环、异常处理</td>\n  <td>把 AI 嵌入业务流程</td>\n</tr>\n<tr>\n  <td>L5 Agent 工程</td>\n  <td>工具调用、规划、记忆、运行时、权限、验证</td>\n  <td>让 AI 执行多步骤任务</td>\n</tr>\n<tr>\n  <td>L6 企业级落地</td>\n  <td>权限、安全、监控、成本、SLA、ROI、治理</td>\n  <td>让 AI 真正可上线、可运营、可复制</td>\n</tr>\n</tbody>\n</table>\n<h3>0.6 v1.2 新增认知链路：从 AI 功能到 Agent 能力体系</h3>\n<p>v1.1 解决的是：<strong>如何把 AI 功能做成可上线的产品</strong>。<br />\nv1.2 进一步解决的是：<strong>如何把 Agent 做成可复用、可控、可评测的能力体系</strong>。</p>\n<pre><code class=\"language-text\">AI 功能落地\n→ RAG / Workflow / Agent 选型\n→ Tool / MCP 接入外部系统\n→ Harness 控制运行过程\n→ Skill 封装可复用任务能力\n→ Instruction / Manifest 提供项目级长期规则\n→ Hook 提供确定性校验与拦截\n→ Subagent 提供复杂任务的上下文隔离与分工\n→ Eval / Governance 保障效果、权限、版本与安全\n</code></pre>\n<p>v1.2 新增内容的产品判断原则：</p>\n<table>\n<thead>\n<tr>\n  <th>概念</th>\n  <th>解决的问题</th>\n  <th>产品经理一句话理解</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Agent Hardness</td>\n  <td>场景到底需不需要 Agent，需要多复杂</td>\n  <td>不要把简单任务硬做成复杂 Agent</td>\n</tr>\n<tr>\n  <td>Agent Harness</td>\n  <td>Agent 如何被控制、观察、验证、回滚</td>\n  <td>模型外面的运行时控制层</td>\n</tr>\n<tr>\n  <td>Agent Skill</td>\n  <td>某类任务如何沉淀成可复用能力</td>\n  <td>不是长 Prompt，而是任务能力包</td>\n</tr>\n<tr>\n  <td>Agent Instruction / Manifest</td>\n  <td>Agent 如何理解项目长期规则</td>\n  <td>给 Agent 看的项目 README / 规则文件</td>\n</tr>\n<tr>\n  <td>Hook</td>\n  <td>哪些动作必须确定性校验或拦截</td>\n  <td>能用脚本强制的，不靠模型自觉</td>\n</tr>\n<tr>\n  <td>Subagent</td>\n  <td>复杂任务如何拆分并隔离上下文</td>\n  <td>专门任务交给专门子代理</td>\n</tr>\n<tr>\n  <td>Skill Eval / Governance</td>\n  <td>Skill 是否有效、安全、可维护</td>\n  <td>Skill 也要测试、版本、权限和审查</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   0. 总览：AI 产品经理到底要掌握什么\n\n    0.1 一句话定义\n\nAI 产品经理不是“会用 AI 工具的人”，而是把业务问题拆解成可被模型、知识库、工具、流程和人机协同共同解决的产品方案负责人。\n\n    0.2 核心能力公式\n\n   text\nAI 产品落地能力\n= 业务理解 × AI 能力边界判断 × 数据/知识工程 × 流程设计 × 交互设计 × 评测验收 × 成本收益 × 风险治理\n   \n\n    0.3 AI 产品经理的 8 类核心能力\n\n1.   业务场景拆解能力  ：把“我要智能化”拆成具体任务、角色、输入、输出、流程和指标。\n2.   AI 能力边界判断能力  ：判断这个问题适合 LLM、RAG、Workflow、Agent、传统规则，还是不适合 AI。\n3.   知识与数据产品设计能力  ：设计文档入库、知识结构、元数据、权限、检索、引用来源、知识更新机制。\n4.   Prompt 与结构化输出设计能力  ：定义任务、边界、约束、输出字段、Schema、失败处理、重试机制。\n5.   Workflow / Agent 编排能力  ：把模型能力嵌入业务流程，而不是只做一个聊天框。\n6.   AI 交互设计能力  ：设计对话、表单、审阅、确认、编辑、追问、引用、证据链、人机协同体验。\n7.   评测与验收能力  ：建立测试集、质量指标、人工评审标准、自动化评估、线上监控和回归测试。\n8.   商业化与交付能力  ：明确 ROI、成本结构、收费模式、上线阶段、组织落地、培训和运维机制。\n\n    0.4 AI 产品落地的总链路\n\n   text\n业务问题\n→ 场景拆解\n→ 判断 AI 适配方式\n→ 数据/知识准备\n→ Prompt / Workflow / Agent 设计\n→ 原型验证\n→ 评测验收\n→ MVP 上线\n→ 生产化治理\n→ 规模化复制\n   \n\n    0.5 AI 产品能力分层\n\n  层级   关键词   产品经理要懂什么  \n             \n  L1 工具使用   ChatGPT、Claude、Gemini、DeepSeek、通义、豆包等   会用，但不能只停留在使用  \n  L2 Prompt 工程   任务描述、上下文、约束、示例、输出格式   能稳定控制模型输出  \n  L3 RAG 知识增强   文档入库、切分、Embedding、检索、Rerank、引用   让模型基于企业资料回答  \n  L4 Workflow 编排   节点、条件、人工审核、循环、异常处理   把 AI 嵌入业务流程  \n  L5 Agent 工程   工具调用、规划、记忆、运行时、权限、验证   让 AI 执行多步骤任务  \n  L6 企业级落地   权限、安全、监控、成本、SLA、ROI、治理   让 AI 真正可上线、可运营、可复制  \n\n\n    0.6 v1.2 新增认知链路：从 AI 功能到 Agent 能力体系\n\nv1.1 解决的是：  如何把 AI 功能做成可上线的产品  。  \nv1.2 进一步解决的是：  如何把 Agent 做成可复用、可控、可评测的能力体系  。\n\n   text\nAI 功能落地\n→ RAG / Workflow / Agent 选型\n→ Tool / MCP 接入外部系统\n→ Harness 控制运行过程\n→ Skill 封装可复用任务能力\n→ Instruction / Manifest 提供项目级长期规则\n→ Hook 提供确定性校验与拦截\n→ Subagent 提供复杂任务的上下文隔离与分工\n→ Eval / Governance 保障效果、权限、版本与安全\n   \n\nv1.2 新增内容的产品判断原则：\n\n  概念   解决的问题   产品经理一句话理解  \n             \n  Agent Hardness   场景到底需不需要 Agent，需要多复杂   不要把简单任务硬做成复杂 Agent  \n  Agent Harness   Agent 如何被控制、观察、验证、回滚   模型外面的运行时控制层  \n  Agent Skill   某类任务如何沉淀成可复用能力   不是长 Prompt，而是任务能力包  \n  Agent Instruction / Manifest   Agent 如何理解项目长期规则   给 Agent 看的项目 README / 规则文件  \n  Hook   哪些动作必须确定性校验或拦截   能用脚本强制的，不靠模型自觉  \n  Subagent   复杂任务如何拆分并隔离上下文   专门任务交给专门子代理  \n  Skill Eval / Governance   Skill 是否有效、安全、可维护   Skill 也要测试、版本、权限和审查  \n\n\n   \n\n   ", "is_new": false}, {"num": 1, "title": "AI 产品经理岗位认知", "html": "<h2>1. AI 产品经理岗位认知</h2>\n<h3>1.1 AI 产品经理与传统产品经理的差异</h3>\n<table>\n<thead>\n<tr>\n  <th>对比项</th>\n  <th>传统产品经理</th>\n  <th>AI 产品经理</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>主要对象</td>\n  <td>人、流程、系统功能</td>\n  <td>人、流程、系统功能、模型能力、数据、知识、工具</td>\n</tr>\n<tr>\n  <td>输出稳定性</td>\n  <td>功能逻辑相对确定</td>\n  <td>模型输出有概率性，需要评测和兜底</td>\n</tr>\n<tr>\n  <td>需求分析重点</td>\n  <td>用户故事、业务流程、字段、页面</td>\n  <td>任务边界、知识来源、Prompt、Schema、质量标准</td>\n</tr>\n<tr>\n  <td>验收方式</td>\n  <td>功能是否实现</td>\n  <td>功能是否实现 + 输出是否正确、稳定、可追溯</td>\n</tr>\n<tr>\n  <td>风险点</td>\n  <td>需求变更、开发延期、体验差</td>\n  <td>幻觉、误答、越权、泄密、成本失控、不可解释</td>\n</tr>\n</tbody>\n</table>\n<h3>1.2 AI 产品经理不等于算法工程师</h3>\n<p>AI 产品经理不需要深入训练大模型、调参或写底层算法，但必须理解以下问题：</p>\n<ul>\n<li>模型为什么会胡说？</li>\n<li>为什么给了资料还会答错？</li>\n<li>为什么同一个问题每次答案不一样？</li>\n<li>为什么 RAG 检索到了正确资料，模型还是解释错？</li>\n<li>为什么 Agent 跑着跑着就偏离目标？</li>\n<li>为什么 Demo 能跑，生产系统不能上线？</li>\n<li>为什么一个看似简单的 AI 功能上线后成本很高？</li>\n</ul>\n<h3>1.3 AI 产品经理常见岗位类型</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>典型工作</th>\n  <th>关键能力</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>AI 应用产品经理</td>\n  <td>做企业 AI 助手、知识库、智能客服、文档生成</td>\n  <td>场景拆解、RAG、Prompt、评测</td>\n</tr>\n<tr>\n  <td>Agent 产品经理</td>\n  <td>做可执行任务的 AI 助手、代码 Agent、办公 Agent</td>\n  <td>工具调用、权限、流程、验证</td>\n</tr>\n<tr>\n  <td>AI 平台产品经理</td>\n  <td>做模型网关、Prompt 管理、知识库平台、评测平台</td>\n  <td>平台架构、成本、权限、治理</td>\n</tr>\n<tr>\n  <td>行业 AI 产品经理</td>\n  <td>做工程、地产、金融、法务、医疗等行业 AI</td>\n  <td>行业知识、业务流程、合规、知识工程</td>\n</tr>\n<tr>\n  <td>AI 商业化产品经理</td>\n  <td>做解决方案、售前方案、商业闭环</td>\n  <td>ROI、客户价值、交付路径、定价</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   1. AI 产品经理岗位认知\n\n    1.1 AI 产品经理与传统产品经理的差异\n\n  对比项   传统产品经理   AI 产品经理  \n             \n  主要对象   人、流程、系统功能   人、流程、系统功能、模型能力、数据、知识、工具  \n  输出稳定性   功能逻辑相对确定   模型输出有概率性，需要评测和兜底  \n  需求分析重点   用户故事、业务流程、字段、页面   任务边界、知识来源、Prompt、Schema、质量标准  \n  验收方式   功能是否实现   功能是否实现 + 输出是否正确、稳定、可追溯  \n  风险点   需求变更、开发延期、体验差   幻觉、误答、越权、泄密、成本失控、不可解释  \n\n    1.2 AI 产品经理不等于算法工程师\n\nAI 产品经理不需要深入训练大模型、调参或写底层算法，但必须理解以下问题：\n\n  模型为什么会胡说？\n  为什么给了资料还会答错？\n  为什么同一个问题每次答案不一样？\n  为什么 RAG 检索到了正确资料，模型还是解释错？\n  为什么 Agent 跑着跑着就偏离目标？\n  为什么 Demo 能跑，生产系统不能上线？\n  为什么一个看似简单的 AI 功能上线后成本很高？\n\n    1.3 AI 产品经理常见岗位类型\n\n  类型   典型工作   关键能力  \n             \n  AI 应用产品经理   做企业 AI 助手、知识库、智能客服、文档生成   场景拆解、RAG、Prompt、评测  \n  Agent 产品经理   做可执行任务的 AI 助手、代码 Agent、办公 Agent   工具调用、权限、流程、验证  \n  AI 平台产品经理   做模型网关、Prompt 管理、知识库平台、评测平台   平台架构、成本、权限、治理  \n  行业 AI 产品经理   做工程、地产、金融、法务、医疗等行业 AI   行业知识、业务流程、合规、知识工程  \n  AI 商业化产品经理   做解决方案、售前方案、商业闭环   ROI、客户价值、交付路径、定价  \n\n   \n\n   ", "is_new": false}, {"num": 2, "title": "大模型基础：LLM 是什么，能力边界在哪里", "html": "<h2>2. 大模型基础：LLM 是什么，能力边界在哪里</h2>\n<h3>2.1 LLM 的本质</h3>\n<p>LLM，大语言模型，本质上是基于大量文本和多模态数据训练出来的概率生成模型。它擅长根据上下文预测、生成、改写、总结、分类、抽取和推理文本。</p>\n<p>产品视角下，不要把 LLM 理解成“数据库”或“规则引擎”，而应理解成：</p>\n<pre><code class=\"language-text\">一个擅长语言理解、模式补全、归纳推理和内容生成的通用认知接口\n</code></pre>\n<h3>2.2 LLM 与传统系统的差异</h3>\n<table>\n<thead>\n<tr>\n  <th>维度</th>\n  <th>传统系统</th>\n  <th>LLM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>工作方式</td>\n  <td>规则、流程、SQL、代码逻辑</td>\n  <td>基于上下文生成答案</td>\n</tr>\n<tr>\n  <td>输入形式</td>\n  <td>表单、字段、按钮</td>\n  <td>自然语言、多模态、结构化数据</td>\n</tr>\n<tr>\n  <td>输出形式</td>\n  <td>确定结果</td>\n  <td>概率性生成结果</td>\n</tr>\n<tr>\n  <td>优势</td>\n  <td>稳定、可控、可审计</td>\n  <td>灵活、泛化、自然语言交互强</td>\n</tr>\n<tr>\n  <td>弱点</td>\n  <td>不灵活、开发慢</td>\n  <td>可能幻觉、不稳定、难完全解释</td>\n</tr>\n</tbody>\n</table>\n<h3>2.3 LLM 适合做什么</h3>\n<p>适合：</p>\n<ul>\n<li>文本理解：分类、摘要、提取要点、意图识别。</li>\n<li>文本生成：报告、方案、邮件、合同初稿、会议纪要。</li>\n<li>知识问答：基于资料回答问题。</li>\n<li>结构化抽取：从非结构化文本中抽取字段。</li>\n<li>推理辅助：帮人分析方案、列风险、做对比。</li>\n<li>代码辅助：生成、解释、重构、测试代码。</li>\n<li>多模态理解：图片识别、图表解释、截图理解、文档视觉理解。</li>\n</ul>\n<p>不适合直接裸用：</p>\n<ul>\n<li>强合规、强责任的最终决策。</li>\n<li>没有数据来源的精确事实查询。</li>\n<li>高风险控制动作，例如直接转账、删除数据、控制设备。</li>\n<li>需要 100% 稳定且可验证的计算逻辑。</li>\n<li>企业内部数据未接入时的内部知识问答。</li>\n</ul>\n<h3>2.4 Token 是什么</h3>\n<p>Token 是模型处理文本的基本计量单位，可以粗略理解为“文字片段”。</p>\n<p>产品经理需要关注 Token 的四个问题：</p>\n<ol>\n<li><strong>上下文窗口</strong>：一次请求能放多少输入和历史。</li>\n<li><strong>成本</strong>：输入 Token、输出 Token 通常分别计费。</li>\n<li><strong>速度</strong>：Token 越多，响应越慢。</li>\n<li><strong>质量</strong>：上下文越长不一定越好，噪声太多会降低质量。</li>\n</ol>\n<h3>2.5 上下文窗口</h3>\n<p>上下文窗口是模型一次推理能看到的信息范围，包括：</p>\n<ul>\n<li>系统提示词。</li>\n<li>用户问题。</li>\n<li>历史对话。</li>\n<li>RAG 检索结果。</li>\n<li>工具返回结果。</li>\n<li>临时补充资料。</li>\n<li>输出约束。</li>\n</ul>\n<p>常见误区：上下文窗口越大越好。<br />\n实际情况：窗口大只是“能塞更多”，不代表模型一定能抓住重点。因此 AI 产品要做上下文选择、压缩和排序。</p>\n<h3>2.6 模型幻觉</h3>\n<p>幻觉是指模型生成看似合理但实际不正确、无依据或编造的信息。</p>\n<p>常见原因：</p>\n<ul>\n<li>问题超出模型知识范围。</li>\n<li>没有接入外部资料。</li>\n<li>RAG 检索结果不相关。</li>\n<li>Prompt 没有限制“不得编造”。</li>\n<li>模型为了满足用户而过度补全。</li>\n<li>输出没有验证环节。</li>\n</ul>\n<p>产品治理方式：</p>\n<ul>\n<li>要求引用来源。</li>\n<li>限定只能基于资料回答。</li>\n<li>无依据时输出“资料未提及”。</li>\n<li>使用结构化输出和字段级依据。</li>\n<li>增加一致性检查。</li>\n<li>对关键结论做人工复核。</li>\n<li>对高风险任务设置禁止自动执行。</li>\n</ul>\n<h3>2.7 推理、检索与计算的区别</h3>\n<table>\n<thead>\n<tr>\n  <th>能力</th>\n  <th>说明</th>\n  <th>适合用什么实现</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>推理</td>\n  <td>基于上下文进行分析、归纳、判断</td>\n  <td>LLM / Reasoning Model</td>\n</tr>\n<tr>\n  <td>检索</td>\n  <td>从资料库中找相关信息</td>\n  <td>搜索引擎 / 向量检索 / RAG</td>\n</tr>\n<tr>\n  <td>计算</td>\n  <td>精确数学、统计、报表</td>\n  <td>代码 / SQL / BI / 计算工具</td>\n</tr>\n<tr>\n  <td>执行</td>\n  <td>调系统、写文件、发邮件、跑流程</td>\n  <td>Tool Use / API / Workflow / Agent</td>\n</tr>\n</tbody>\n</table>\n<p>AI 产品设计的关键是不要让 LLM 包办所有事，而是让合适的组件做合适的事。</p>\n<hr />\n<hr />\n", "plain": "   2. 大模型基础：LLM 是什么，能力边界在哪里\n\n    2.1 LLM 的本质\n\nLLM，大语言模型，本质上是基于大量文本和多模态数据训练出来的概率生成模型。它擅长根据上下文预测、生成、改写、总结、分类、抽取和推理文本。\n\n产品视角下，不要把 LLM 理解成“数据库”或“规则引擎”，而应理解成：\n\n   text\n一个擅长语言理解、模式补全、归纳推理和内容生成的通用认知接口\n   \n\n    2.2 LLM 与传统系统的差异\n\n  维度   传统系统   LLM  \n             \n  工作方式   规则、流程、SQL、代码逻辑   基于上下文生成答案  \n  输入形式   表单、字段、按钮   自然语言、多模态、结构化数据  \n  输出形式   确定结果   概率性生成结果  \n  优势   稳定、可控、可审计   灵活、泛化、自然语言交互强  \n  弱点   不灵活、开发慢   可能幻觉、不稳定、难完全解释  \n\n    2.3 LLM 适合做什么\n\n适合：\n\n  文本理解：分类、摘要、提取要点、意图识别。\n  文本生成：报告、方案、邮件、合同初稿、会议纪要。\n  知识问答：基于资料回答问题。\n  结构化抽取：从非结构化文本中抽取字段。\n  推理辅助：帮人分析方案、列风险、做对比。\n  代码辅助：生成、解释、重构、测试代码。\n  多模态理解：图片识别、图表解释、截图理解、文档视觉理解。\n\n不适合直接裸用：\n\n  强合规、强责任的最终决策。\n  没有数据来源的精确事实查询。\n  高风险控制动作，例如直接转账、删除数据、控制设备。\n  需要 100% 稳定且可验证的计算逻辑。\n  企业内部数据未接入时的内部知识问答。\n\n    2.4 Token 是什么\n\nToken 是模型处理文本的基本计量单位，可以粗略理解为“文字片段”。\n\n产品经理需要关注 Token 的四个问题：\n\n1.   上下文窗口  ：一次请求能放多少输入和历史。\n2.   成本  ：输入 Token、输出 Token 通常分别计费。\n3.   速度  ：Token 越多，响应越慢。\n4.   质量  ：上下文越长不一定越好，噪声太多会降低质量。\n\n    2.5 上下文窗口\n\n上下文窗口是模型一次推理能看到的信息范围，包括：\n\n  系统提示词。\n  用户问题。\n  历史对话。\n  RAG 检索结果。\n  工具返回结果。\n  临时补充资料。\n  输出约束。\n\n常见误区：上下文窗口越大越好。  \n实际情况：窗口大只是“能塞更多”，不代表模型一定能抓住重点。因此 AI 产品要做上下文选择、压缩和排序。\n\n    2.6 模型幻觉\n\n幻觉是指模型生成看似合理但实际不正确、无依据或编造的信息。\n\n常见原因：\n\n  问题超出模型知识范围。\n  没有接入外部资料。\n  RAG 检索结果不相关。\n  Prompt 没有限制“不得编造”。\n  模型为了满足用户而过度补全。\n  输出没有验证环节。\n\n产品治理方式：\n\n  要求引用来源。\n  限定只能基于资料回答。\n  无依据时输出“资料未提及”。\n  使用结构化输出和字段级依据。\n  增加一致性检查。\n  对关键结论做人工复核。\n  对高风险任务设置禁止自动执行。\n\n    2.7 推理、检索与计算的区别\n\n  能力   说明   适合用什么实现  \n             \n  推理   基于上下文进行分析、归纳、判断   LLM / Reasoning Model  \n  检索   从资料库中找相关信息   搜索引擎 / 向量检索 / RAG  \n  计算   精确数学、统计、报表   代码 / SQL / BI / 计算工具  \n  执行   调系统、写文件、发邮件、跑流程   Tool Use / API / Workflow / Agent  \n\nAI 产品设计的关键是不要让 LLM 包办所有事，而是让合适的组件做合适的事。\n\n   \n\n   ", "is_new": false}, {"num": 3, "title": "API Key、Token 与模型调用基础", "html": "<h2>3. API Key、Token 与模型调用基础</h2>\n<h3>3.1 API Key 是什么</h3>\n<p>API Key 是调用模型服务时的身份凭证。可以理解为“账号调用模型服务的钥匙”。</p>\n<p>它通常用于：</p>\n<ul>\n<li>识别是谁在调用模型。</li>\n<li>判断账户是否有权限。</li>\n<li>统计消耗量。</li>\n<li>扣费或限制额度。</li>\n<li>追踪调用日志。</li>\n</ul>\n<h3>3.2 API Key 的获取</h3>\n<p>不同模型厂商会有自己的平台，例如：</p>\n<ul>\n<li>OpenAI Platform。</li>\n<li>Anthropic Console。</li>\n<li>Google AI Studio / Vertex AI。</li>\n<li>DeepSeek Platform。</li>\n<li>阿里云百炼 / DashScope。</li>\n<li>火山方舟。</li>\n<li>智谱开放平台。</li>\n<li>月之暗面 Kimi 开放平台。</li>\n</ul>\n<p>通用流程：</p>\n<pre><code class=\"language-text\">注册账号\n→ 实名或组织认证（视平台要求）\n→ 进入 API Keys 页面\n→ 创建 Key\n→ 配置到环境变量或后端密钥管理系统\n→ 在服务端调用模型\n</code></pre>\n<h3>3.3 API Key 绝对不能做什么</h3>\n<ul>\n<li>不能写死在前端代码里。</li>\n<li>不能上传到 GitHub、Gitee 等代码仓库。</li>\n<li>不能截图发到群里。</li>\n<li>不能多人共用一个生产 Key。</li>\n<li>不能把生产 Key 暴露给 Agent 随意读取。</li>\n<li>不能把 Key 直接放在可下载的配置文件里。</li>\n</ul>\n<p>正确做法：</p>\n<pre><code class=\"language-text\">本地开发：环境变量 / .env.local，且加入 .gitignore\n企业生产：密钥管理服务 / 后端代理 / 权限隔离 / 调用审计\n</code></pre>\n<h3>3.4 Token 成本如何估算</h3>\n<p>AI 功能成本通常由以下部分组成：</p>\n<pre><code class=\"language-text\">总成本 = 输入 Token 成本 + 输出 Token 成本 + Embedding 成本 + 检索/存储成本 + 工具调用成本 + 运维成本\n</code></pre>\n<p>产品估算维度：</p>\n<ul>\n<li>单次请求平均输入 Token。</li>\n<li>单次请求平均输出 Token。</li>\n<li>每日 / 每月调用次数。</li>\n<li>是否需要 RAG 检索。</li>\n<li>是否需要多轮 Agent 调用。</li>\n<li>是否有图像、音频、视频等多模态输入。</li>\n<li>是否需要高性能模型还是小模型。</li>\n</ul>\n<h3>3.5 模型选型的产品视角</h3>\n<table>\n<thead>\n<tr>\n  <th>需求</th>\n  <th>选型倾向</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>复杂推理、代码、长文分析</td>\n  <td>强推理模型 / 高端模型</td>\n</tr>\n<tr>\n  <td>高频简单问答</td>\n  <td>小模型 / 便宜模型</td>\n</tr>\n<tr>\n  <td>企业知识库问答</td>\n  <td>RAG + 中高质量文本模型</td>\n</tr>\n<tr>\n  <td>结构化抽取</td>\n  <td>支持结构化输出的模型</td>\n</tr>\n<tr>\n  <td>多模态截图 / 图纸 / 表格理解</td>\n  <td>多模态模型 + 文档解析工具</td>\n</tr>\n<tr>\n  <td>私有化部署</td>\n  <td>开源模型 / 私有云模型 / 混合架构</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   3. API Key、Token 与模型调用基础\n\n    3.1 API Key 是什么\n\nAPI Key 是调用模型服务时的身份凭证。可以理解为“账号调用模型服务的钥匙”。\n\n它通常用于：\n\n  识别是谁在调用模型。\n  判断账户是否有权限。\n  统计消耗量。\n  扣费或限制额度。\n  追踪调用日志。\n\n    3.2 API Key 的获取\n\n不同模型厂商会有自己的平台，例如：\n\n  OpenAI Platform。\n  Anthropic Console。\n  Google AI Studio / Vertex AI。\n  DeepSeek Platform。\n  阿里云百炼 / DashScope。\n  火山方舟。\n  智谱开放平台。\n  月之暗面 Kimi 开放平台。\n\n通用流程：\n\n   text\n注册账号\n→ 实名或组织认证（视平台要求）\n→ 进入 API Keys 页面\n→ 创建 Key\n→ 配置到环境变量或后端密钥管理系统\n→ 在服务端调用模型\n   \n\n    3.3 API Key 绝对不能做什么\n\n  不能写死在前端代码里。\n  不能上传到 GitHub、Gitee 等代码仓库。\n  不能截图发到群里。\n  不能多人共用一个生产 Key。\n  不能把生产 Key 暴露给 Agent 随意读取。\n  不能把 Key 直接放在可下载的配置文件里。\n\n正确做法：\n\n   text\n本地开发：环境变量 / .env.local，且加入 .gitignore\n企业生产：密钥管理服务 / 后端代理 / 权限隔离 / 调用审计\n   \n\n    3.4 Token 成本如何估算\n\nAI 功能成本通常由以下部分组成：\n\n   text\n总成本 = 输入 Token 成本 + 输出 Token 成本 + Embedding 成本 + 检索/存储成本 + 工具调用成本 + 运维成本\n   \n\n产品估算维度：\n\n  单次请求平均输入 Token。\n  单次请求平均输出 Token。\n  每日 / 每月调用次数。\n  是否需要 RAG 检索。\n  是否需要多轮 Agent 调用。\n  是否有图像、音频、视频等多模态输入。\n  是否需要高性能模型还是小模型。\n\n    3.5 模型选型的产品视角\n\n  需求   选型倾向  \n         \n  复杂推理、代码、长文分析   强推理模型 / 高端模型  \n  高频简单问答   小模型 / 便宜模型  \n  企业知识库问答   RAG + 中高质量文本模型  \n  结构化抽取   支持结构化输出的模型  \n  多模态截图 / 图纸 / 表格理解   多模态模型 + 文档解析工具  \n  私有化部署   开源模型 / 私有云模型 / 混合架构  \n\n   \n\n   ", "is_new": false}, {"num": 4, "title": "Prompt 工程与结构化输出", "html": "<h2>4. Prompt 工程与结构化输出</h2>\n<h3>4.1 Prompt 的本质</h3>\n<p>Prompt 不是“咒语”，而是产品经理给模型的一份任务说明书。它应明确：</p>\n<pre><code class=\"language-text\">角色 + 目标 + 输入 + 约束 + 处理步骤 + 输出格式 + 边界条件 + 失败处理\n</code></pre>\n<h3>4.2 Prompt 基本结构</h3>\n<pre><code class=\"language-text\">你是……\n你的任务是……\n你会收到……\n请按以下规则处理……\n不得……\n如果资料不足，请……\n输出格式必须为……\n</code></pre>\n<h3>4.3 Prompt 的常见组成</h3>\n<table>\n<thead>\n<tr>\n  <th>组成</th>\n  <th>作用</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Role 角色</td>\n  <td>让模型进入专业语境</td>\n  <td>你是合同审查助手</td>\n</tr>\n<tr>\n  <td>Task 任务</td>\n  <td>明确要做什么</td>\n  <td>请判断是否存在逾期责任约定</td>\n</tr>\n<tr>\n  <td>Context 上下文</td>\n  <td>提供资料和背景</td>\n  <td>以下是合同条款原文</td>\n</tr>\n<tr>\n  <td>Constraints 约束</td>\n  <td>限制自由发挥</td>\n  <td>只能依据原文，不得扩大解释</td>\n</tr>\n<tr>\n  <td>Steps 步骤</td>\n  <td>规定处理过程</td>\n  <td>先定位条款，再逐条解释</td>\n</tr>\n<tr>\n  <td>Output 输出</td>\n  <td>控制结果格式</td>\n  <td>输出 JSON / 表格</td>\n</tr>\n<tr>\n  <td>Fallback 兜底</td>\n  <td>资料不足时处理</td>\n  <td>未提及时输出“无依据”</td>\n</tr>\n<tr>\n  <td>Validation 自检</td>\n  <td>输出前检查</td>\n  <td>检查答案是否与原文一致</td>\n</tr>\n</tbody>\n</table>\n<h3>4.4 结构化输出为什么重要</h3>\n<p>AI 产品上线时，不能只要求模型“回答得好”，还要让系统能解析、展示、存储、校验和触发后续流程。因此结构化输出是 AI 产品工程化的基础。</p>\n<p>常见格式：</p>\n<ul>\n<li>JSON。</li>\n<li>Markdown 表格。</li>\n<li>YAML。</li>\n<li>XML。</li>\n<li>固定字段文本。</li>\n</ul>\n<h3>4.5 Schema 校验是什么</h3>\n<p>Schema 校验是指系统预先定义输出数据结构，然后检查模型输出是否符合结构要求。</p>\n<p>例如系统规定输出必须是：</p>\n<pre><code class=\"language-json\">{\n  &quot;answer&quot;: &quot;string&quot;,\n  &quot;source&quot;: &quot;string&quot;,\n  &quot;confidence&quot;: &quot;high|medium|low&quot;,\n  &quot;unsupported_claims&quot;: [&quot;string&quot;]\n}\n</code></pre>\n<p>校验内容包括：</p>\n<ul>\n<li>是否是合法 JSON。</li>\n<li>字段是否齐全。</li>\n<li>字段类型是否正确。</li>\n<li>枚举值是否在允许范围内。</li>\n<li>必填字段是否为空。</li>\n<li>是否出现禁止字段。</li>\n</ul>\n<h3>4.6 Schema 校验失败怎么办</h3>\n<p>产品规则建议：</p>\n<pre><code class=\"language-text\">模型输出\n→ Schema 校验\n→ 通过：进入业务流程\n→ 不通过：要求模型按错误原因修正\n→ 仍失败：提示用户 / 进入人工处理 / 记录失败样本\n</code></pre>\n<p>不要让格式错误的输出直接进入系统，否则后续流程、报表、审批或自动执行都可能出错。</p>\n<h3>4.7 Prompt 设计常见错误</h3>\n<table>\n<thead>\n<tr>\n  <th>错误</th>\n  <th>后果</th>\n  <th>改法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>任务太泛</td>\n  <td>模型自由发挥</td>\n  <td>明确任务边界</td>\n</tr>\n<tr>\n  <td>没有资料边界</td>\n  <td>编造依据</td>\n  <td>规定只能依据资料</td>\n</tr>\n<tr>\n  <td>没有输出格式</td>\n  <td>难以系统解析</td>\n  <td>规定 JSON Schema</td>\n</tr>\n<tr>\n  <td>没有失败规则</td>\n  <td>不知道就乱答</td>\n  <td>资料不足时输出未提及</td>\n</tr>\n<tr>\n  <td>没有自检</td>\n  <td>低级错误多</td>\n  <td>加一致性检查</td>\n</tr>\n<tr>\n  <td>一次做太多</td>\n  <td>漏项和混乱</td>\n  <td>拆成多节点 Workflow</td>\n</tr>\n</tbody>\n</table>\n<h3>4.8 高价值 Prompt 模板：基于资料回答</h3>\n<pre><code class=\"language-text\">你是企业知识库问答助手。\n\n任务：根据【资料】回答【用户问题】。\n\n规则：\n1. 只能依据【资料】回答，不得使用外部知识自由补充。\n2. 如果资料没有明确提及，请回答“当前资料未提及”。\n3. 每个关键结论都必须给出来源片段或来源标题。\n4. 不得扩大解释，不得把推测当事实。\n5. 如需给出参考建议，必须标注“仅为推理参考，非资料结论”。\n\n输出格式：\n- 回答：\n- 来源：\n- 依据充分性：充分 / 部分充分 / 不充分\n- 无依据或推测内容：\n</code></pre>\n<hr />\n<hr />\n", "plain": "   4. Prompt 工程与结构化输出\n\n    4.1 Prompt 的本质\n\nPrompt 不是“咒语”，而是产品经理给模型的一份任务说明书。它应明确：\n\n   text\n角色 + 目标 + 输入 + 约束 + 处理步骤 + 输出格式 + 边界条件 + 失败处理\n   \n\n    4.2 Prompt 基本结构\n\n   text\n你是……\n你的任务是……\n你会收到……\n请按以下规则处理……\n不得……\n如果资料不足，请……\n输出格式必须为……\n   \n\n    4.3 Prompt 的常见组成\n\n  组成   作用   示例  \n             \n  Role 角色   让模型进入专业语境   你是合同审查助手  \n  Task 任务   明确要做什么   请判断是否存在逾期责任约定  \n  Context 上下文   提供资料和背景   以下是合同条款原文  \n  Constraints 约束   限制自由发挥   只能依据原文，不得扩大解释  \n  Steps 步骤   规定处理过程   先定位条款，再逐条解释  \n  Output 输出   控制结果格式   输出 JSON / 表格  \n  Fallback 兜底   资料不足时处理   未提及时输出“无依据”  \n  Validation 自检   输出前检查   检查答案是否与原文一致  \n\n    4.4 结构化输出为什么重要\n\nAI 产品上线时，不能只要求模型“回答得好”，还要让系统能解析、展示、存储、校验和触发后续流程。因此结构化输出是 AI 产品工程化的基础。\n\n常见格式：\n\n  JSON。\n  Markdown 表格。\n  YAML。\n  XML。\n  固定字段文本。\n\n    4.5 Schema 校验是什么\n\nSchema 校验是指系统预先定义输出数据结构，然后检查模型输出是否符合结构要求。\n\n例如系统规定输出必须是：\n\n   json\n{\n  \"answer\": \"string\",\n  \"source\": \"string\",\n  \"confidence\": \"high medium low\",\n  \"unsupported claims\":  \"string\" \n}\n   \n\n校验内容包括：\n\n  是否是合法 JSON。\n  字段是否齐全。\n  字段类型是否正确。\n  枚举值是否在允许范围内。\n  必填字段是否为空。\n  是否出现禁止字段。\n\n    4.6 Schema 校验失败怎么办\n\n产品规则建议：\n\n   text\n模型输出\n→ Schema 校验\n→ 通过：进入业务流程\n→ 不通过：要求模型按错误原因修正\n→ 仍失败：提示用户 / 进入人工处理 / 记录失败样本\n   \n\n不要让格式错误的输出直接进入系统，否则后续流程、报表、审批或自动执行都可能出错。\n\n    4.7 Prompt 设计常见错误\n\n  错误   后果   改法  \n             \n  任务太泛   模型自由发挥   明确任务边界  \n  没有资料边界   编造依据   规定只能依据资料  \n  没有输出格式   难以系统解析   规定 JSON Schema  \n  没有失败规则   不知道就乱答   资料不足时输出未提及  \n  没有自检   低级错误多   加一致性检查  \n  一次做太多   漏项和混乱   拆成多节点 Workflow  \n\n    4.8 高价值 Prompt 模板：基于资料回答\n\n   text\n你是企业知识库问答助手。\n\n任务：根据【资料】回答【用户问题】。\n\n规则：\n1. 只能依据【资料】回答，不得使用外部知识自由补充。\n2. 如果资料没有明确提及，请回答“当前资料未提及”。\n3. 每个关键结论都必须给出来源片段或来源标题。\n4. 不得扩大解释，不得把推测当事实。\n5. 如需给出参考建议，必须标注“仅为推理参考，非资料结论”。\n\n输出格式：\n  回答：\n  来源：\n  依据充分性：充分 / 部分充分 / 不充分\n  无依据或推测内容：\n   \n\n   \n\n   ", "is_new": false}, {"num": 5, "title": "RAG：让模型知道企业知识", "html": "<h2>5. RAG：让模型知道企业知识</h2>\n<h3>5.1 为什么需要 RAG</h3>\n<p>RAG，Retrieval-Augmented Generation，检索增强生成，是通过外部知识库检索相关资料，并把资料作为上下文提供给模型生成回答的方法。</p>\n<p>它解决的问题：</p>\n<ul>\n<li>模型不知道企业内部资料。</li>\n<li>模型训练数据有截止日期。</li>\n<li>模型容易幻觉。</li>\n<li>企业知识经常变化。</li>\n<li>需要回答有出处、可追溯。</li>\n<li>需要基于合同、制度、图纸、周报、FAQ 等资料回答。</li>\n</ul>\n<h3>5.2 RAG 不是万能的</h3>\n<p>RAG 只能提高模型“接触正确资料”的概率，不保证模型一定正确理解、正确引用、正确推理。</p>\n<p>RAG 常见失败原因：</p>\n<ul>\n<li>文档质量差。</li>\n<li>文档解析错误。</li>\n<li>Chunk 切分不合理。</li>\n<li>检索没召回正确内容。</li>\n<li>召回内容太多、太杂。</li>\n<li>排序不合理。</li>\n<li>Prompt 没要求依据原文。</li>\n<li>模型对条款解释过度扩写。</li>\n<li>没有答案一致性检查。</li>\n</ul>\n<h3>5.3 标准 RAG 流程</h3>\n<pre><code class=\"language-text\">文档收集\n→ 文档解析\n→ 清洗预处理\n→ Chunk 切分\n→ Embedding 向量化\n→ 建立索引 / 向量库\n→ 用户提问\n→ Query 改写 / 扩展\n→ 检索召回\n→ Rerank 重排序\n→ 拼接上下文\n→ LLM 生成回答\n→ 引用来源\n→ 质量校验\n→ 反馈与迭代\n</code></pre>\n<h3>5.4 知识预处理</h3>\n<h4>5.4.1 PDF</h4>\n<p>PDF 分为两类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>特征</th>\n  <th>处理方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>纯文字 PDF</td>\n  <td>可以复制文字</td>\n  <td>直接解析文本</td>\n</tr>\n<tr>\n  <td>扫描版 PDF</td>\n  <td>图片形式</td>\n  <td>OCR / 文档视觉模型</td>\n</tr>\n<tr>\n  <td>复杂版式 PDF</td>\n  <td>表格、页眉页脚、多栏</td>\n  <td>专业文档解析 / 版面还原</td>\n</tr>\n</tbody>\n</table>\n<p>注意：PDF 解析质量会直接影响 RAG 效果。</p>\n<h4>5.4.2 Word docx</h4>\n<p>Word 相对容易处理，但要注意：</p>\n<ul>\n<li>标题层级。</li>\n<li>表格。</li>\n<li>修订痕迹。</li>\n<li>页眉页脚。</li>\n<li>批注。</li>\n<li>图片说明。</li>\n<li>附件编号。</li>\n</ul>\n<h4>5.4.3 PPT</h4>\n<p>PPT 的难点是每页信息碎片化，且很多内容在图形、截图和注释中。</p>\n<p>处理建议：</p>\n<ul>\n<li>按页抽取文本。</li>\n<li>保留页码和标题。</li>\n<li>对图片型页面进行视觉理解。</li>\n<li>保留“页面标题 + 页面内容 + 备注”的结构。</li>\n</ul>\n<h4>5.4.4 Excel / CSV</h4>\n<p>表格型数据不适合简单切成文本后入库。需要区分：</p>\n<ul>\n<li>小型静态表：可转 Markdown 表格。</li>\n<li>大型结构化表：适合数据库 / SQL 查询。</li>\n<li>指标报表：适合 BI + LLM 解释。</li>\n<li>明细清单：需要字段说明、过滤条件和权限。</li>\n</ul>\n<h4>5.4.5 HTML 网页</h4>\n<p>网页入库要处理：</p>\n<ul>\n<li>正文抽取。</li>\n<li>去掉导航、广告、脚本、页脚。</li>\n<li>保留标题、URL、发布时间。</li>\n<li>定期更新。</li>\n</ul>\n<h4>5.4.6 核心原则</h4>\n<pre><code class=\"language-text\">Garbage In, Garbage Out\n</code></pre>\n<p>文档预处理不好，后续再调 Prompt 也很难解决根本问题。</p>\n<h3>5.5 Chunk 切分</h3>\n<p>Chunk 是知识库检索的基本片段。</p>\n<p>切分策略：</p>\n<table>\n<thead>\n<tr>\n  <th>策略</th>\n  <th>适合场景</th>\n  <th>风险</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>固定长度切分</td>\n  <td>通用文档</td>\n  <td>可能切断语义</td>\n</tr>\n<tr>\n  <td>按标题切分</td>\n  <td>制度、方案、报告</td>\n  <td>标题层级必须准确</td>\n</tr>\n<tr>\n  <td>按条款切分</td>\n  <td>合同、法规、制度</td>\n  <td>条款编号要保留</td>\n</tr>\n<tr>\n  <td>按问答切分</td>\n  <td>FAQ</td>\n  <td>易检索，但覆盖有限</td>\n</tr>\n<tr>\n  <td>按表格行切分</td>\n  <td>清单数据</td>\n  <td>容易丢失表头语义</td>\n</tr>\n<tr>\n  <td>混合切分</td>\n  <td>企业复杂文档</td>\n  <td>实现复杂，但效果更好</td>\n</tr>\n</tbody>\n</table>\n<p>Chunk 需要保留：</p>\n<ul>\n<li>文档标题。</li>\n<li>章节标题。</li>\n<li>页码。</li>\n<li>条款编号。</li>\n<li>表格标题。</li>\n<li>来源 URL 或文件路径。</li>\n<li>版本号。</li>\n<li>生效日期。</li>\n<li>权限标签。</li>\n</ul>\n<h3>5.6 Embedding 与向量数据库</h3>\n<p>Embedding 是把文本转换成向量，让系统可以计算语义相似度。</p>\n<p>产品经理需要理解：</p>\n<ul>\n<li>Embedding 不是“理解”，而是把文本映射到语义空间。</li>\n<li>向量检索适合找“语义相近”的内容。</li>\n<li>关键词检索适合找“精确词、编号、人名、金额、条款号”。</li>\n<li>企业 RAG 常常需要混合检索：向量检索 + 关键词检索 + 元数据过滤。</li>\n</ul>\n<p>常见向量库 / 检索组件：</p>\n<ul>\n<li>Elasticsearch / OpenSearch。</li>\n<li>Milvus / Zilliz。</li>\n<li>Weaviate。</li>\n<li>Pinecone。</li>\n<li>Qdrant。</li>\n<li>Chroma。</li>\n<li>FAISS。</li>\n<li>PostgreSQL + pgvector。</li>\n</ul>\n<h3>5.7 检索与 Rerank</h3>\n<p>检索分两步：</p>\n<pre><code class=\"language-text\">召回：先找出可能相关的 N 段\n排序：再判断哪几段最相关\n</code></pre>\n<p>Rerank 的作用是对候选片段重新排序，提升最终给模型的上下文质量。</p>\n<p>常见策略：</p>\n<ul>\n<li>Top-K 检索。</li>\n<li>相似度阈值。</li>\n<li>Metadata Filter。</li>\n<li>Hybrid Search。</li>\n<li>Query Rewrite。</li>\n<li>Query Expansion。</li>\n<li>Multi-Query Retrieval。</li>\n<li>Reranker 重排。</li>\n</ul>\n<h3>5.8 RAG 输出设计</h3>\n<p>企业 RAG 不能只输出答案，应输出：</p>\n<pre><code class=\"language-text\">回答\n+ 来源\n+ 原文片段\n+ 依据充分性\n+ 未覆盖信息\n+ 风险提示\n+ 推荐追问\n</code></pre>\n<p>示例结构：</p>\n<pre><code class=\"language-json\">{\n  &quot;answer&quot;: &quot;当前资料显示……&quot;,\n  &quot;sources&quot;: [\n    {\n      &quot;document&quot;: &quot;XX合同.pdf&quot;,\n      &quot;page&quot;: 12,\n      &quot;clause&quot;: &quot;第8.2条&quot;,\n      &quot;quote&quot;: &quot;……&quot;\n    }\n  ],\n  &quot;evidence_level&quot;: &quot;sufficient&quot;,\n  &quot;unsupported_claims&quot;: [],\n  &quot;follow_up_questions&quot;: [&quot;是否需要进一步核对补充协议？&quot;]\n}\n</code></pre>\n<h3>5.9 高级 RAG 类型</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>核心思路</th>\n  <th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>HyDE</td>\n  <td>先让模型生成假设答案，再用假设答案检索</td>\n  <td>用户问题很短、关键词不明显</td>\n</tr>\n<tr>\n  <td>Multi-Hop RAG</td>\n  <td>多轮检索，跨文档推理</td>\n  <td>复杂问题、跨资料分析</td>\n</tr>\n<tr>\n  <td>Self-RAG</td>\n  <td>模型自评是否需要检索、是否足够</td>\n  <td>高质量问答</td>\n</tr>\n<tr>\n  <td>Corrective RAG</td>\n  <td>检索质量不好时自动补救</td>\n  <td>检索不稳定场景</td>\n</tr>\n<tr>\n  <td>Agentic RAG</td>\n  <td>Agent 决定何时检索、搜什么、再检索几次</td>\n  <td>开放复杂任务</td>\n</tr>\n<tr>\n  <td>GraphRAG</td>\n  <td>用知识图谱组织实体关系</td>\n  <td>跨实体、跨项目、关系密集型知识</td>\n</tr>\n<tr>\n  <td>Hybrid RAG</td>\n  <td>结构化数据 + 非结构化文档混合检索</td>\n  <td>企业系统与文档同时存在</td>\n</tr>\n<tr>\n  <td>Multimodal RAG</td>\n  <td>文本、图片、表格、图纸、截图混合检索</td>\n  <td>工程、设计、运维、医疗、制造</td>\n</tr>\n</tbody>\n</table>\n<h3>5.10 RAG 产品指标</h3>\n<table>\n<thead>\n<tr>\n  <th>指标</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>检索召回率</td>\n  <td>正确资料是否被找出来</td>\n</tr>\n<tr>\n  <td>检索准确率</td>\n  <td>找出来的资料是否相关</td>\n</tr>\n<tr>\n  <td>引用准确率</td>\n  <td>引用是否真的支持答案</td>\n</tr>\n<tr>\n  <td>答案忠实度</td>\n  <td>答案是否忠于资料</td>\n</tr>\n<tr>\n  <td>答案完整性</td>\n  <td>是否覆盖用户问题</td>\n</tr>\n<tr>\n  <td>无依据拒答率</td>\n  <td>没资料时是否会拒答</td>\n</tr>\n<tr>\n  <td>幻觉率</td>\n  <td>是否编造事实</td>\n</tr>\n<tr>\n  <td>响应时延</td>\n  <td>用户等待时间</td>\n</tr>\n<tr>\n  <td>单次成本</td>\n  <td>Token、检索、存储、模型成本</td>\n</tr>\n<tr>\n  <td>用户采纳率</td>\n  <td>用户是否采用答案</td>\n</tr>\n<tr>\n  <td>人工修正率</td>\n  <td>输出需要修改的比例</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n\n<h3>5.10 v1.3 进阶：GraphRAG 与 Agentic RAG</h3>\n<h4>5.10.1 GraphRAG（知识图谱增强检索）</h4>\n<p>传统 RAG 基于向量检索，在“大海捞针”提取事实时表现优异，但在处理<strong>宏观主题总结</strong>时往往缺乏跨文档实体关系的理解。</p>\n<ul>\n<li><strong>全局连通性</strong>：将非结构化文档预处理为实体与关系的知识图谱。</li>\n<li><strong>社区摘要 (Community Summaries)</strong>：支持对图谱的子社区进行预汇总，提升宏观问题的召回质量。</li>\n<li><strong>混合检索 (Hybrid RAG)</strong>：向量检索细粒度查询 + 知识图谱跨域推理 + 关键词检索特定名词。</li>\n</ul>\n<h4>5.10.2 Agentic RAG 动态路由机制</h4>\n<p>传统 RAG 是线性单向的，Agentic RAG 将其转化为具有规划和工具调用的闭环：</p>\n<ul>\n<li><strong>查询路由 (Query Routing)</strong>：根据意图判断查向量库、SQL 或联网搜索。</li>\n<li><strong>多步检索 (Multi-step Retrieval)</strong>：第一轮召回不充分时，自动改写 Query 发起二次检索。</li>\n<li><strong>退回与降级</strong>：检索不到时提供兜底和追问建议。</li>\n</ul>\n", "plain": "   5. RAG：让模型知道企业知识\n\n    5.1 为什么需要 RAG\n\nRAG，Retrieval Augmented Generation，检索增强生成，是通过外部知识库检索相关资料，并把资料作为上下文提供给模型生成回答的方法。\n\n它解决的问题：\n\n  模型不知道企业内部资料。\n  模型训练数据有截止日期。\n  模型容易幻觉。\n  企业知识经常变化。\n  需要回答有出处、可追溯。\n  需要基于合同、制度、图纸、周报、FAQ 等资料回答。\n\n    5.2 RAG 不是万能的\n\nRAG 只能提高模型“接触正确资料”的概率，不保证模型一定正确理解、正确引用、正确推理。\n\nRAG 常见失败原因：\n\n  文档质量差。\n  文档解析错误。\n  Chunk 切分不合理。\n  检索没召回正确内容。\n  召回内容太多、太杂。\n  排序不合理。\n  Prompt 没要求依据原文。\n  模型对条款解释过度扩写。\n  没有答案一致性检查。\n\n    5.3 标准 RAG 流程\n\n   text\n文档收集\n→ 文档解析\n→ 清洗预处理\n→ Chunk 切分\n→ Embedding 向量化\n→ 建立索引 / 向量库\n→ 用户提问\n→ Query 改写 / 扩展\n→ 检索召回\n→ Rerank 重排序\n→ 拼接上下文\n→ LLM 生成回答\n→ 引用来源\n→ 质量校验\n→ 反馈与迭代\n   \n\n    5.4 知识预处理\n\n     5.4.1 PDF\n\nPDF 分为两类：\n\n  类型   特征   处理方式  \n             \n  纯文字 PDF   可以复制文字   直接解析文本  \n  扫描版 PDF   图片形式   OCR / 文档视觉模型  \n  复杂版式 PDF   表格、页眉页脚、多栏   专业文档解析 / 版面还原  \n\n注意：PDF 解析质量会直接影响 RAG 效果。\n\n     5.4.2 Word docx\n\nWord 相对容易处理，但要注意：\n\n  标题层级。\n  表格。\n  修订痕迹。\n  页眉页脚。\n  批注。\n  图片说明。\n  附件编号。\n\n     5.4.3 PPT\n\nPPT 的难点是每页信息碎片化，且很多内容在图形、截图和注释中。\n\n处理建议：\n\n  按页抽取文本。\n  保留页码和标题。\n  对图片型页面进行视觉理解。\n  保留“页面标题 + 页面内容 + 备注”的结构。\n\n     5.4.4 Excel / CSV\n\n表格型数据不适合简单切成文本后入库。需要区分：\n\n  小型静态表：可转 Markdown 表格。\n  大型结构化表：适合数据库 / SQL 查询。\n  指标报表：适合 BI + LLM 解释。\n  明细清单：需要字段说明、过滤条件和权限。\n\n     5.4.5 HTML 网页\n\n网页入库要处理：\n\n  正文抽取。\n  去掉导航、广告、脚本、页脚。\n  保留标题、URL、发布时间。\n  定期更新。\n\n     5.4.6 核心原则\n\n   text\nGarbage In, Garbage Out\n   \n\n文档预处理不好，后续再调 Prompt 也很难解决根本问题。\n\n    5.5 Chunk 切分\n\nChunk 是知识库检索的基本片段。\n\n切分策略：\n\n  策略   适合场景   风险  \n             \n  固定长度切分   通用文档   可能切断语义  \n  按标题切分   制度、方案、报告   标题层级必须准确  \n  按条款切分   合同、法规、制度   条款编号要保留  \n  按问答切分   FAQ   易检索，但覆盖有限  \n  按表格行切分   清单数据   容易丢失表头语义  \n  混合切分   企业复杂文档   实现复杂，但效果更好  \n\nChunk 需要保留：\n\n  文档标题。\n  章节标题。\n  页码。\n  条款编号。\n  表格标题。\n  来源 URL 或文件路径。\n  版本号。\n  生效日期。\n  权限标签。\n\n    5.6 Embedding 与向量数据库\n\nEmbedding 是把文本转换成向量，让系统可以计算语义相似度。\n\n产品经理需要理解：\n\n  Embedding 不是“理解”，而是把文本映射到语义空间。\n  向量检索适合找“语义相近”的内容。\n  关键词检索适合找“精确词、编号、人名、金额、条款号”。\n  企业 RAG 常常需要混合检索：向量检索 + 关键词检索 + 元数据过滤。\n\n常见向量库 / 检索组件：\n\n  Elasticsearch / OpenSearch。\n  Milvus / Zilliz。\n  Weaviate。\n  Pinecone。\n  Qdrant。\n  Chroma。\n  FAISS。\n  PostgreSQL + pgvector。\n\n    5.7 检索与 Rerank\n\n检索分两步：\n\n   text\n召回：先找出可能相关的 N 段\n排序：再判断哪几段最相关\n   \n\nRerank 的作用是对候选片段重新排序，提升最终给模型的上下文质量。\n\n常见策略：\n\n  Top K 检索。\n  相似度阈值。\n  Metadata Filter。\n  Hybrid Search。\n  Query Rewrite。\n  Query Expansion。\n  Multi Query Retrieval。\n  Reranker 重排。\n\n    5.8 RAG 输出设计\n\n企业 RAG 不能只输出答案，应输出：\n\n   text\n回答\n+ 来源\n+ 原文片段\n+ 依据充分性\n+ 未覆盖信息\n+ 风险提示\n+ 推荐追问\n   \n\n示例结构：\n\n   json\n{\n  \"answer\": \"当前资料显示……\",\n  \"sources\":  \n    {\n      \"document\": \"XX合同.pdf\",\n      \"page\": 12,\n      \"clause\": \"第8.2条\",\n      \"quote\": \"……\"\n    }\n   ,\n  \"evidence level\": \"sufficient\",\n  \"unsupported claims\":   ,\n  \"follow up questions\":  \"是否需要进一步核对补充协议？\" \n}\n   \n\n    5.9 高级 RAG 类型\n\n  类型   核心思路   适用场景  \n             \n  HyDE   先让模型生成假设答案，再用假设答案检索   用户问题很短、关键词不明显  \n  Multi Hop RAG   多轮检索，跨文档推理   复杂问题、跨资料分析  \n  Self RAG   模型自评是否需要检索、是否足够   高质量问答  \n  Corrective RAG   检索质量不好时自动补救   检索不稳定场景  \n  Agentic RAG   Agent 决定何时检索、搜什么、再检索几次   开放复杂任务  \n  GraphRAG   用知识图谱组织实体关系   跨实体、跨项目、关系密集型知识  \n  Hybrid RAG   结构化数据 + 非结构化文档混合检索   企业系统与文档同时存在  \n  Multimodal RAG   文本、图片、表格、图纸、截图混合检索   工程、设计、运维、医疗、制造  \n\n    5.10 RAG 产品指标\n\n  指标   说明  \n         \n  检索召回率   正确资料是否被找出来  \n  检索准确率   找出来的资料是否相关  \n  引用准确率   引用是否真的支持答案  \n  答案忠实度   答案是否忠于资料  \n  答案完整性   是否覆盖用户问题  \n  无依据拒答率   没资料时是否会拒答  \n  幻觉率   是否编造事实  \n  响应时延   用户等待时间  \n  单次成本   Token、检索、存储、模型成本  \n  用户采纳率   用户是否采用答案  \n  人工修正率   输出需要修改的比例  \n\n   \n\n   \n\n    5.10 v1.3 进阶：GraphRAG 与 Agentic RAG\n\n    5.10.1 GraphRAG（知识图谱增强检索）\n\n传统 RAG 基于向量检索，在“大海捞针”提取事实时表现优异，但在处理宏观主题总结时往往缺乏跨文档实体关系的理解。\n\n  全局连通性：将非结构化文档预处理为实体与关系的知识图谱。\n  社区摘要 (Community Summaries)：支持对图谱的子社区进行预汇总，提升宏观问题的召回质量。\n  混合检索 (Hybrid RAG)：向量检索细粒度查询 + 知识图谱跨域推理 + 关键词检索特定名词。\n\n    5.10.2 Agentic RAG 动态路由机制\n\n传统 RAG 是线性单向的，Agentic RAG 将其转化为具有规划和工具调用的闭环：\n\n  查询路由 (Query Routing)：根据意图判断查向量库、SQL 或联网搜索。\n  多步检索 (Multi-step Retrieval)：第一轮召回不充分时，自动改写 Query 发起二次检索。\n  退回与降级：检索不到时提供兜底和追问建议。\n", "is_new": false}, {"num": 6, "title": "Workflow：把 AI 嵌入业务流程", "html": "<h2>6. Workflow：把 AI 嵌入业务流程</h2>\n<h3>6.1 Workflow 是什么</h3>\n<p>Workflow 是把一个业务任务拆成多个可控节点，并按规则执行的流程编排。</p>\n<p>典型节点：</p>\n<ul>\n<li>输入节点。</li>\n<li>条件判断节点。</li>\n<li>LLM 节点。</li>\n<li>知识检索节点。</li>\n<li>API 调用节点。</li>\n<li>数据处理节点。</li>\n<li>人工审核节点。</li>\n<li>输出节点。</li>\n<li>异常处理节点。</li>\n</ul>\n<h3>6.2 Workflow 与单次对话的区别</h3>\n<table>\n<thead>\n<tr>\n  <th>对比项</th>\n  <th>单次对话</th>\n  <th>Workflow</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>结构</td>\n  <td>自由问答</td>\n  <td>固定流程</td>\n</tr>\n<tr>\n  <td>可控性</td>\n  <td>低</td>\n  <td>高</td>\n</tr>\n<tr>\n  <td>适合场景</td>\n  <td>临时问答、探索</td>\n  <td>企业业务流程</td>\n</tr>\n<tr>\n  <td>质量控制</td>\n  <td>靠 Prompt</td>\n  <td>节点校验 + 人工审核 + 异常处理</td>\n</tr>\n<tr>\n  <td>可追踪</td>\n  <td>较弱</td>\n  <td>较强</td>\n</tr>\n</tbody>\n</table>\n<h3>6.3 什么时候用 Workflow</h3>\n<p>适合：</p>\n<ul>\n<li>周报生成。</li>\n<li>合同初审。</li>\n<li>标书生成。</li>\n<li>工单分派。</li>\n<li>客服分流。</li>\n<li>巡检异常处理。</li>\n<li>审批材料生成。</li>\n<li>会议纪要整理。</li>\n<li>数据报表解读。</li>\n</ul>\n<h3>6.4 Workflow 设计方法</h3>\n<pre><code class=\"language-text\">定义目标\n→ 拆解节点\n→ 明确每个节点输入输出\n→ 设计 Prompt / API / 规则\n→ 设置人工审核点\n→ 设置异常分支\n→ 设置日志和追踪\n→ 设计最终输出\n</code></pre>\n<h3>6.5 Workflow 节点设计表</h3>\n<table>\n<thead>\n<tr>\n  <th>字段</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>节点名称</td>\n  <td>例如“合同条款抽取”</td>\n</tr>\n<tr>\n  <td>节点类型</td>\n  <td>LLM / RAG / API / 人工审核 / 条件判断</td>\n</tr>\n<tr>\n  <td>输入</td>\n  <td>节点接收什么</td>\n</tr>\n<tr>\n  <td>处理逻辑</td>\n  <td>如何处理</td>\n</tr>\n<tr>\n  <td>输出</td>\n  <td>输出字段和格式</td>\n</tr>\n<tr>\n  <td>校验规则</td>\n  <td>如何判断是否合格</td>\n</tr>\n<tr>\n  <td>失败处理</td>\n  <td>重试、人工介入、终止</td>\n</tr>\n<tr>\n  <td>日志</td>\n  <td>记录什么</td>\n</tr>\n</tbody>\n</table>\n<h3>6.6 人机协同设计</h3>\n<p>AI 产品不是所有环节都自动化。高质量企业 AI 产品必须明确：</p>\n<ul>\n<li>哪些环节 AI 自动执行。</li>\n<li>哪些环节 AI 只提供建议。</li>\n<li>哪些环节必须人工确认。</li>\n<li>哪些动作禁止 AI 自动执行。</li>\n<li>人工如何修改 AI 输出。</li>\n<li>修改结果如何反哺评测集和知识库。</li>\n</ul>\n<h3>6.7 Workflow 常见错误</h3>\n<table>\n<thead>\n<tr>\n  <th>错误</th>\n  <th>后果</th>\n  <th>正确做法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>一个大 Prompt 做到底</td>\n  <td>不稳定、难排查</td>\n  <td>拆成多个节点</td>\n</tr>\n<tr>\n  <td>没有人工审核</td>\n  <td>风险不可控</td>\n  <td>关键节点加确认</td>\n</tr>\n<tr>\n  <td>没有结构化输出</td>\n  <td>后续无法流转</td>\n  <td>每个节点定义 Schema</td>\n</tr>\n<tr>\n  <td>没有异常分支</td>\n  <td>失败后卡死</td>\n  <td>定义失败处理</td>\n</tr>\n<tr>\n  <td>没有日志</td>\n  <td>无法追责和优化</td>\n  <td>全流程留痕</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   6. Workflow：把 AI 嵌入业务流程\n\n    6.1 Workflow 是什么\n\nWorkflow 是把一个业务任务拆成多个可控节点，并按规则执行的流程编排。\n\n典型节点：\n\n  输入节点。\n  条件判断节点。\n  LLM 节点。\n  知识检索节点。\n  API 调用节点。\n  数据处理节点。\n  人工审核节点。\n  输出节点。\n  异常处理节点。\n\n    6.2 Workflow 与单次对话的区别\n\n  对比项   单次对话   Workflow  \n             \n  结构   自由问答   固定流程  \n  可控性   低   高  \n  适合场景   临时问答、探索   企业业务流程  \n  质量控制   靠 Prompt   节点校验 + 人工审核 + 异常处理  \n  可追踪   较弱   较强  \n\n    6.3 什么时候用 Workflow\n\n适合：\n\n  周报生成。\n  合同初审。\n  标书生成。\n  工单分派。\n  客服分流。\n  巡检异常处理。\n  审批材料生成。\n  会议纪要整理。\n  数据报表解读。\n\n    6.4 Workflow 设计方法\n\n   text\n定义目标\n→ 拆解节点\n→ 明确每个节点输入输出\n→ 设计 Prompt / API / 规则\n→ 设置人工审核点\n→ 设置异常分支\n→ 设置日志和追踪\n→ 设计最终输出\n   \n\n    6.5 Workflow 节点设计表\n\n  字段   说明  \n         \n  节点名称   例如“合同条款抽取”  \n  节点类型   LLM / RAG / API / 人工审核 / 条件判断  \n  输入   节点接收什么  \n  处理逻辑   如何处理  \n  输出   输出字段和格式  \n  校验规则   如何判断是否合格  \n  失败处理   重试、人工介入、终止  \n  日志   记录什么  \n\n    6.6 人机协同设计\n\nAI 产品不是所有环节都自动化。高质量企业 AI 产品必须明确：\n\n  哪些环节 AI 自动执行。\n  哪些环节 AI 只提供建议。\n  哪些环节必须人工确认。\n  哪些动作禁止 AI 自动执行。\n  人工如何修改 AI 输出。\n  修改结果如何反哺评测集和知识库。\n\n    6.7 Workflow 常见错误\n\n  错误   后果   正确做法  \n             \n  一个大 Prompt 做到底   不稳定、难排查   拆成多个节点  \n  没有人工审核   风险不可控   关键节点加确认  \n  没有结构化输出   后续无法流转   每个节点定义 Schema  \n  没有异常分支   失败后卡死   定义失败处理  \n  没有日志   无法追责和优化   全流程留痕  \n\n   \n\n   ", "is_new": false}, {"num": 7, "title": "Agent：让 AI 执行多步骤任务", "html": "<h2>7. Agent：让 AI 执行多步骤任务</h2>\n<h3>7.1 Agent 是什么</h3>\n<p>Agent 是能够围绕目标进行多步骤规划、调用工具、观察结果、调整行动并完成任务的 AI 系统。</p>\n<p>产品视角公式：</p>\n<pre><code class=\"language-text\">Agent = Model + Memory + Planning + Tool Use + Runtime / Harness + Guardrails\n</code></pre>\n<p>也可以简化为：</p>\n<pre><code class=\"language-text\">Agent = 模型 + 驾驭系统\n</code></pre>\n<p>模型负责理解和生成，驾驭系统负责上下文、工具、权限、记忆、执行、验证和安全。</p>\n<h3>7.2 Agent 与 Workflow 的区别</h3>\n<table>\n<thead>\n<tr>\n  <th>维度</th>\n  <th>Workflow</th>\n  <th>Agent</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>流程</td>\n  <td>预先设计</td>\n  <td>可动态规划</td>\n</tr>\n<tr>\n  <td>路径</td>\n  <td>固定或半固定</td>\n  <td>根据任务变化</td>\n</tr>\n<tr>\n  <td>可控性</td>\n  <td>强</td>\n  <td>相对弱，需要治理</td>\n</tr>\n<tr>\n  <td>适合场景</td>\n  <td>标准业务流程</td>\n  <td>开放复杂任务</td>\n</tr>\n<tr>\n  <td>风险</td>\n  <td>较低</td>\n  <td>较高</td>\n</tr>\n<tr>\n  <td>产品重点</td>\n  <td>节点设计</td>\n  <td>工具、权限、记忆、验证</td>\n</tr>\n</tbody>\n</table>\n<p>产品判断：</p>\n<ul>\n<li>流程明确、规则固定：优先 Workflow。</li>\n<li>任务开放、多步骤、路径不确定：考虑 Agent。</li>\n<li>高风险动作：Agent 只建议，不直接执行，必须人审。</li>\n</ul>\n<h3>7.3 Agent 三层架构</h3>\n<table>\n<thead>\n<tr>\n  <th>层级</th>\n  <th>核心问题</th>\n  <th>产品经理关注点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Control 控制层</td>\n  <td>谁说了算？</td>\n  <td>用户授权、权限边界、人工确认、策略规则</td>\n</tr>\n<tr>\n  <td>Agency 代理层</td>\n  <td>Agent 能做什么？</td>\n  <td>工具清单、任务边界、可访问数据、可执行动作</td>\n</tr>\n<tr>\n  <td>Runtime 运行层</td>\n  <td>如何持续运行？</td>\n  <td>上下文管理、任务状态、日志、重试、失败恢复</td>\n</tr>\n</tbody>\n</table>\n<h3>7.4 Agent 常见范式</h3>\n<h4>7.4.1 ReAct</h4>\n<p>ReAct = Reasoning + Acting。<br />\n模型一边思考，一边调用工具，再根据工具结果继续行动。</p>\n<p>适合：</p>\n<ul>\n<li>搜索问题。</li>\n<li>多步查询。</li>\n<li>工具调用。</li>\n<li>数据分析。</li>\n</ul>\n<p>风险：</p>\n<ul>\n<li>工具调用过多。</li>\n<li>路径发散。</li>\n<li>结果不稳定。</li>\n</ul>\n<h4>7.4.2 Plan-and-Solve</h4>\n<p>先制定计划，再逐步执行。</p>\n<p>适合：</p>\n<ul>\n<li>任务路径较清晰。</li>\n<li>需要高效执行。</li>\n<li>需要展示执行计划。</li>\n</ul>\n<p>风险：</p>\n<ul>\n<li>初始计划错了，后续全错。</li>\n<li>不适合高度动态的任务。</li>\n</ul>\n<h4>7.4.3 Reflection</h4>\n<p>执行后进行反思、自检、修正。</p>\n<p>适合：</p>\n<ul>\n<li>写作润色。</li>\n<li>代码修复。</li>\n<li>文档审查。</li>\n<li>质量要求高的输出。</li>\n</ul>\n<p>风险：</p>\n<ul>\n<li>反思不等于真实验证。</li>\n<li>可能反复修改但没有实质提升。</li>\n</ul>\n<h4>7.4.4 Multi-Agent</h4>\n<p>多个 Agent 分工协作，例如规划者、执行者、评审者。</p>\n<p>适合：</p>\n<ul>\n<li>复杂任务。</li>\n<li>需要角色分工。</li>\n<li>需要评审和复核。</li>\n</ul>\n<p>风险：</p>\n<ul>\n<li>成本高。</li>\n<li>协作链路复杂。</li>\n<li>责任边界不清。</li>\n</ul>\n<h3>7.5 Agent 工程的核心：Harness</h3>\n<p>Harness 可以理解为“驾驭系统”，是模型之外的一整套控制系统。</p>\n<p>它包括：</p>\n<ul>\n<li>上下文工程。</li>\n<li>工具注册与调用。</li>\n<li>权限控制。</li>\n<li>文件系统隔离。</li>\n<li>状态管理。</li>\n<li>记忆管理。</li>\n<li>日志追踪。</li>\n<li>任务队列。</li>\n<li>验证器。</li>\n<li>人工审批。</li>\n<li>回滚机制。</li>\n<li>成本限制。</li>\n</ul>\n<h3>7.6 上下文工程：Agent 的核心战场</h3>\n<p>Agent 不是只靠模型强，而是靠“每一步让模型看到正确的信息”。</p>\n<p>上下文工程四个动作：</p>\n<table>\n<thead>\n<tr>\n  <th>动作</th>\n  <th>说明</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Write 写入</td>\n  <td>把重要状态写入可持久化位置</td>\n  <td>任务计划、决策记录、执行日志</td>\n</tr>\n<tr>\n  <td>Select 选择</td>\n  <td>只把当前任务需要的信息放进上下文</td>\n  <td>相关文件、相关历史、相关工具</td>\n</tr>\n<tr>\n  <td>Compress 压缩</td>\n  <td>把长历史压缩成摘要</td>\n  <td>会话摘要、阶段总结</td>\n</tr>\n<tr>\n  <td>Isolate 隔离</td>\n  <td>子任务隔离，避免互相污染</td>\n  <td>子 Agent、临时目录、沙箱</td>\n</tr>\n</tbody>\n</table>\n<h3>7.7 Agent 常见问题与解法</h3>\n<table>\n<thead>\n<tr>\n  <th>问题</th>\n  <th>症状</th>\n  <th>解法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>上下文腐化</td>\n  <td>对话越长越混乱</td>\n  <td>外部记忆、任务状态、阶段摘要</td>\n</tr>\n<tr>\n  <td>错误累积</td>\n  <td>前面错了后面继续错</td>\n  <td>检查点、回滚、验证器</td>\n</tr>\n<tr>\n  <td>一次性做完</td>\n  <td>漏项、质量差</td>\n  <td>拆成小任务，逐步验收</td>\n</tr>\n<tr>\n  <td>过早宣布完成</td>\n  <td>没做完就说完成</td>\n  <td>明确完成标准和自检清单</td>\n</tr>\n<tr>\n  <td>工具滥用</td>\n  <td>频繁调用无关工具</td>\n  <td>工具白名单、调用预算</td>\n</tr>\n<tr>\n  <td>越权操作</td>\n  <td>访问或修改不该动的数据</td>\n  <td>权限分级、人工确认</td>\n</tr>\n<tr>\n  <td>成本失控</td>\n  <td>多轮循环调用模型</td>\n  <td>预算上限、停止条件</td>\n</tr>\n</tbody>\n</table>\n<h3>7.8 Agent 验证与质量门控</h3>\n<p>推荐闭环：</p>\n<pre><code class=\"language-text\">Planner 制定计划\n→ Generator 执行任务\n→ Evaluator 评估结果\n→ 不合格则修复\n→ 通过则输出\n→ 全程日志留痕\n</code></pre>\n<p>常见验证方式：</p>\n<ul>\n<li>Schema 校验。</li>\n<li>引用来源校验。</li>\n<li>单元测试。</li>\n<li>E2E 测试。</li>\n<li>Playwright 浏览器测试。</li>\n<li>人工审核。</li>\n<li>事实一致性检查。</li>\n<li>安全策略检查。</li>\n</ul>\n<h3>7.9 Agent 外部接口能力</h3>\n<table>\n<thead>\n<tr>\n  <th>接口</th>\n  <th>作用</th>\n  <th>产品经理理解</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文件系统</td>\n  <td>读写本地文件</td>\n  <td>风险高，需要权限控制</td>\n</tr>\n<tr>\n  <td>HTTP REST API</td>\n  <td>调用业务系统接口</td>\n  <td>企业最常见集成方式</td>\n</tr>\n<tr>\n  <td>WebSocket</td>\n  <td>实时双向通信</td>\n  <td>实时状态、协作场景</td>\n</tr>\n<tr>\n  <td>SSE</td>\n  <td>服务端持续推送</td>\n  <td>流式输出、任务进度</td>\n</tr>\n<tr>\n  <td>Function Calling / Tool Use</td>\n  <td>模型调用函数</td>\n  <td>工具输入输出必须结构化</td>\n</tr>\n<tr>\n  <td>MCP</td>\n  <td>标准化连接数据源和工具</td>\n  <td>类似 AI 应用的标准接口层</td>\n</tr>\n<tr>\n  <td>Computer Use</td>\n  <td>操作屏幕和 GUI</td>\n  <td>通用但不够稳定，风险高</td>\n</tr>\n<tr>\n  <td>Browser Control / CDP / Playwright</td>\n  <td>精准控制浏览器</td>\n  <td>Web 自动化、测试、采集</td>\n</tr>\n<tr>\n  <td>A2A / Agent-to-Agent</td>\n  <td>Agent 之间通信</td>\n  <td>多 Agent 协作和任务分发</td>\n</tr>\n</tbody>\n</table>\n<h3>7.10 Computer Use 与浏览器操控的区别</h3>\n<table>\n<thead>\n<tr>\n  <th>对比项</th>\n  <th>Computer Use</th>\n  <th>浏览器操控 / CDP / Playwright</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>原理</td>\n  <td>看屏幕、点按钮、键盘操作</td>\n  <td>直接操控 DOM / 浏览器协议</td>\n</tr>\n<tr>\n  <td>精度</td>\n  <td>依赖视觉识别</td>\n  <td>元素级精确</td>\n</tr>\n<tr>\n  <td>范围</td>\n  <td>任意 GUI 应用</td>\n  <td>浏览器内应用</td>\n</tr>\n<tr>\n  <td>稳定性</td>\n  <td>较弱</td>\n  <td>较强</td>\n</tr>\n<tr>\n  <td>代表场景</td>\n  <td>通用桌面操作</td>\n  <td>Web 自动化、测试、采集</td>\n</tr>\n</tbody>\n</table>\n<h3>7.11 v1.2 增强：Agent 工程化概念索引</h3>\n<p>v1.1 已经说明 Agent 的基本形态：规划、记忆、工具调用、运行时、上下文工程、权限与验证。v1.2 在这个基础上补齐“Agent 工程化落地”的关键概念，不改变原 Agent 章节的判断：<strong>能用 Workflow 解决的，不要优先上复杂 Agent；必须用 Agent 时，要先设计控制系统，再设计模型提示词。</strong></p>\n<h4>7.11.1 Agent Hardness：任务复杂度分级</h4>\n<p>Agent Hardness 用来判断一个场景需要多复杂的智能体能力。</p>\n<table>\n<thead>\n<tr>\n  <th>等级</th>\n  <th>类型</th>\n  <th>推荐实现</th>\n  <th>产品判断</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>L0</td>\n  <td>普通问答</td>\n  <td>LLM / RAG</td>\n  <td>不需要 Agent</td>\n</tr>\n<tr>\n  <td>L1</td>\n  <td>单次工具调用</td>\n  <td>Function Calling / MCP Tool</td>\n  <td>模型只需要选择一个工具</td>\n</tr>\n<tr>\n  <td>L2</td>\n  <td>固定多步骤流程</td>\n  <td>Workflow</td>\n  <td>路径固定，优先流程编排</td>\n</tr>\n<tr>\n  <td>L3</td>\n  <td>动态路径、多工具选择</td>\n  <td>轻量 Agent</td>\n  <td>任务路径不固定，但风险可控</td>\n</tr>\n<tr>\n  <td>L4</td>\n  <td>长任务、状态记忆、中途恢复</td>\n  <td>Agent + Harness</td>\n  <td>需要任务状态、日志、恢复、验证</td>\n</tr>\n<tr>\n  <td>L5</td>\n  <td>高风险跨系统执行</td>\n  <td>Agent + 权限 + 人审 + 审计 + 回滚</td>\n  <td>涉及资金、权限、生产系统、法律责任</td>\n</tr>\n</tbody>\n</table>\n<p>核心原则：<strong>Agent Hardness 越高，越不能只靠 Prompt，必须增加 Harness、权限、验证、审计、回滚和人工确认。</strong></p>\n<h4>7.11.2 Agent Harness：运行时控制层</h4>\n<p>Harness 是模型之外的运行时控制系统，解决 Agent 如何被控制、被观察、被验证、被回滚。</p>\n<p>产品经理需要把 Harness 拆成以下组件：</p>\n<pre><code class=\"language-text\">Agent Harness\n├─ 任务状态管理\n├─ 上下文选择与压缩\n├─ Tool / MCP 接入\n├─ Skill 加载与触发\n├─ Instruction / Rule 注入\n├─ Memory / 项目记忆\n├─ Trace / 日志 / 可观测性\n├─ Hook / 确定性校验\n├─ 权限控制\n├─ 人工审批\n├─ Fallback\n└─ 回滚与审计\n</code></pre>\n<p>一句话：<strong>模型负责生成可能的行动，Harness 负责限制行动范围、记录执行过程、判断结果是否合格。</strong></p>\n<h4>7.11.3 Skill：Agent 的可复用任务能力包</h4>\n<p>Skill 是把某类任务的操作流程、领域知识、模板、脚本、参考资料和校验规则封装成可复用能力包。它不是一次性的 Prompt，也不是单个工具 API。</p>\n<pre><code class=\"language-text\">my-skill/\n├─ SKILL.md          # 入口说明：什么时候触发、如何执行\n├─ references/       # 参考资料、规范、模板说明\n├─ scripts/          # 高确定性处理脚本\n├─ assets/           # 模板、样例文件、图表素材\n└─ evals/            # 触发测试、输出测试、回归测试\n</code></pre>\n<p>产品经理要特别关注 Skill 的 <code>description</code>：它决定 Agent 什么时候会触发这个 Skill。描述过宽会误触发，描述过窄会漏触发。</p>\n<h4>7.11.4 Instruction / Manifest：项目级长期规则</h4>\n<p><code>AGENTS.md</code>、<code>CLAUDE.md</code>、<code>GEMINI.md</code>、<code>.github/copilot-instructions.md</code>、Cursor Rules 等文件属于 Agent Instruction / Manifest。它们的作用是为 Agent 提供长期上下文，例如项目结构、构建命令、测试命令、代码风格、安全要求、交付标准。</p>\n<p>边界判断：</p>\n<table>\n<thead>\n<tr>\n  <th>对象</th>\n  <th>更适合放什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Prompt</td>\n  <td>当前一次任务的目标、输入、输出要求</td>\n</tr>\n<tr>\n  <td>Instruction / Manifest</td>\n  <td>项目长期规则、架构、约束、测试命令</td>\n</tr>\n<tr>\n  <td>Skill</td>\n  <td>某类可复用任务的执行流程、模板、校验规则</td>\n</tr>\n<tr>\n  <td>Tool / MCP</td>\n  <td>Agent 可以调用的外部动作能力</td>\n</tr>\n<tr>\n  <td>Hook</td>\n  <td>工具调用前后、提交前后、停止前后的确定性校验</td>\n</tr>\n</tbody>\n</table>\n<h4>7.11.5 Hook：确定性控制点</h4>\n<p>Hook 是 Agent 生命周期中的确定性脚本或控制点，适合做“必须执行”的事情，例如：</p>\n<ul>\n<li>工具调用前检查危险命令。</li>\n<li>工具调用后检查输出格式。</li>\n<li>修改文件后自动运行测试。</li>\n<li>输出前做 Schema 校验。</li>\n<li>停止前生成执行摘要。</li>\n<li>检测 API Key、密钥、隐私数据泄露。</li>\n</ul>\n<p>核心原则：<strong>能用确定性脚本完成的校验，不要交给模型自由发挥；Skill 负责指导，Hook 负责强制。</strong></p>\n<h4>7.11.6 Subagent：复杂任务的上下文隔离</h4>\n<p>Subagent 是为专门任务启动的子代理，常用于调研、代码审查、测试、文档分析、方案评估等任务。它的价值是隔离上下文、并行处理、减少主 Agent 的上下文污染。</p>\n<p>产品判断：</p>\n<table>\n<thead>\n<tr>\n  <th>适合使用 Subagent</th>\n  <th>不适合使用 Subagent</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>可并行调研、可独立验证的子任务</td>\n  <td>强依赖全局上下文的一体化决策</td>\n</tr>\n<tr>\n  <td>大型代码库分析、文档审查、测试生成</td>\n  <td>简单问答、单工具调用、固定流程</td>\n</tr>\n<tr>\n  <td>多方案比较、错误定位、评审复核</td>\n  <td>高风险动作直接执行</td>\n</tr>\n</tbody>\n</table>\n<h4>7.11.7 Skill / Tool / MCP / Hook / Harness 的关系</h4>\n<pre><code class=\"language-text\">用户任务\n→ Prompt 描述本次目标\n→ Instruction / Manifest 提供项目长期规则\n→ Agent 判断任务复杂度\n→ Skill 提供可复用任务流程\n→ Tool / MCP 提供外部动作能力\n→ Hook 在关键节点做确定性校验\n→ Harness 管理上下文、状态、权限、日志、回滚\n→ Eval / Governance 判断结果是否可接受\n</code></pre>\n<p>一句话区分：</p>\n<blockquote>\n<p>Skill 教 Agent 怎么做一类事；Tool 给 Agent 一个动作；MCP 标准化连接工具和数据；Hook 强制关键节点校验；Harness 把这些组织成可控运行环境。</p>\n</blockquote>\n<hr />\n<hr />\n\n<h3>7.8 v1.3 进阶：Multi-Agent 协同模式</h3>\n<p>面对企业级复杂长流程，单体大模型容易遭遇“指令迷失”。多智能体协作（Multi-Agent）通过角色拆分与上下文隔离解决此问题。</p>\n<h4>7.8.1 典型 Multi-Agent 架构</h4>\n<ol>\n<li><strong>Supervisor (主管-下属) 模式</strong>：一个高级 LLM 扮演 Router，拆解任务给多个垂直子 Agent，最后汇总。适合明确分工。</li>\n<li><strong>Swarm / Peer-to-Peer 模式</strong>：多个 Agent 在虚拟环境中基于握手协议交互。适合头脑风暴或红蓝对抗。</li>\n</ol>\n<h4>7.8.2 状态机图与图工作流</h4>\n<p>引入 LangGraph 等图架构概念。产品经理不仅要画流程图，更要画状态流转图，明确 State Variables 和 Edges。</p>\n", "plain": "   7. Agent：让 AI 执行多步骤任务\n\n    7.1 Agent 是什么\n\nAgent 是能够围绕目标进行多步骤规划、调用工具、观察结果、调整行动并完成任务的 AI 系统。\n\n产品视角公式：\n\n   text\nAgent = Model + Memory + Planning + Tool Use + Runtime / Harness + Guardrails\n   \n\n也可以简化为：\n\n   text\nAgent = 模型 + 驾驭系统\n   \n\n模型负责理解和生成，驾驭系统负责上下文、工具、权限、记忆、执行、验证和安全。\n\n    7.2 Agent 与 Workflow 的区别\n\n  维度   Workflow   Agent  \n             \n  流程   预先设计   可动态规划  \n  路径   固定或半固定   根据任务变化  \n  可控性   强   相对弱，需要治理  \n  适合场景   标准业务流程   开放复杂任务  \n  风险   较低   较高  \n  产品重点   节点设计   工具、权限、记忆、验证  \n\n产品判断：\n\n  流程明确、规则固定：优先 Workflow。\n  任务开放、多步骤、路径不确定：考虑 Agent。\n  高风险动作：Agent 只建议，不直接执行，必须人审。\n\n    7.3 Agent 三层架构\n\n  层级   核心问题   产品经理关注点  \n             \n  Control 控制层   谁说了算？   用户授权、权限边界、人工确认、策略规则  \n  Agency 代理层   Agent 能做什么？   工具清单、任务边界、可访问数据、可执行动作  \n  Runtime 运行层   如何持续运行？   上下文管理、任务状态、日志、重试、失败恢复  \n\n    7.4 Agent 常见范式\n\n     7.4.1 ReAct\n\nReAct = Reasoning + Acting。  \n模型一边思考，一边调用工具，再根据工具结果继续行动。\n\n适合：\n\n  搜索问题。\n  多步查询。\n  工具调用。\n  数据分析。\n\n风险：\n\n  工具调用过多。\n  路径发散。\n  结果不稳定。\n\n     7.4.2 Plan and Solve\n\n先制定计划，再逐步执行。\n\n适合：\n\n  任务路径较清晰。\n  需要高效执行。\n  需要展示执行计划。\n\n风险：\n\n  初始计划错了，后续全错。\n  不适合高度动态的任务。\n\n     7.4.3 Reflection\n\n执行后进行反思、自检、修正。\n\n适合：\n\n  写作润色。\n  代码修复。\n  文档审查。\n  质量要求高的输出。\n\n风险：\n\n  反思不等于真实验证。\n  可能反复修改但没有实质提升。\n\n     7.4.4 Multi Agent\n\n多个 Agent 分工协作，例如规划者、执行者、评审者。\n\n适合：\n\n  复杂任务。\n  需要角色分工。\n  需要评审和复核。\n\n风险：\n\n  成本高。\n  协作链路复杂。\n  责任边界不清。\n\n    7.5 Agent 工程的核心：Harness\n\nHarness 可以理解为“驾驭系统”，是模型之外的一整套控制系统。\n\n它包括：\n\n  上下文工程。\n  工具注册与调用。\n  权限控制。\n  文件系统隔离。\n  状态管理。\n  记忆管理。\n  日志追踪。\n  任务队列。\n  验证器。\n  人工审批。\n  回滚机制。\n  成本限制。\n\n    7.6 上下文工程：Agent 的核心战场\n\nAgent 不是只靠模型强，而是靠“每一步让模型看到正确的信息”。\n\n上下文工程四个动作：\n\n  动作   说明   示例  \n             \n  Write 写入   把重要状态写入可持久化位置   任务计划、决策记录、执行日志  \n  Select 选择   只把当前任务需要的信息放进上下文   相关文件、相关历史、相关工具  \n  Compress 压缩   把长历史压缩成摘要   会话摘要、阶段总结  \n  Isolate 隔离   子任务隔离，避免互相污染   子 Agent、临时目录、沙箱  \n\n    7.7 Agent 常见问题与解法\n\n  问题   症状   解法  \n             \n  上下文腐化   对话越长越混乱   外部记忆、任务状态、阶段摘要  \n  错误累积   前面错了后面继续错   检查点、回滚、验证器  \n  一次性做完   漏项、质量差   拆成小任务，逐步验收  \n  过早宣布完成   没做完就说完成   明确完成标准和自检清单  \n  工具滥用   频繁调用无关工具   工具白名单、调用预算  \n  越权操作   访问或修改不该动的数据   权限分级、人工确认  \n  成本失控   多轮循环调用模型   预算上限、停止条件  \n\n    7.8 Agent 验证与质量门控\n\n推荐闭环：\n\n   text\nPlanner 制定计划\n→ Generator 执行任务\n→ Evaluator 评估结果\n→ 不合格则修复\n→ 通过则输出\n→ 全程日志留痕\n   \n\n常见验证方式：\n\n  Schema 校验。\n  引用来源校验。\n  单元测试。\n  E2E 测试。\n  Playwright 浏览器测试。\n  人工审核。\n  事实一致性检查。\n  安全策略检查。\n\n    7.9 Agent 外部接口能力\n\n  接口   作用   产品经理理解  \n             \n  文件系统   读写本地文件   风险高，需要权限控制  \n  HTTP REST API   调用业务系统接口   企业最常见集成方式  \n  WebSocket   实时双向通信   实时状态、协作场景  \n  SSE   服务端持续推送   流式输出、任务进度  \n  Function Calling / Tool Use   模型调用函数   工具输入输出必须结构化  \n  MCP   标准化连接数据源和工具   类似 AI 应用的标准接口层  \n  Computer Use   操作屏幕和 GUI   通用但不够稳定，风险高  \n  Browser Control / CDP / Playwright   精准控制浏览器   Web 自动化、测试、采集  \n  A2A / Agent to Agent   Agent 之间通信   多 Agent 协作和任务分发  \n\n    7.10 Computer Use 与浏览器操控的区别\n\n  对比项   Computer Use   浏览器操控 / CDP / Playwright  \n             \n  原理   看屏幕、点按钮、键盘操作   直接操控 DOM / 浏览器协议  \n  精度   依赖视觉识别   元素级精确  \n  范围   任意 GUI 应用   浏览器内应用  \n  稳定性   较弱   较强  \n  代表场景   通用桌面操作   Web 自动化、测试、采集  \n\n\n    7.11 v1.2 增强：Agent 工程化概念索引\n\nv1.1 已经说明 Agent 的基本形态：规划、记忆、工具调用、运行时、上下文工程、权限与验证。v1.2 在这个基础上补齐“Agent 工程化落地”的关键概念，不改变原 Agent 章节的判断：  能用 Workflow 解决的，不要优先上复杂 Agent；必须用 Agent 时，要先设计控制系统，再设计模型提示词。  \n\n     7.11.1 Agent Hardness：任务复杂度分级\n\nAgent Hardness 用来判断一个场景需要多复杂的智能体能力。\n\n  等级   类型   推荐实现   产品判断  \n                 \n  L0   普通问答   LLM / RAG   不需要 Agent  \n  L1   单次工具调用   Function Calling / MCP Tool   模型只需要选择一个工具  \n  L2   固定多步骤流程   Workflow   路径固定，优先流程编排  \n  L3   动态路径、多工具选择   轻量 Agent   任务路径不固定，但风险可控  \n  L4   长任务、状态记忆、中途恢复   Agent + Harness   需要任务状态、日志、恢复、验证  \n  L5   高风险跨系统执行   Agent + 权限 + 人审 + 审计 + 回滚   涉及资金、权限、生产系统、法律责任  \n\n核心原则：  Agent Hardness 越高，越不能只靠 Prompt，必须增加 Harness、权限、验证、审计、回滚和人工确认。  \n\n     7.11.2 Agent Harness：运行时控制层\n\nHarness 是模型之外的运行时控制系统，解决 Agent 如何被控制、被观察、被验证、被回滚。\n\n产品经理需要把 Harness 拆成以下组件：\n\n   text\nAgent Harness\n├─ 任务状态管理\n├─ 上下文选择与压缩\n├─ Tool / MCP 接入\n├─ Skill 加载与触发\n├─ Instruction / Rule 注入\n├─ Memory / 项目记忆\n├─ Trace / 日志 / 可观测性\n├─ Hook / 确定性校验\n├─ 权限控制\n├─ 人工审批\n├─ Fallback\n└─ 回滚与审计\n   \n\n一句话：  模型负责生成可能的行动，Harness 负责限制行动范围、记录执行过程、判断结果是否合格。  \n\n     7.11.3 Skill：Agent 的可复用任务能力包\n\nSkill 是把某类任务的操作流程、领域知识、模板、脚本、参考资料和校验规则封装成可复用能力包。它不是一次性的 Prompt，也不是单个工具 API。\n\n   text\nmy skill/\n├─ SKILL.md            入口说明：什么时候触发、如何执行\n├─ references/         参考资料、规范、模板说明\n├─ scripts/            高确定性处理脚本\n├─ assets/             模板、样例文件、图表素材\n└─ evals/              触发测试、输出测试、回归测试\n   \n\n产品经理要特别关注 Skill 的  description ：它决定 Agent 什么时候会触发这个 Skill。描述过宽会误触发，描述过窄会漏触发。\n\n     7.11.4 Instruction / Manifest：项目级长期规则\n\n AGENTS.md 、 CLAUDE.md 、 GEMINI.md 、 .github/copilot instructions.md 、Cursor Rules 等文件属于 Agent Instruction / Manifest。它们的作用是为 Agent 提供长期上下文，例如项目结构、构建命令、测试命令、代码风格、安全要求、交付标准。\n\n边界判断：\n\n  对象   更适合放什么  \n         \n  Prompt   当前一次任务的目标、输入、输出要求  \n  Instruction / Manifest   项目长期规则、架构、约束、测试命令  \n  Skill   某类可复用任务的执行流程、模板、校验规则  \n  Tool / MCP   Agent 可以调用的外部动作能力  \n  Hook   工具调用前后、提交前后、停止前后的确定性校验  \n\n     7.11.5 Hook：确定性控制点\n\nHook 是 Agent 生命周期中的确定性脚本或控制点，适合做“必须执行”的事情，例如：\n\n  工具调用前检查危险命令。\n  工具调用后检查输出格式。\n  修改文件后自动运行测试。\n  输出前做 Schema 校验。\n  停止前生成执行摘要。\n  检测 API Key、密钥、隐私数据泄露。\n\n核心原则：  能用确定性脚本完成的校验，不要交给模型自由发挥；Skill 负责指导，Hook 负责强制。  \n\n     7.11.6 Subagent：复杂任务的上下文隔离\n\nSubagent 是为专门任务启动的子代理，常用于调研、代码审查、测试、文档分析、方案评估等任务。它的价值是隔离上下文、并行处理、减少主 Agent 的上下文污染。\n\n产品判断：\n\n  适合使用 Subagent   不适合使用 Subagent  \n         \n  可并行调研、可独立验证的子任务   强依赖全局上下文的一体化决策  \n  大型代码库分析、文档审查、测试生成   简单问答、单工具调用、固定流程  \n  多方案比较、错误定位、评审复核   高风险动作直接执行  \n\n     7.11.7 Skill / Tool / MCP / Hook / Harness 的关系\n\n   text\n用户任务\n→ Prompt 描述本次目标\n→ Instruction / Manifest 提供项目长期规则\n→ Agent 判断任务复杂度\n→ Skill 提供可复用任务流程\n→ Tool / MCP 提供外部动作能力\n→ Hook 在关键节点做确定性校验\n→ Harness 管理上下文、状态、权限、日志、回滚\n→ Eval / Governance 判断结果是否可接受\n   \n\n一句话区分：\n\n  Skill 教 Agent 怎么做一类事；Tool 给 Agent 一个动作；MCP 标准化连接工具和数据；Hook 强制关键节点校验；Harness 把这些组织成可控运行环境。\n\n\n   \n\n   \n\n    7.8 v1.3 进阶：Multi-Agent 协同模式\n\n面对企业级复杂长流程，单体大模型容易遭遇“指令迷失”。多智能体协作（Multi-Agent）通过角色拆分与上下文隔离解决此问题。\n\n    7.8.1 典型 Multi-Agent 架构\n\n1. Supervisor (主管-下属) 模式：一个高级 LLM 扮演 Router，拆解任务给多个垂直子 Agent，最后汇总。适合明确分工。\n2. Swarm / Peer-to-Peer 模式：多个 Agent 在虚拟环境中基于握手协议交互。适合头脑风暴或红蓝对抗。\n\n    7.8.2 状态机图与图工作流\n\n引入 LangGraph 等图架构概念。产品经理不仅要画流程图，更要画状态流转图，明确 State Variables 和 Edges。\n", "is_new": true}, {"num": 8, "title": "工具调用、MCP 与 AI 应用架构", "html": "<h2>8. 工具调用、MCP 与 AI 应用架构</h2>\n<h3>8.1 Function Calling / Tool Use</h3>\n<p>Function Calling 是让模型按定义好的工具 Schema 生成调用参数，由系统执行工具，再把结果返回给模型。</p>\n<p>关键点：</p>\n<ul>\n<li>工具名称要清晰。</li>\n<li>工具描述要准确。</li>\n<li>输入参数要结构化。</li>\n<li>输出结果要可读、可验证。</li>\n<li>工具权限要受控。</li>\n<li>高风险动作要人工确认。</li>\n</ul>\n<p>示例：</p>\n<pre><code class=\"language-json\">{\n  &quot;tool_name&quot;: &quot;search_contract_clauses&quot;,\n  &quot;description&quot;: &quot;根据关键词检索合同条款&quot;,\n  &quot;input_schema&quot;: {\n    &quot;keyword&quot;: &quot;string&quot;,\n    &quot;contract_id&quot;: &quot;string&quot;,\n    &quot;top_k&quot;: &quot;number&quot;\n  }\n}\n</code></pre>\n<h3>8.2 MCP 是什么</h3>\n<p>MCP，Model Context Protocol，是一种让 AI 应用标准化连接外部数据源、工具和工作流的开放协议。</p>\n<p>产品理解：</p>\n<pre><code class=\"language-text\">MCP = AI 应用连接外部能力的标准接口层\n</code></pre>\n<p>它解决的问题：</p>\n<ul>\n<li>每个 AI 应用都要单独接一遍工具。</li>\n<li>工具调用方式不统一。</li>\n<li>数据源接入重复建设。</li>\n<li>Agent 难以安全访问企业系统。</li>\n</ul>\n<h3>8.3 MCP 与传统 API 的区别</h3>\n<table>\n<thead>\n<tr>\n  <th>维度</th>\n  <th>传统 API</th>\n  <th>MCP</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>使用者</td>\n  <td>人写代码调用</td>\n  <td>AI 应用 / Agent 调用</td>\n</tr>\n<tr>\n  <td>设计重点</td>\n  <td>系统间通信</td>\n  <td>让模型理解可用工具和上下文</td>\n</tr>\n<tr>\n  <td>输入输出</td>\n  <td>面向开发者</td>\n  <td>面向模型可理解的 Schema 和描述</td>\n</tr>\n<tr>\n  <td>能力发现</td>\n  <td>通常靠文档</td>\n  <td>可暴露工具、资源、提示词等能力</td>\n</tr>\n<tr>\n  <td>权限</td>\n  <td>系统权限</td>\n  <td>还需要模型调用权限和用户授权</td>\n</tr>\n</tbody>\n</table>\n<h3>8.4 AI 应用常见架构</h3>\n<pre><code class=\"language-text\">前端交互层\n→ 后端服务层\n→ 模型网关\n→ Prompt / Workflow / Agent 编排层\n→ RAG 知识库\n→ 工具 / API / MCP 层\n→ 业务系统 / 数据库 / 文件系统\n→ 评测、日志、监控、权限、安全治理\n</code></pre>\n<h3>8.5 模型网关</h3>\n<p>模型网关负责统一管理模型调用。</p>\n<p>功能：</p>\n<ul>\n<li>多模型接入。</li>\n<li>模型路由。</li>\n<li>API Key 管理。</li>\n<li>调用日志。</li>\n<li>成本统计。</li>\n<li>限流。</li>\n<li>缓存。</li>\n<li>降级。</li>\n<li>敏感词 / 脱敏。</li>\n<li>统一鉴权。</li>\n</ul>\n<h3>8.6 企业 AI 系统常见组件</h3>\n<table>\n<thead>\n<tr>\n  <th>组件</th>\n  <th>作用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>用户系统</td>\n  <td>登录、组织、角色、权限</td>\n</tr>\n<tr>\n  <td>文档管理</td>\n  <td>上传、版本、权限、解析</td>\n</tr>\n<tr>\n  <td>知识库</td>\n  <td>Chunk、Embedding、索引、检索</td>\n</tr>\n<tr>\n  <td>Prompt 管理</td>\n  <td>模板、版本、变量、灰度</td>\n</tr>\n<tr>\n  <td>Workflow 引擎</td>\n  <td>节点编排、条件分支、人工审核</td>\n</tr>\n<tr>\n  <td>Agent Runtime</td>\n  <td>状态、工具、记忆、执行循环</td>\n</tr>\n<tr>\n  <td>工具注册中心</td>\n  <td>工具定义、权限、调用日志</td>\n</tr>\n<tr>\n  <td>评测平台</td>\n  <td>测试集、评分、回归测试</td>\n</tr>\n<tr>\n  <td>监控平台</td>\n  <td>时延、成本、错误、质量反馈</td>\n</tr>\n<tr>\n  <td>审计系统</td>\n  <td>数据访问、操作记录、合规留痕</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n\n<h3>8.5 v1.3 进阶：MCP 协议与企业网关</h3>\n<p>MCP (Model Context Protocol) 是打通模型与企业系统的标准化开放协议。</p>\n<h4>8.5.1 企业级 MCP 的核心对象</h4>\n<ul>\n<li><strong>Resources (资源)</strong>: 提供本地/云端数据的只读访问。</li>\n<li><strong>Prompts (模板)</strong>: 服务器端托管的可重用提示词。</li>\n<li><strong>Tools (工具)</strong>: 模型可执行的操作（如提交 JIRA）。</li>\n</ul>\n<h4>8.5.2 安全治理设计要点</h4>\n<ul>\n<li><strong>身份鉴权</strong>：必须设计 User-Level 鉴权方案，Agent 仅继承当前用户权限。</li>\n<li><strong>Human-in-the-loop</strong>：涉及写操作必须设计界面执行前二次确认 (Approval UX)。</li>\n</ul>\n", "plain": "   8. 工具调用、MCP 与 AI 应用架构\n\n    8.1 Function Calling / Tool Use\n\nFunction Calling 是让模型按定义好的工具 Schema 生成调用参数，由系统执行工具，再把结果返回给模型。\n\n关键点：\n\n  工具名称要清晰。\n  工具描述要准确。\n  输入参数要结构化。\n  输出结果要可读、可验证。\n  工具权限要受控。\n  高风险动作要人工确认。\n\n示例：\n\n   json\n{\n  \"tool name\": \"search contract clauses\",\n  \"description\": \"根据关键词检索合同条款\",\n  \"input schema\": {\n    \"keyword\": \"string\",\n    \"contract id\": \"string\",\n    \"top k\": \"number\"\n  }\n}\n   \n\n    8.2 MCP 是什么\n\nMCP，Model Context Protocol，是一种让 AI 应用标准化连接外部数据源、工具和工作流的开放协议。\n\n产品理解：\n\n   text\nMCP = AI 应用连接外部能力的标准接口层\n   \n\n它解决的问题：\n\n  每个 AI 应用都要单独接一遍工具。\n  工具调用方式不统一。\n  数据源接入重复建设。\n  Agent 难以安全访问企业系统。\n\n    8.3 MCP 与传统 API 的区别\n\n  维度   传统 API   MCP  \n             \n  使用者   人写代码调用   AI 应用 / Agent 调用  \n  设计重点   系统间通信   让模型理解可用工具和上下文  \n  输入输出   面向开发者   面向模型可理解的 Schema 和描述  \n  能力发现   通常靠文档   可暴露工具、资源、提示词等能力  \n  权限   系统权限   还需要模型调用权限和用户授权  \n\n    8.4 AI 应用常见架构\n\n   text\n前端交互层\n→ 后端服务层\n→ 模型网关\n→ Prompt / Workflow / Agent 编排层\n→ RAG 知识库\n→ 工具 / API / MCP 层\n→ 业务系统 / 数据库 / 文件系统\n→ 评测、日志、监控、权限、安全治理\n   \n\n    8.5 模型网关\n\n模型网关负责统一管理模型调用。\n\n功能：\n\n  多模型接入。\n  模型路由。\n  API Key 管理。\n  调用日志。\n  成本统计。\n  限流。\n  缓存。\n  降级。\n  敏感词 / 脱敏。\n  统一鉴权。\n\n    8.6 企业 AI 系统常见组件\n\n  组件   作用  \n         \n  用户系统   登录、组织、角色、权限  \n  文档管理   上传、版本、权限、解析  \n  知识库   Chunk、Embedding、索引、检索  \n  Prompt 管理   模板、版本、变量、灰度  \n  Workflow 引擎   节点编排、条件分支、人工审核  \n  Agent Runtime   状态、工具、记忆、执行循环  \n  工具注册中心   工具定义、权限、调用日志  \n  评测平台   测试集、评分、回归测试  \n  监控平台   时延、成本、错误、质量反馈  \n  审计系统   数据访问、操作记录、合规留痕  \n\n   \n\n   \n\n    8.5 v1.3 进阶：MCP 协议与企业网关\n\nMCP (Model Context Protocol) 是打通模型与企业系统的标准化开放协议。\n\n    8.5.1 企业级 MCP 的核心对象\n\n  Resources (资源): 提供本地/云端数据的只读访问。\n  Prompts (模板): 服务器端托管的可重用提示词。\n  Tools (工具): 模型可执行的操作（如提交 JIRA）。\n\n    8.5.2 安全治理设计要点\n\n  身份鉴权：必须设计 User-Level 鉴权方案，Agent 仅继承当前用户权限。\n  Human-in-the-loop：涉及写操作必须设计界面执行前二次确认 (Approval UX)。\n", "is_new": false}, {"num": 9, "title": "AI 产品设计方法", "html": "<h2>9. AI 产品设计方法</h2>\n<h3>9.1 场景判断：这个需求适不适合 AI</h3>\n<p>判断问题：</p>\n<ol>\n<li>是否存在大量非结构化文本、图片、文档或对话？</li>\n<li>是否需要自然语言理解或生成？</li>\n<li>是否有明确的业务知识来源？</li>\n<li>结果是否允许人工审核？</li>\n<li>错误成本是否可控？</li>\n<li>是否有足够样本用于评测？</li>\n<li>能否定义清晰的成功指标？</li>\n<li>是否能带来效率、质量、成本或体验改善？</li>\n</ol>\n<h3>9.2 AI 适配方式选择</h3>\n<table>\n<thead>\n<tr>\n  <th>需求</th>\n  <th>推荐方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>内容生成</td>\n  <td>LLM + Prompt + 模板</td>\n</tr>\n<tr>\n  <td>企业知识问答</td>\n  <td>RAG</td>\n</tr>\n<tr>\n  <td>文档字段抽取</td>\n  <td>LLM + Schema + 校验</td>\n</tr>\n<tr>\n  <td>标准流程自动化</td>\n  <td>Workflow</td>\n</tr>\n<tr>\n  <td>开放复杂任务</td>\n  <td>Agent</td>\n</tr>\n<tr>\n  <td>精确查询统计</td>\n  <td>SQL / BI + LLM 解读</td>\n</tr>\n<tr>\n  <td>高频客服</td>\n  <td>意图识别 + FAQ/RAG + 人工兜底</td>\n</tr>\n<tr>\n  <td>高风险决策</td>\n  <td>AI 建议 + 人工审批</td>\n</tr>\n</tbody>\n</table>\n<h3>9.3 AI 产品 PRD 必须增加的内容</h3>\n<p>传统 PRD 常写页面、流程、字段，但 AI PRD 还要写：</p>\n<ul>\n<li>AI 能力边界。</li>\n<li>使用模型和备选模型。</li>\n<li>输入资料范围。</li>\n<li>知识来源和版本。</li>\n<li>Prompt 模板。</li>\n<li>输出 Schema。</li>\n<li>引用来源规则。</li>\n<li>不确定性处理。</li>\n<li>幻觉控制策略。</li>\n<li>质量评测指标。</li>\n<li>人工审核机制。</li>\n<li>数据权限和脱敏。</li>\n<li>调用成本估算。</li>\n<li>日志和审计。</li>\n<li>失败兜底。</li>\n<li>上线监控。</li>\n</ul>\n<h3>9.4 AI 功能设计模板</h3>\n<pre><code class=\"language-text\">功能名称：\n业务目标：\n目标用户：\n使用场景：\n输入：\n输出：\nAI 能力类型：LLM / RAG / Workflow / Agent / Tool Use\n知识来源：\n处理流程：\nPrompt 设计：\n输出 Schema：\n人工审核点：\n异常处理：\n质量指标：\n成本估算：\n风险控制：\n上线范围：\n验收标准：\n</code></pre>\n<h3>9.5 AI 交互形态</h3>\n<table>\n<thead>\n<tr>\n  <th>形态</th>\n  <th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>聊天框</td>\n  <td>开放问答、探索式使用</td>\n</tr>\n<tr>\n  <td>表单 + AI</td>\n  <td>结构化任务、字段生成</td>\n</tr>\n<tr>\n  <td>文档编辑器 + AI</td>\n  <td>报告、标书、合同、纪要</td>\n</tr>\n<tr>\n  <td>工作台 Copilot</td>\n  <td>在业务系统内辅助操作</td>\n</tr>\n<tr>\n  <td>审核队列</td>\n  <td>AI 生成后人工确认</td>\n</tr>\n<tr>\n  <td>自动化 Workflow</td>\n  <td>固定流程批量处理</td>\n</tr>\n<tr>\n  <td>Agent 控制台</td>\n  <td>多步骤任务执行与追踪</td>\n</tr>\n<tr>\n  <td>看板 + AI 解读</td>\n  <td>数据分析、经营分析</td>\n</tr>\n</tbody>\n</table>\n<h3>9.6 AI 输出体验设计</h3>\n<p>优秀 AI 输出应包括：</p>\n<ul>\n<li>直接答案。</li>\n<li>依据来源。</li>\n<li>置信度或依据充分性。</li>\n<li>可编辑内容。</li>\n<li>可追问入口。</li>\n<li>一键引用 / 插入。</li>\n<li>重新生成。</li>\n<li>反馈按钮。</li>\n<li>不确定提示。</li>\n<li>风险提示。</li>\n<li>人工确认按钮。</li>\n</ul>\n<hr />\n<hr />\n\n<h3>9.6 v1.4 前沿：Generative UI 与流式渲染 (UI-on-the-fly)</h3>\n<p>传统 AI 产品多采用 LUI (Language User Interface，即对话框)，但文字的交互效率低于 GUI (图形界面)。</p>\n<h4>9.6.1 什么是 Generative UI</h4>\n<p>Generative UI 是指模型不仅返回文字 JSON，更是根据用户意图，流式返回一个<strong>完整的、可交互的组件 (如 React/Vue Component)</strong>。例如，问“本月销售数据”，返回的不是一段解释，而是一张动态折线图，甚至图表上的点可以直接拖拽修改。</p>\n<h4>9.6.2 产品设计落地点</h4>\n<ul>\n<li><strong>TTFT 与 TTI 优化</strong>：Time To First Token 只是吐字的延迟，Time To Interactive 才是组件可交互的延迟。需要设计流式加载骨架屏。</li>\n<li><strong>混合交互</strong>：将 AI 组件自然地插入传统的 SaaS 仪表盘中，而非跳转到单独的聊天页面。</li>\n</ul>\n", "plain": "   9. AI 产品设计方法\n\n    9.1 场景判断：这个需求适不适合 AI\n\n判断问题：\n\n1. 是否存在大量非结构化文本、图片、文档或对话？\n2. 是否需要自然语言理解或生成？\n3. 是否有明确的业务知识来源？\n4. 结果是否允许人工审核？\n5. 错误成本是否可控？\n6. 是否有足够样本用于评测？\n7. 能否定义清晰的成功指标？\n8. 是否能带来效率、质量、成本或体验改善？\n\n    9.2 AI 适配方式选择\n\n  需求   推荐方式  \n         \n  内容生成   LLM + Prompt + 模板  \n  企业知识问答   RAG  \n  文档字段抽取   LLM + Schema + 校验  \n  标准流程自动化   Workflow  \n  开放复杂任务   Agent  \n  精确查询统计   SQL / BI + LLM 解读  \n  高频客服   意图识别 + FAQ/RAG + 人工兜底  \n  高风险决策   AI 建议 + 人工审批  \n\n    9.3 AI 产品 PRD 必须增加的内容\n\n传统 PRD 常写页面、流程、字段，但 AI PRD 还要写：\n\n  AI 能力边界。\n  使用模型和备选模型。\n  输入资料范围。\n  知识来源和版本。\n  Prompt 模板。\n  输出 Schema。\n  引用来源规则。\n  不确定性处理。\n  幻觉控制策略。\n  质量评测指标。\n  人工审核机制。\n  数据权限和脱敏。\n  调用成本估算。\n  日志和审计。\n  失败兜底。\n  上线监控。\n\n    9.4 AI 功能设计模板\n\n   text\n功能名称：\n业务目标：\n目标用户：\n使用场景：\n输入：\n输出：\nAI 能力类型：LLM / RAG / Workflow / Agent / Tool Use\n知识来源：\n处理流程：\nPrompt 设计：\n输出 Schema：\n人工审核点：\n异常处理：\n质量指标：\n成本估算：\n风险控制：\n上线范围：\n验收标准：\n   \n\n    9.5 AI 交互形态\n\n  形态   适用场景  \n         \n  聊天框   开放问答、探索式使用  \n  表单 + AI   结构化任务、字段生成  \n  文档编辑器 + AI   报告、标书、合同、纪要  \n  工作台 Copilot   在业务系统内辅助操作  \n  审核队列   AI 生成后人工确认  \n  自动化 Workflow   固定流程批量处理  \n  Agent 控制台   多步骤任务执行与追踪  \n  看板 + AI 解读   数据分析、经营分析  \n\n    9.6 AI 输出体验设计\n\n优秀 AI 输出应包括：\n\n  直接答案。\n  依据来源。\n  置信度或依据充分性。\n  可编辑内容。\n  可追问入口。\n  一键引用 / 插入。\n  重新生成。\n  反馈按钮。\n  不确定提示。\n  风险提示。\n  人工确认按钮。\n\n   \n\n   \n\n    9.6 v1.4 前沿：Generative UI 与流式渲染 (UI-on-the-fly)\n\n传统 AI 产品多采用 LUI，但文字的交互效率低于 GUI。\n\n    9.6.1 什么是 Generative UI\n\nGenerative UI 是指模型根据用户意图，流式返回一个完整的、可交互的组件 (如动态图表、审批表单)。\n\n    9.6.2 产品设计落地点\n\n  TTFT 与 TTI 优化：设计流式加载骨架屏以掩盖组件渲染延迟。\n  混合交互：将 AI 组件自然地插入传统的 SaaS 仪表盘。\n", "is_new": false}, {"num": 10, "title": "AI 评测、质量与验收", "html": "<h2>10. AI 评测、质量与验收</h2>\n<h3>10.1 为什么 AI 产品必须做评测</h3>\n<p>AI 输出具有概率性，只看几次 Demo 无法证明可上线。必须用测试集验证稳定性。</p>\n<h3>10.2 评测类型</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>功能测试</td>\n  <td>流程是否跑通</td>\n</tr>\n<tr>\n  <td>格式测试</td>\n  <td>输出是否符合 Schema</td>\n</tr>\n<tr>\n  <td>事实测试</td>\n  <td>答案是否正确</td>\n</tr>\n<tr>\n  <td>引用测试</td>\n  <td>来源是否支持结论</td>\n</tr>\n<tr>\n  <td>鲁棒性测试</td>\n  <td>问法变化后是否稳定</td>\n</tr>\n<tr>\n  <td>边界测试</td>\n  <td>资料不足、恶意输入、无权限时如何处理</td>\n</tr>\n<tr>\n  <td>回归测试</td>\n  <td>Prompt / 模型 / 知识库更新后是否退化</td>\n</tr>\n<tr>\n  <td>人工评审</td>\n  <td>专家按标准打分</td>\n</tr>\n<tr>\n  <td>线上监控</td>\n  <td>真实用户使用质量和成本</td>\n</tr>\n</tbody>\n</table>\n<h3>10.3 AI 测试集怎么建</h3>\n<p>测试集至少包含：</p>\n<ul>\n<li>标准问题。</li>\n<li>同义改写问题。</li>\n<li>边界问题。</li>\n<li>无答案问题。</li>\n<li>容易误导的问题。</li>\n<li>跨文档问题。</li>\n<li>需要计算的问题。</li>\n<li>需要引用的问题。</li>\n<li>高风险问题。</li>\n<li>真实业务问题。</li>\n</ul>\n<p>每条测试样本应包括：</p>\n<pre><code class=\"language-text\">问题\n标准答案\n答案来源\n评分标准\n是否允许推理\n是否必须拒答\n风险等级\n</code></pre>\n<h3>10.4 质量评分维度</h3>\n<table>\n<thead>\n<tr>\n  <th>维度</th>\n  <th>评分问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>正确性</td>\n  <td>答案是否事实正确</td>\n</tr>\n<tr>\n  <td>完整性</td>\n  <td>是否覆盖问题所有要点</td>\n</tr>\n<tr>\n  <td>忠实度</td>\n  <td>是否忠于资料</td>\n</tr>\n<tr>\n  <td>可追溯</td>\n  <td>是否给出来源</td>\n</tr>\n<tr>\n  <td>稳定性</td>\n  <td>多次问是否一致</td>\n</tr>\n<tr>\n  <td>可用性</td>\n  <td>用户是否能直接使用</td>\n</tr>\n<tr>\n  <td>格式合规</td>\n  <td>是否符合输出格式</td>\n</tr>\n<tr>\n  <td>安全性</td>\n  <td>是否泄露或越权</td>\n</tr>\n<tr>\n  <td>成本</td>\n  <td>是否在预算内</td>\n</tr>\n</tbody>\n</table>\n<h3>10.5 上线质量门禁</h3>\n<p>上线前建议满足：</p>\n<ul>\n<li>Schema 通过率达到目标。</li>\n<li>关键问题正确率达到目标。</li>\n<li>无依据拒答率达到目标。</li>\n<li>高风险问题不得自动执行。</li>\n<li>所有关键结论有来源。</li>\n<li>有错误反馈入口。</li>\n<li>有人工接管机制。</li>\n<li>有日志审计。</li>\n<li>有成本监控。</li>\n<li>有回滚方案。</li>\n</ul>\n<hr />\n<hr />\n\n<h3>10.6 v1.3 进阶：LLM-as-a-Judge 与 SLM</h3>\n<h4>10.6.1 LLM-as-a-Judge 落地规范</h4>\n<p>人工验收成本高，使用强模型（GPT-4/Claude 3.5）做裁判是工业标配。</p>\n<ul>\n<li><strong>建立黄金测试集</strong>：100~500 个带标准规则的基础用例。</li>\n<li><strong>多维度评分 Schema</strong>：包括准确性、完整性和安全性。</li>\n<li><strong>RAGAS 评估指标</strong>：重点使用 Context Precision 和 Context Recall。</li>\n</ul>\n<h4>10.6.2 SLM (小语言模型) 端侧 ROI</h4>\n<p>针对数据敏感或成本敏感的高频查询，采用本地 Llama 3 8B 等 SLM，配合置信度向大模型降级路由机制。ROI 测算从按 Token 计费转向硬件算力摊销。</p>\n", "plain": "   10. AI 评测、质量与验收\n\n    10.1 为什么 AI 产品必须做评测\n\nAI 输出具有概率性，只看几次 Demo 无法证明可上线。必须用测试集验证稳定性。\n\n    10.2 评测类型\n\n  类型   说明  \n         \n  功能测试   流程是否跑通  \n  格式测试   输出是否符合 Schema  \n  事实测试   答案是否正确  \n  引用测试   来源是否支持结论  \n  鲁棒性测试   问法变化后是否稳定  \n  边界测试   资料不足、恶意输入、无权限时如何处理  \n  回归测试   Prompt / 模型 / 知识库更新后是否退化  \n  人工评审   专家按标准打分  \n  线上监控   真实用户使用质量和成本  \n\n    10.3 AI 测试集怎么建\n\n测试集至少包含：\n\n  标准问题。\n  同义改写问题。\n  边界问题。\n  无答案问题。\n  容易误导的问题。\n  跨文档问题。\n  需要计算的问题。\n  需要引用的问题。\n  高风险问题。\n  真实业务问题。\n\n每条测试样本应包括：\n\n   text\n问题\n标准答案\n答案来源\n评分标准\n是否允许推理\n是否必须拒答\n风险等级\n   \n\n    10.4 质量评分维度\n\n  维度   评分问题  \n         \n  正确性   答案是否事实正确  \n  完整性   是否覆盖问题所有要点  \n  忠实度   是否忠于资料  \n  可追溯   是否给出来源  \n  稳定性   多次问是否一致  \n  可用性   用户是否能直接使用  \n  格式合规   是否符合输出格式  \n  安全性   是否泄露或越权  \n  成本   是否在预算内  \n\n    10.5 上线质量门禁\n\n上线前建议满足：\n\n  Schema 通过率达到目标。\n  关键问题正确率达到目标。\n  无依据拒答率达到目标。\n  高风险问题不得自动执行。\n  所有关键结论有来源。\n  有错误反馈入口。\n  有人工接管机制。\n  有日志审计。\n  有成本监控。\n  有回滚方案。\n\n   \n\n   \n\n    10.6 v1.3 进阶：LLM-as-a-Judge 与 SLM\n\n    10.6.1 LLM-as-a-Judge 落地规范\n\n人工验收成本高，使用强模型（GPT-4/Claude 3.5）做裁判是工业标配。\n\n  建立黄金测试集：100~500 个带标准规则的基础用例。\n  多维度评分 Schema：包括准确性、完整性和安全性。\n  RAGAS 评估指标：重点使用 Context Precision 和 Context Recall。\n\n    10.6.2 SLM (小语言模型) 端侧 ROI\n\n针对数据敏感或成本敏感的高频查询，采用本地 Llama 3 8B 等 SLM，配合置信度向大模型降级路由机制。ROI 测算从按 Token 计费转向硬件算力摊销。\n", "is_new": false}, {"num": 11, "title": "数据、安全、权限与治理", "html": "<h2>11. 数据、安全、权限与治理</h2>\n<h3>11.1 AI 产品的数据风险</h3>\n<p>常见风险：</p>\n<ul>\n<li>用户把敏感资料发给外部模型。</li>\n<li>API Key 泄露。</li>\n<li>RAG 检索越权。</li>\n<li>模型输出泄露其他项目资料。</li>\n<li>Agent 执行越权操作。</li>\n<li>Prompt Injection 诱导泄露系统提示词或数据。</li>\n<li>日志中保存了敏感信息。</li>\n<li>训练或微调时误用隐私数据。</li>\n</ul>\n<h3>11.2 权限设计</h3>\n<p>企业 AI 权限至少包括：</p>\n<ul>\n<li>用户权限。</li>\n<li>组织权限。</li>\n<li>文档权限。</li>\n<li>知识库权限。</li>\n<li>工具权限。</li>\n<li>Agent 动作权限。</li>\n<li>审批权限。</li>\n<li>日志查看权限。</li>\n</ul>\n<p>RAG 权限原则：</p>\n<pre><code class=\"language-text\">用户不能访问的文档，AI 也不能替用户检索到。\n</code></pre>\n<h3>11.3 高风险动作控制</h3>\n<p>高风险动作包括：</p>\n<ul>\n<li>删除文件。</li>\n<li>修改合同。</li>\n<li>发送邮件。</li>\n<li>发起付款。</li>\n<li>修改业务系统数据。</li>\n<li>控制设备。</li>\n<li>提交审批。</li>\n<li>对外发布内容。</li>\n</ul>\n<p>控制方式：</p>\n<ul>\n<li>只读优先。</li>\n<li>白名单工具。</li>\n<li>人工确认。</li>\n<li>二次确认。</li>\n<li>操作预览。</li>\n<li>审计日志。</li>\n<li>回滚机制。</li>\n<li>权限分级。</li>\n</ul>\n<h3>11.4 Prompt Injection 防护</h3>\n<p>Prompt Injection 是用户或文档内容诱导模型忽略系统规则、泄露信息或执行越权动作。</p>\n<p>治理方式：</p>\n<ul>\n<li>系统规则优先级高于用户输入和文档内容。</li>\n<li>文档内容只作为资料，不作为指令。</li>\n<li>工具调用前做权限校验。</li>\n<li>不向模型暴露敏感系统提示词。</li>\n<li>检索结果加来源和权限标签。</li>\n<li>对外部网页内容保持不可信处理。</li>\n<li>高风险动作必须人工确认。</li>\n</ul>\n<hr />\n<hr />\n\n<h3>11.5 v1.4 前沿：Data Flywheel (数据飞轮) 与 DPO 工程化</h3>\n<p>顶级的 AI 产品靠数据护城河。如果不把用户在端侧的行为转化为微调资产，产品就永远只是一层套壳。</p>\n<ul>\n<li><strong>隐式反馈 (Implicit Feedback)</strong>：用户是否复制了答案？是否在生成的代码中删除了某几行？这代表了偏好。</li>\n<li><strong>显式反馈 (Explicit Feedback)</strong>：点赞、踩、或者由用户手工订正（例如纠正 RAG 提取错误的金额）。</li>\n<li><strong>DPO (直接偏好优化)</strong>：将以上“好答案”与“坏答案”构成一对 Preference Data，回流到后端直接微调模型或 Reranker 排序模型。</li>\n</ul>\n<h3>11.6 v1.4 前沿：AI Trust & Guardrails (安全护栏)</h3>\n<p>企业应用最大的阻碍是不可控。必须基于 OWASP Top 10 标准引入安全护栏：</p>\n<ul>\n<li><strong>Prompt Injection 防御</strong>：使用单独的小模型 (如 NeMo Guardrails) 在输入端拦截“忽略上述指令”的越狱攻击。</li>\n<li><strong>PII 敏感数据脱轨</strong>：把数据发给公有云 LLM 前，通过正则或 NER 将姓名/身份证掩码处理。</li>\n</ul>\n", "plain": "   11. 数据、安全、权限与治理\n\n    11.1 AI 产品的数据风险\n\n常见风险：\n\n  用户把敏感资料发给外部模型。\n  API Key 泄露。\n  RAG 检索越权。\n  模型输出泄露其他项目资料。\n  Agent 执行越权操作。\n  Prompt Injection 诱导泄露系统提示词或数据。\n  日志中保存了敏感信息。\n  训练或微调时误用隐私数据。\n\n    11.2 权限设计\n\n企业 AI 权限至少包括：\n\n  用户权限。\n  组织权限。\n  文档权限。\n  知识库权限。\n  工具权限。\n  Agent 动作权限。\n  审批权限。\n  日志查看权限。\n\nRAG 权限原则：\n\n   text\n用户不能访问的文档，AI 也不能替用户检索到。\n   \n\n    11.3 高风险动作控制\n\n高风险动作包括：\n\n  删除文件。\n  修改合同。\n  发送邮件。\n  发起付款。\n  修改业务系统数据。\n  控制设备。\n  提交审批。\n  对外发布内容。\n\n控制方式：\n\n  只读优先。\n  白名单工具。\n  人工确认。\n  二次确认。\n  操作预览。\n  审计日志。\n  回滚机制。\n  权限分级。\n\n    11.4 Prompt Injection 防护\n\nPrompt Injection 是用户或文档内容诱导模型忽略系统规则、泄露信息或执行越权动作。\n\n治理方式：\n\n  系统规则优先级高于用户输入和文档内容。\n  文档内容只作为资料，不作为指令。\n  工具调用前做权限校验。\n  不向模型暴露敏感系统提示词。\n  检索结果加来源和权限标签。\n  对外部网页内容保持不可信处理。\n  高风险动作必须人工确认。\n\n   \n\n   \n\n    11.5 v1.4 前沿：Data Flywheel (数据飞轮) 与 DPO 工程化\n\n顶级的 AI 产品靠数据护城河。\n\n  隐式反馈：复制、停留时长、部分采纳等行为偏好。\n  显式反馈：人工订正和点踩。\n  DPO (直接偏好优化)：用好坏对数据回流微调模型或 Reranker。\n\n    11.6 v1.4 前沿：AI Trust & Guardrails (安全护栏)\n\n必须基于 OWASP 标准引入安全护栏：\n\n  Prompt Injection 防御：输入端拦截越狱攻击。\n  PII 敏感数据脱轨：向大模型发数据前的掩码处理。\n", "is_new": false}, {"num": 12, "title": "AI 产品商业化与 ROI", "html": "<h2>12. AI 产品商业化与 ROI</h2>\n<h3>12.1 AI 项目的价值类型</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>说明</th>\n  <th>示例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>降本</td>\n  <td>减少人工、减少返工</td>\n  <td>智能客服、自动周报</td>\n</tr>\n<tr>\n  <td>增效</td>\n  <td>缩短处理周期</td>\n  <td>合同初审、标书生成</td>\n</tr>\n<tr>\n  <td>提质</td>\n  <td>降低错误率</td>\n  <td>质量检查、引用校验</td>\n</tr>\n<tr>\n  <td>增收</td>\n  <td>新产品、新服务</td>\n  <td>AI 代运营、AI SaaS</td>\n</tr>\n<tr>\n  <td>风险控制</td>\n  <td>合规、审计、预警</td>\n  <td>合同风险识别、消防值守留痕</td>\n</tr>\n<tr>\n  <td>体验提升</td>\n  <td>更自然、更快捷</td>\n  <td>Copilot、智能搜索</td>\n</tr>\n</tbody>\n</table>\n<h3>12.2 ROI 测算方法</h3>\n<pre><code class=\"language-text\">年度收益 = 节省人工成本 + 节省外包成本 + 缩短周期收益 + 减少错误损失 + 新增收入\n年度成本 = 模型成本 + 开发成本 + 数据治理成本 + 运维成本 + 培训成本 + 人工审核成本\nROI = (年度收益 - 年度成本) / 年度成本\n</code></pre>\n<h3>12.3 企业 AI 项目阶段</h3>\n<table>\n<thead>\n<tr>\n  <th>阶段</th>\n  <th>目标</th>\n  <th>产物</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>想法验证</td>\n  <td>判断是否值得做</td>\n  <td>场景清单、价值假设</td>\n</tr>\n<tr>\n  <td>PoC</td>\n  <td>验证技术可行</td>\n  <td>小样本 Demo、测试结果</td>\n</tr>\n<tr>\n  <td>MVP</td>\n  <td>验证业务可用</td>\n  <td>最小产品、核心流程</td>\n</tr>\n<tr>\n  <td>试点</td>\n  <td>验证组织可落地</td>\n  <td>试点项目、用户反馈</td>\n</tr>\n<tr>\n  <td>生产上线</td>\n  <td>稳定运行</td>\n  <td>权限、监控、SLA、运维</td>\n</tr>\n<tr>\n  <td>规模复制</td>\n  <td>多业务推广</td>\n  <td>标准方案、交付包、商业模式</td>\n</tr>\n</tbody>\n</table>\n<h3>12.4 AI 产品定价方式</h3>\n<table>\n<thead>\n<tr>\n  <th>定价方式</th>\n  <th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>按账号收费</td>\n  <td>企业知识助手、办公助手</td>\n</tr>\n<tr>\n  <td>按调用量收费</td>\n  <td>API 服务、模型网关</td>\n</tr>\n<tr>\n  <td>按知识库容量收费</td>\n  <td>文档型 RAG 产品</td>\n</tr>\n<tr>\n  <td>按项目收费</td>\n  <td>解决方案交付</td>\n</tr>\n<tr>\n  <td>按年费收费</td>\n  <td>SaaS 平台</td>\n</tr>\n<tr>\n  <td>按效果分成</td>\n  <td>降本增效明显的业务</td>\n</tr>\n<tr>\n  <td>建设费 + 运维费</td>\n  <td>企业系统集成</td>\n</tr>\n<tr>\n  <td>订阅 + 增值服务</td>\n  <td>代运营、智能服务</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   12. AI 产品商业化与 ROI\n\n    12.1 AI 项目的价值类型\n\n  类型   说明   示例  \n             \n  降本   减少人工、减少返工   智能客服、自动周报  \n  增效   缩短处理周期   合同初审、标书生成  \n  提质   降低错误率   质量检查、引用校验  \n  增收   新产品、新服务   AI 代运营、AI SaaS  \n  风险控制   合规、审计、预警   合同风险识别、消防值守留痕  \n  体验提升   更自然、更快捷   Copilot、智能搜索  \n\n    12.2 ROI 测算方法\n\n   text\n年度收益 = 节省人工成本 + 节省外包成本 + 缩短周期收益 + 减少错误损失 + 新增收入\n年度成本 = 模型成本 + 开发成本 + 数据治理成本 + 运维成本 + 培训成本 + 人工审核成本\nROI =  年度收益   年度成本  / 年度成本\n   \n\n    12.3 企业 AI 项目阶段\n\n  阶段   目标   产物  \n             \n  想法验证   判断是否值得做   场景清单、价值假设  \n  PoC   验证技术可行   小样本 Demo、测试结果  \n  MVP   验证业务可用   最小产品、核心流程  \n  试点   验证组织可落地   试点项目、用户反馈  \n  生产上线   稳定运行   权限、监控、SLA、运维  \n  规模复制   多业务推广   标准方案、交付包、商业模式  \n\n    12.4 AI 产品定价方式\n\n  定价方式   适用场景  \n         \n  按账号收费   企业知识助手、办公助手  \n  按调用量收费   API 服务、模型网关  \n  按知识库容量收费   文档型 RAG 产品  \n  按项目收费   解决方案交付  \n  按年费收费   SaaS 平台  \n  按效果分成   降本增效明显的业务  \n  建设费 + 运维费   企业系统集成  \n  订阅 + 增值服务   代运营、智能服务  \n\n   \n\n   ", "is_new": false}, {"num": 13, "title": "AI 工具生态地图", "html": "<h2>13. AI 工具生态地图</h2>\n<blockquote>\n<p>工具更新很快，本部分按能力类型整理，具体产品版本、价格和能力应以实时官网为准。</p>\n</blockquote>\n<h3>13.1 模型厂商</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>代表</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>国际通用模型</td>\n  <td>OpenAI、Anthropic、Google Gemini、xAI 等</td>\n</tr>\n<tr>\n  <td>国内通用模型</td>\n  <td>DeepSeek、通义千问、豆包、智谱、Kimi、文心等</td>\n</tr>\n<tr>\n  <td>开源模型</td>\n  <td>Llama、Qwen、Mistral、DeepSeek、Gemma 等</td>\n</tr>\n<tr>\n  <td>多模态模型</td>\n  <td>GPT、Claude、Gemini、Qwen-VL、Doubao Vision 等</td>\n</tr>\n</tbody>\n</table>\n<h3>13.2 AI 应用搭建平台</h3>\n<table>\n<thead>\n<tr>\n  <th>平台类型</th>\n  <th>代表</th>\n  <th>适合什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Agentic Workflow / 低代码</td>\n  <td>Dify、Coze、扣子、Flowise</td>\n  <td>快速搭建 AI 应用</td>\n</tr>\n<tr>\n  <td>自动化编排</td>\n  <td>n8n、Zapier、Make</td>\n  <td>办公自动化、系统连接</td>\n</tr>\n<tr>\n  <td>RAG 平台</td>\n  <td>RAGFlow、Dify Knowledge、LlamaIndex</td>\n  <td>企业知识库</td>\n</tr>\n<tr>\n  <td>本地客户端</td>\n  <td>Cherry Studio、Chatbox 等</td>\n  <td>个人多模型使用</td>\n</tr>\n</tbody>\n</table>\n<h3>13.3 Agent / RAG 开发框架</h3>\n<table>\n<thead>\n<tr>\n  <th>框架</th>\n  <th>典型用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>LangChain</td>\n  <td>LLM 应用与 Agent 开发</td>\n</tr>\n<tr>\n  <td>LangGraph</td>\n  <td>有状态、长运行、多节点 Agent 编排</td>\n</tr>\n<tr>\n  <td>LlamaIndex</td>\n  <td>数据连接、索引、RAG 应用</td>\n</tr>\n<tr>\n  <td>Haystack</td>\n  <td>搜索、问答、RAG Pipeline</td>\n</tr>\n<tr>\n  <td>AutoGen</td>\n  <td>多 Agent 协作</td>\n</tr>\n<tr>\n  <td>CrewAI</td>\n  <td>角色化 Agent 协作</td>\n</tr>\n<tr>\n  <td>Semantic Kernel</td>\n  <td>企业级插件、规划、编排</td>\n</tr>\n<tr>\n  <td>OpenAI Agents SDK</td>\n  <td>工具、交接、审批、追踪等 Agent 构建</td>\n</tr>\n<tr>\n  <td>MCP SDK</td>\n  <td>构建 MCP Server / Client</td>\n</tr>\n</tbody>\n</table>\n<h3>13.4 编程智能体</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>代表</th>\n  <th>典型用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>IDE Copilot</td>\n  <td>Cursor、GitHub Copilot、Trae、Windsurf</td>\n  <td>代码生成、重构、问答</td>\n</tr>\n<tr>\n  <td>CLI Agent</td>\n  <td>Claude Code、Codex CLI、Gemini CLI、OpenCode</td>\n  <td>多文件修改、测试、命令行任务</td>\n</tr>\n<tr>\n  <td>开源代理</td>\n  <td>Cline、Roo Code、OpenHands 等</td>\n  <td>本地开发自动化</td>\n</tr>\n</tbody>\n</table>\n<h3>13.5 学术与搜索智能体</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>代表</th>\n  <th>用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>通用搜索</td>\n  <td>Perplexity、秘塔、Kimi 搜索等</td>\n  <td>联网问答、资料搜集</td>\n</tr>\n<tr>\n  <td>学术搜索</td>\n  <td>Elicit、Consensus、Semantic Scholar、AMiner</td>\n  <td>文献检索、论文综述</td>\n</tr>\n<tr>\n  <td>深度研究</td>\n  <td>ChatGPT Deep Research、Gemini Deep Research 等</td>\n  <td>多步资料收集与报告</td>\n</tr>\n</tbody>\n</table>\n<h3>13.6 内容创作智能体</h3>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>代表</th>\n  <th>用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>文档 / PPT</td>\n  <td>Gamma、Canva、Tome、Beautiful.ai</td>\n  <td>方案、汇报、演示文稿</td>\n</tr>\n<tr>\n  <td>视频生成</td>\n  <td>Runway、Pika、可灵、即梦、Veo、Sora 等</td>\n  <td>视频创作</td>\n</tr>\n<tr>\n  <td>图片生成</td>\n  <td>Midjourney、DALL·E、GPT Image、即梦、Stable Diffusion</td>\n  <td>海报、概念图、素材</td>\n</tr>\n<tr>\n  <td>音频 / 配音</td>\n  <td>ElevenLabs、PlayHT、MiniMax Audio 等</td>\n  <td>配音、播客、语音交互</td>\n</tr>\n</tbody>\n</table>\n<h3>13.7 评测与可观测性</h3>\n<table>\n<thead>\n<tr>\n  <th>工具</th>\n  <th>用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>LangSmith</td>\n  <td>Trace、评测、调试、监控</td>\n</tr>\n<tr>\n  <td>Ragas</td>\n  <td>RAG 自动化评测</td>\n</tr>\n<tr>\n  <td>Promptfoo</td>\n  <td>Prompt / LLM 回归测试</td>\n</tr>\n<tr>\n  <td>TruLens</td>\n  <td>LLM 应用评测</td>\n</tr>\n<tr>\n  <td>Phoenix / Arize</td>\n  <td>可观测性与评估</td>\n</tr>\n<tr>\n  <td>Weights &amp; Biases Weave</td>\n  <td>LLM 应用追踪与评测</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<hr />\n", "plain": "   13. AI 工具生态地图\n\n  工具更新很快，本部分按能力类型整理，具体产品版本、价格和能力应以实时官网为准。\n\n    13.1 模型厂商\n\n  类型   代表  \n         \n  国际通用模型   OpenAI、Anthropic、Google Gemini、xAI 等  \n  国内通用模型   DeepSeek、通义千问、豆包、智谱、Kimi、文心等  \n  开源模型   Llama、Qwen、Mistral、DeepSeek、Gemma 等  \n  多模态模型   GPT、Claude、Gemini、Qwen VL、Doubao Vision 等  \n\n    13.2 AI 应用搭建平台\n\n  平台类型   代表   适合什么  \n             \n  Agentic Workflow / 低代码   Dify、Coze、扣子、Flowise   快速搭建 AI 应用  \n  自动化编排   n8n、Zapier、Make   办公自动化、系统连接  \n  RAG 平台   RAGFlow、Dify Knowledge、LlamaIndex   企业知识库  \n  本地客户端   Cherry Studio、Chatbox 等   个人多模型使用  \n\n    13.3 Agent / RAG 开发框架\n\n  框架   典型用途  \n         \n  LangChain   LLM 应用与 Agent 开发  \n  LangGraph   有状态、长运行、多节点 Agent 编排  \n  LlamaIndex   数据连接、索引、RAG 应用  \n  Haystack   搜索、问答、RAG Pipeline  \n  AutoGen   多 Agent 协作  \n  CrewAI   角色化 Agent 协作  \n  Semantic Kernel   企业级插件、规划、编排  \n  OpenAI Agents SDK   工具、交接、审批、追踪等 Agent 构建  \n  MCP SDK   构建 MCP Server / Client  \n\n    13.4 编程智能体\n\n  类型   代表   典型用途  \n             \n  IDE Copilot   Cursor、GitHub Copilot、Trae、Windsurf   代码生成、重构、问答  \n  CLI Agent   Claude Code、Codex CLI、Gemini CLI、OpenCode   多文件修改、测试、命令行任务  \n  开源代理   Cline、Roo Code、OpenHands 等   本地开发自动化  \n\n    13.5 学术与搜索智能体\n\n  类型   代表   用途  \n             \n  通用搜索   Perplexity、秘塔、Kimi 搜索等   联网问答、资料搜集  \n  学术搜索   Elicit、Consensus、Semantic Scholar、AMiner   文献检索、论文综述  \n  深度研究   ChatGPT Deep Research、Gemini Deep Research 等   多步资料收集与报告  \n\n    13.6 内容创作智能体\n\n  类型   代表   用途  \n             \n  文档 / PPT   Gamma、Canva、Tome、Beautiful.ai   方案、汇报、演示文稿  \n  视频生成   Runway、Pika、可灵、即梦、Veo、Sora 等   视频创作  \n  图片生成   Midjourney、DALL·E、GPT Image、即梦、Stable Diffusion   海报、概念图、素材  \n  音频 / 配音   ElevenLabs、PlayHT、MiniMax Audio 等   配音、播客、语音交互  \n\n    13.7 评测与可观测性\n\n  工具   用途  \n         \n  LangSmith   Trace、评测、调试、监控  \n  Ragas   RAG 自动化评测  \n  Promptfoo   Prompt / LLM 回归测试  \n  TruLens   LLM 应用评测  \n  Phoenix / Arize   可观测性与评估  \n  Weights & Biases Weave   LLM 应用追踪与评测  \n\n   \n\n   ", "is_new": false}, {"num": 14, "title": "行业应用场景库", "html": "<h2>14. 行业应用场景库</h2>\n<h3>14.1 企业知识库问答</h3>\n<p>场景：制度、流程、合同、项目资料、产品手册问答。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">RAG + 权限 + 引用来源 + 反馈学习\n</code></pre>\n<p>关键指标：</p>\n<ul>\n<li>回答准确率。</li>\n<li>引用准确率。</li>\n<li>无依据拒答率。</li>\n<li>文档更新时效。</li>\n<li>用户满意度。</li>\n</ul>\n<h3>14.2 合同 / 法务初审</h3>\n<p>场景：条款识别、风险提示、义务提取、违约责任判断。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">文档解析 + RAG + 条款抽取 + Schema + 人工复核\n</code></pre>\n<p>注意：不能让 AI 做最终法律结论，必须有人审。</p>\n<h3>14.3 标书 / 方案生成</h3>\n<p>场景：根据招标文件、企业资料、项目经验生成投标材料。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">资料索引 + 招标文件解析 + 缺失项澄清 + 文档生成 + 人工审阅\n</code></pre>\n<p>关键设计：</p>\n<ul>\n<li>素材库。</li>\n<li>章节模板。</li>\n<li>响应点检查。</li>\n<li>偏离表。</li>\n<li>格式一致性。</li>\n<li>Word 输出。</li>\n</ul>\n<h3>14.4 工程项目管理</h3>\n<p>场景：施工周报、质量安全问题、进度风险、会议纪要。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">RAG + Workflow + 报告模板 + 数据分析 + 人工审核\n</code></pre>\n<h3>14.5 FM / 运维管理</h3>\n<p>场景：报障、派单、巡检、维修记录、设备知识库。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">图像识别 + 工单 Workflow + 设备知识库 RAG + SLA 规则\n</code></pre>\n<h3>14.6 智慧消防 / 消控室远程值守</h3>\n<p>场景：报警识别、处置建议、操作留痕、集中监管。</p>\n<p>能力组合：</p>\n<pre><code class=\"language-text\">设备数据接入 + 规则引擎 + RAG 处置知识库 + Workflow + 人工确认 + 审计留痕\n</code></pre>\n<p>注意：涉及远程控制和安全责任，AI 应以辅助研判、辅助处置、生成记录为主，高风险控制动作必须严格授权与留痕。</p>\n<
