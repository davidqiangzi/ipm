name: Deploy to Self-hosted Node

on:
  push:
    branches:
      - dev0.1
      - dev0.2
      - main  # 监听的分支，可根据需要修改

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "*.html,*.css,*.js,assets/"
          target: ${{ secrets.SERVER_TARGET_PATH }}
          strip_components: 0

      - name: 🔗 Update index.html symlink
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd ${{ secrets.SERVER_TARGET_PATH }}
            ln -sf AI产品经理专业知识系统_v1.4_交互课件.html index.html
