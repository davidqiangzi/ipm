name: Deploy to Self-hosted Node

on:
  push:
    branches:
      - dev0.1
      - main  # 监听的分支，可根据需要修改

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }} # 如果没有配置 SERVER_PORT 则默认 22
          # 仅同步 HTML 和其他可能需要的静态文件，排除了脚本和源码文档
          source: "*.html,*.css,*.js,assets/"
          # 请在 GitHub Secrets 里配置真实的 Nginx 根目录，或者直接在这里硬编码替换掉
          target: ${{ secrets.SERVER_TARGET_PATH }}
          strip_components: 0
